<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NERIC - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="site-header">
        <div class="neric">NERIC</div>
    </div>

    <div class="login-container">

        <h1>Login to Access Sections</h1>

        <div class="login-line"></div>

        <p class="login-subtitle">
            Railway Work Management System
        </p>

        <div class="input-group">
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >
        </div>

        <div class="input-group">
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >
        </div>

        <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
        </label>

        <button type="button" id="loginButton">
            🔐 LOGIN
        </button>

        <div id="message"></div>

    </div>

    <!-- 🆕 تحميل مكتبة Supabase الأول (تم تصحيح الرابط) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- تحميل ملف السكريبت الأساسي -->
    <script src="script.js"></script>

    <!-- LOGIN SCRIPT -->
    <script>
        document.getElementById("loginButton").addEventListener("click", function () {
            if (typeof login === "function") {
                login();
            } else {
                console.error("login function not found. Make sure script.js is loaded.");
            }
        });

        document.getElementById("password").addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                if (typeof login === "function") {
                    login();
                }
            }
        });

        window.addEventListener("load", function () {
            const remembered = localStorage.getItem("rememberedUsername");
            if (remembered) {
                document.getElementById("username").value = remembered;
                document.getElementById("rememberMe").checked = true;
            }
        });
    </script>

    <!-- Firebase SDK: Web Push -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

    <!-- ملف دعم إشعارات الويب المنفصل -->
    <script src="push-web.js"></script>

    <!-- ملف Push الحالي: نحافظ عليه كما هو -->
    <script src="push.js"></script>

</body>
</html>
