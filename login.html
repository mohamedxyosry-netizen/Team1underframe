<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NERIC - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">


    <!-- ================================
         HEADER
    ================================= -->

    <div class="site-header">

        <div class="neric">
            NERIC
        </div>

    </div>


    <!-- ================================
         LOGIN
    ================================= -->

    <div class="login-container">

        <h1>
            Login to Access Sections
        </h1>

        <div class="login-line"></div>

        <p class="login-subtitle">
            Railway Work Management System
        </p>


        <!-- Username -->

        <div class="input-group">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

        </div>


        <!-- Remember Me -->

        <label class="remember">

            <input
                type="checkbox"
                id="rememberMe"
            >

            <span>
                Remember me
            </span>

        </label>


        <!-- Login Button -->

        <button
            type="button"
            id="loginButton">

            🔐 LOGIN

        </button>


        <!-- Message -->

        <div id="message"></div>

    </div>


    <!-- ================================
         LOGIN SCRIPT
    ================================= -->

    <script>

        const USERS = {

            "Yosry": {
                password: "0111252",
                role: "admin",
                name: "Yosry"
            },

            "Zezo": {
                password: "58321476",
                role: "wiring",
                name: "Zezo"
            },

            "Abdo": {
                password: "74185296",
                role: "wiring",
                name: "Abdo"
            },

            "Osama": {
                password: "29481736",
                role: "lt",
                name: "Osama"
            },

            "Yaser": {
                password: "63825194",
                role: "lt",
                name: "Yaser"
            },

            "Seif": {
                password: "81573924",
                role: "lt",
                name: "Seif"
            },

            "Ahmed Ayman": {
                password: "47291638",
                role: "lt",
                name: "Ahmed Ayman"
            },

            "Mamdouh": {
                password: "92638471",
                role: "ht",
                name: "Mamdouh"
            },

            "Ali": {
                password: "35182749",
                role: "ht",
                name: "Ali"
            },

            "Eid": {
                password: "68421937",
                role: "installation",
                name: "Eid"
            },

            "Mosad": {
                password: "51963827",
                role: "installation",
                name: "Mosad"
            },

            "Mohamed Haitham": {
                password: "83746192",
                role: "installation",
                name: "Mohamed Haitham"
            }

        };


        function loginUser() {

            const usernameInput =
                document.getElementById("username");

            const passwordInput =
                document.getElementById("password");

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("loginButton");


            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value.trim();


            /* =========================
               التحقق من البيانات
            ========================= */

            if (!username || !password) {

                message.innerText =
                    "❌ من فضلك اكتب اسم المستخدم وكلمة المرور";

                message.style.color =
                    "#dc3545";

                return;

            }


            /* =========================
               البحث عن المستخدم
            ========================= */

            const user =
                USERS[username];


            if (
                !user ||
                user.password !== password
            ) {

                message.innerText =
                    "❌ اسم المستخدم أو كلمة المرور غير صحيحة";

                message.style.color =
                    "#dc3545";

                return;

            }


            /* =========================
               إنشاء الجلسة
            ========================= */

            const currentUser = {

                username:
                    username,

                name:
                    user.name,

                role:
                    user.role

            };


            sessionStorage.setItem(
                "currentUser",
                JSON.stringify(currentUser)
            );


            /* =========================
               Remember Me
            ========================= */

            const remember =
                document.getElementById(
                    "rememberMe"
                ).checked;


            if (remember) {

                localStorage.setItem(
                    "rememberedUsername",
                    username
                );

            } else {

                localStorage.removeItem(
                    "rememberedUsername"
                );

            }


            /* =========================
               نجاح
            ========================= */

            message.innerText =
                "✅ تم تسجيل الدخول بنجاح";

            message.style.color =
                "#198754";


            button.disabled =
                true;

            button.innerText =
                "⏳ جاري الدخول...";


            /* =========================
               الانتقال للرئيسية
            ========================= */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                300
            );

        }


        /* ================================
           زر الدخول
        ================================= */

        document
            .getElementById("loginButton")
            .addEventListener(
                "click",
                loginUser
            );


        /* ================================
           Enter
        ================================= */

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        loginUser();

                    }

                }
            );


        /* ================================
           Remember Me
        ================================= */

        window.addEventListener(
            "load",
            function() {

                const remembered =
                    localStorage.getItem(
                        "rememberedUsername"
                    );


                if (remembered) {

                    const usernameInput =
                        document.getElementById(
                            "username"
                        );

                    const rememberMe =
                        document.getElementById(
                            "rememberMe"
                        );


                    usernameInput.value =
                        remembered;

                    rememberMe.checked =
                        true;

                }

            }
        );

    </script>


</body>

</html>
