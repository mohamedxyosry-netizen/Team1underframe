<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NERIC - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">


    <!-- =================================
         NERIC
    ================================== -->

<div class="site-header">

    <div class="neric">
        NERIC
    </div>


</div>



    <!-- =================================
         Login Box
    ================================== -->

    <div class="login-container">


        <h1>
            Login to Access Sections
        </h1>


        <div class="login-line"></div>


        <p class="login-subtitle">
            Railway Work Management System
        </p>


        <!-- Username -->

        <div class="input-group">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >

        </div>



        <!-- Password -->

        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

        </div>



        <!-- Remember Me -->

        <label class="remember">

            <input
                type="checkbox"
                id="rememberMe"
            >

            <span>
                Remember me
            </span>

        </label>



        <!-- Login Button -->

        <button
            type="button"
            onclick="login()">

            LOGIN

        </button>



        <!-- Message -->

        <div id="message"></div>


    </div>



    <script src="script.js"></script>

</body>

</html>
