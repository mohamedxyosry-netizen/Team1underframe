<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Priority Item - NERIC</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    min-height:100vh;
}

.priority-page{
    min-height:100vh;
    padding:30px 20px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
}

.priority-container{
    width:min(760px,100%);
}

.priority-header{
    background:#fff;
    border-radius:22px;
    padding:28px;
    margin-bottom:22px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    border:1px solid #e7edf5;
}

.priority-header .icon{
    width:82px;
    height:82px;
    margin:0 auto 15px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    background:#fff7e6;
}

.priority-header h1{
    margin:0 0 8px;
    font-size:30px;
}

.priority-header p{
    margin:0;
    color:#64748b;
    font-size:16px;
}

.priority-buttons{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
}

.priority-btn{
    border:2px solid #e7edf5;
    border-radius:22px;
    min-height:205px;
    padding:25px;
    cursor:pointer;
    background:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    transition:transform .18s ease,box-shadow .18s ease;
    font-family:inherit;
}

.priority-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 35px rgba(0,0,0,.12);
}

.priority-btn:active{
    transform:scale(.98);
}

.priority-btn .btn-icon{
    font-size:55px;
    line-height:1;
    margin-bottom:15px;
}

.priority-btn strong{
    display:block;
    font-size:26px;
    margin-bottom:9px;
}

.priority-btn small{
    color:#64748b;
    font-size:14px;
    line-height:1.7;
}

.trucking-btn{
    border-color:#b9d8ff;
}

.duct-btn{
    border-color:#cbdcff;
}

.back-btn{
    width:100%;
    margin-top:20px;
    border:0;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
    background:#334155;
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
}

.status-box{
    display:none;
    margin-top:18px;
    background:#fff;
    border-radius:15px;
    padding:15px;
    text-align:center;
    font-weight:700;
    line-height:1.8;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.status-box.success{
    display:block;
    color:#198754;
    border:1px solid #b9dfc9;
    background:#f2fff6;
}

.status-box.error{
    display:block;
    color:#b42318;
    border:1px solid #f3b6b1;
    background:#fff6f5;
}

.priority-btn.loading{
    opacity:.6;
    pointer-events:none;
}

@media(max-width:650px){

    .priority-page{
        padding:15px;
    }

    .priority-header{
        padding:22px 15px;
    }

    .priority-header h1{
        font-size:24px;
    }

    .priority-buttons{
        grid-template-columns:1fr;
    }

    .priority-btn{
        min-height:175px;
    }

}

</style>

</head>

<body>

<div class="priority-page">

    <div class="priority-container">

        <div class="priority-header">

            <div class="icon">
                🚨
            </div>

            <h1>
                Priority Item
            </h1>

            <p>
                اختر نوع العمل لإرسال تنبيه فوري إلى الفريق بالكامل
            </p>

        </div>


        <div class="priority-buttons">

            <button
                id="truckingButton"
                class="priority-btn trucking-btn"
                onclick="sendPriorityMessage('trucking')"
            >

                <div class="btn-icon">
                    🚆
                </div>

                <strong>
                    Trucking
                </strong>

                <small>
                    إرسال تنبيه ببدء أعمال Trucking
                </small>

            </button>


            <button
                id="ductButton"
                class="priority-btn duct-btn"
                onclick="sendPriorityMessage('duct')"
            >

                <div class="btn-icon">
                    🚆
                </div>

                <strong>
                    Duct Installation
                </strong>

                <small>
                    إرسال تنبيه ببدء أعمال Duct Installation
                </small>

            </button>

        </div>


        <div
            id="statusBox"
            class="status-box"
        ></div>


        <button
            class="back-btn"
            onclick="window.location.href='index.html'"
        >
            🏠 العودة للرئيسية
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>


<script>

const PRIORITY_MESSAGES = {

    trucking: `🚨 تنبيه هام للفريق
سيتم الآن البدء في (Trucking).
يرجى من جميع أفراد الفريق التوجه إلى موقع العربية والاستعداد للعمل.
شكرًا لتعاونكم.`,

    duct: `🚨 تنبيه هام للفريق
سيتم الآن البدء في (Duct Installation).
يرجى من جميع أفراد الفريق التوجه إلى موقع العربية والاستعداد للعمل.
شكرًا لتعاونكم.`

};


function getPriorityCurrentUser(){

    if(typeof getCurrentUser === 'function'){
        return getCurrentUser();
    }

    try{

        const data =
            sessionStorage.getItem('currentUser');

        return data
            ? JSON.parse(data)
            : null;

    }catch(error){

        return null;

    }

}


async function sendPriorityMessage(type){

    const user =
        getPriorityCurrentUser();


    if(!user){

        window.location.href =
            'login.html';

        return;

    }


    if(!window.supabaseClient){

        showPriorityStatus(
            '❌ لم يتم الاتصال بقاعدة البيانات.',
            false
        );

        return;

    }


    const message =
        PRIORITY_MESSAGES[type];


    if(!message){
        return;
    }


    const buttons = [

        document.getElementById(
            'truckingButton'
        ),

        document.getElementById(
            'ductButton'
        )

    ];


    buttons.forEach(button => {

        if(button){
            button.classList.add(
                'loading'
            );
        }

    });


    showPriorityStatus(
        '⏳ جاري إرسال التنبيه إلى الفريق...',
        true,
        true
    );


    try{

        const teamUsers =
            typeof users !== 'undefined'
                ? users
                : {};


        const senderUsername =
            user.username ||
            user.userName ||
            user.name;


        const senderName =
            user.name ||
            senderUsername;


        /*
         * إرسال التنبيه لكل أعضاء الفريق
         * ما عدا الشخص الذي أرسل التنبيه
         */

        const recipients =
            Object.keys(teamUsers)
            .filter(username =>
                username !== senderUsername
            );


        if(!recipients.length){

            throw new Error(
                'لم يتم العثور على أعضاء الفريق.'
            );

        }


        const rows =
            recipients.map(username => ({

                sender_username:
                    senderUsername,

                sender_name:
                    senderName,

                receiver_username:
                    username,

                message:
                    message,

                is_read:
                    false

            }));


        const { error } =
            await window.supabaseClient
                .from('private_messages')
                .insert(rows);


        if(error){
            throw error;
        }


        showPriorityStatus(
            '✅ تم إرسال التنبيه إلى الفريق بالكامل.',
            true
        );


    }catch(error){

        console.error(
            'Priority message error:',
            error
        );


        showPriorityStatus(
            '❌ حدث خطأ أثناء إرسال التنبيه. حاول مرة أخرى.',
            false
        );


    }finally{

        setTimeout(() => {

            buttons.forEach(button => {

                if(button){

                    button.classList.remove(
                        'loading'
                    );

                }

            });

        },500);

    }

}


function showPriorityStatus(
    text,
    success,
    loading
){

    const box =
        document.getElementById(
            'statusBox'
        );


    if(!box){
        return;
    }


    box.textContent =
        text;


    box.className =
        'status-box';


    if(loading){

        box.style.display =
            'block';

        box.style.color =
            '#475569';

        box.style.background =
            '#f8fafc';

        return;

    }


    box.classList.add(
        success
            ? 'success'
            : 'error'
    );

}

</script>

</body>
</html>
