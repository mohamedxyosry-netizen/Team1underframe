<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NERIC - Wiring</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .dashboard {
            min-height: 100vh;
        }

        .header {
            background: rgb(52, 67, 84);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-bottom: 3px solid #5928e0;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 28px;
            color: #ffffff;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .logout-btn {
            border: none;
            background: #198754;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }

        .form-page {
            width: min(1100px, 94%);
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .form-card,
        .records-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .form-card {
            border-top: 5px solid #198754;
        }

        .records-card {
            border-top: 5px solid #0d6efd;
        }

        .form-card h2,
        .records-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 21px;
        }

        .form-card h2 {
            color: #198754;
        }

        .records-card h2 {
            color: #0d6efd;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: #198754;
            background: white;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .input-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            border: none;
            background: #198754;
            color: white;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #157347;
        }

        .save-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        #wiringMessage {
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
            line-height: 1.7;
        }

        #wiringRecords {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .record {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: 5px solid #0d6efd;
            border-radius: 12px;
            padding: 18px;
        }

        .record h3 {
            margin-top: 0;
            font-size: 16px;
            color: #0d6efd;
        }

        .record p {
            margin: 9px 0;
            line-height: 1.7;
        }

        .record strong {
            color: #374151;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .error-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #b42318;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            line-height: 1.7;
        }

        @media (max-width: 750px) {

            .header {
                padding: 18px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .logout-btn {
                width: 100%;
            }

            .form-page {
                grid-template-columns: 1fr;
                width: 94%;
                margin: 20px auto;
            }

            .form-card,
            .records-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <header class="header">

        <div>

            <h1>
                🔌 قسم Wiring
            </h1>

            <p>
                تسجيل ومتابعة أعمال الـ Wiring
            </p>

        </div>


        <button
            class="logout-btn"
            type="button"
            onclick="goHome()">

            🏠 الأقسام الرئيسية

        </button>

    </header>



    <main class="form-page">


        <div class="form-card">

            <h2>
                📝 تسجيل بيانات جديدة
            </h2>


            <div class="input-group">

                <label>
                    🚆 اسم العربية
                </label>

                <input
                    type="text"
                    id="wiringCarName"
                    placeholder="اكتب اسم العربية">

            </div>


            <div class="input-group">

                <label>
                    🔢 رقم العربية
                </label>

                <input
                    type="text"
                    id="wiringCarNumber"
                    placeholder="اكتب رقم العربية">

            </div>


            <div class="input-group">

                <label>
                    ✅ تم الانتهاء
                </label>

                <select id="wiringDone">

                    <option value="">
                        اختار الحالة
                    </option>

                    <option value="نعم">
                        نعم - تم الانتهاء
                    </option>

                    <option value="لا">
                        لا - لم يتم الانتهاء
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    📝 ملاحظات
                </label>

                <textarea
                    id="wiringNotes"
                    placeholder="اكتب الملاحظات"></textarea>

            </div>


            <button
                type="button"
                class="save-btn"
                id="saveWiringButton"
                onclick="saveWiring()">

                💾 حفظ البيانات

            </button>


            <p id="wiringMessage"></p>

        </div>



        <div class="records-card">

            <h2>
                📋 البيانات المسجلة
            </h2>


            <div id="wiringRecords">

                <div class="empty">
                    ⏳ جاري تحميل البيانات...
                </div>

            </div>

        </div>


    </main>

</div>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // =====================================================
    // SUPABASE SETTINGS
    // =====================================================

    const SUPABASE_URL =
        "https://gzyybadyaunizdlvmcle.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";


    // =====================================================
    // CREATE SUPABASE CLIENT
    // =====================================================

    let supabaseClient = null;

    try {

        if (
            window.supabase &&
            typeof window.supabase.createClient === "function"
        ) {

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

        }

    }

    catch (error) {

        console.error(
            "SUPABASE CLIENT ERROR:",
            error
        );

    }



    // =====================================================
    // CURRENT USER
    // =====================================================

    function getCurrentUsername() {

        try {

            const currentUser =
                JSON.parse(
                    sessionStorage.getItem(
                        "currentUser"
                    )
                );

            if (
                currentUser &&
                currentUser.name
            ) {

                return currentUser.name;

            }

            if (
                currentUser &&
                currentUser.username
            ) {

                return currentUser.username;

            }

        }

        catch (error) {

            console.log(
                "Could not read current user"
            );

        }

        return "Unknown";

    }



    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }



    // =====================================================
    // SAVE WIRING
    // =====================================================

    async function saveWiring() {

        const carNameElement =
            document.getElementById(
                "wiringCarName"
            );

        const carNumberElement =
            document.getElementById(
                "wiringCarNumber"
            );

        const doneElement =
            document.getElementById(
                "wiringDone"
            );

        const notesElement =
            document.getElementById(
                "wiringNotes"
            );

        const message =
            document.getElementById(
                "wiringMessage"
            );

        const button =
            document.getElementById(
                "saveWiringButton"
            );


        const carName =
            carNameElement
                ? carNameElement.value.trim()
                : "";

        const carNumber =
            carNumberElement
                ? carNumberElement.value.trim()
                : "";

        const done =
            doneElement
                ? doneElement.value
                : "";

        const notes =
            notesElement
                ? notesElement.value.trim()
                : "";


        // =================================================
        // CHECK INPUTS
        // =================================================

        if (
            !carName ||
            !carNumber ||
            !done
        ) {

            message.innerText =
                "❌ من فضلك اكتب اسم العربية ورقم العربية واختر الحالة";

            message.style.color =
                "#dc3545";

            return;

        }


        // =================================================
        // CHECK SUPABASE
        // =================================================

        if (!supabaseClient) {

            message.innerText =
                "❌ Supabase غير متصل";

            message.style.color =
                "#dc3545";

            console.error(
                "Supabase client is not available"
            );

            return;

        }


        // =================================================
        // USER
        // =================================================

        const username =
            getCurrentUsername();


        // =================================================
        // LOADING
        // =================================================

        button.disabled = true;

        button.innerText =
            "⏳ جاري الحفظ...";

        message.innerText =
            "⏳ جاري الاتصال بـ Supabase...";

        message.style.color =
            "#0d6efd";


        try {

            // =================================================
            // PAYLOAD
            // =================================================

            const payload = {

                department:
                    "wiring",

                car_name:
                    carName,

                car_number:
                    carNumber,

                done:
                    done,

                notes:
                    notes,

                created_by:
                    username

            };


            console.log(
                "📤 DATA SENT TO SUPABASE:",
                payload
            );


            // =================================================
            // INSERT
            // =================================================

            const result =
                await supabaseClient
                    .from("records")
                    .insert(payload)
                    .select()
                    .single();


            // =================================================
            // SUPABASE ERROR
            // =================================================

            if (result.error) {

                console.error(
                    "❌ SUPABASE INSERT ERROR:",
                    result.error
                );

                message.innerText =
                    "❌ فشل الحفظ:\n" +
                    result.error.message;

                message.style.color =
                    "#dc3545";

                button.disabled = false;

                button.innerText =
                    "💾 حفظ البيانات";

                return;

            }


            // =================================================
            // SUCCESS
            // =================================================

            console.log(
                "✅ SAVED:",
                result.data
            );


            message.innerText =
                "✅ تم حفظ البيانات بنجاح في Supabase";

            message.style.color =
                "#198754";


            // =================================================
            // CLEAR INPUTS
            // =================================================

            carNameElement.value = "";

            carNumberElement.value = "";

            doneElement.value = "";

            notesElement.value = "";


            // =================================================
            // BUTTON
            // =================================================

            button.disabled = false;

            button.innerText =
                "💾 حفظ البيانات";


            // =================================================
            // RELOAD RECORDS
            // =================================================

            await loadWiringRecords();

        }

        catch (error) {

            console.error(
                "❌ SAVE ERROR:",
                error
            );


            message.innerText =
                "❌ حصل خطأ أثناء الاتصال بـ Supabase:\n" +
                error.message;

            message.style.color =
                "#dc3545";


            button.disabled = false;

            button.innerText =
                "💾 حفظ البيانات";

        }

    }



    // =====================================================
    // LOAD WIRING RECORDS
    // =====================================================

    async function loadWiringRecords() {

        const container =
            document.getElementById(
                "wiringRecords"
            );


        if (!container) {
            return;
        }


        container.innerHTML =
            '<div class="empty">⏳ جاري تحميل البيانات...</div>';


        if (!supabaseClient) {

            container.innerHTML =
                '<div class="error-box">❌ Supabase غير متصل</div>';

            return;

        }


        try {

            const result =
                await supabaseClient
                    .from("records")
                    .select("*")
                    .eq(
                        "department",
                        "wiring"
                    )
                    .order(
                        "id",
                        {
                            ascending: false
                        }
                    );


            if (result.error) {

                console.error(
                    "❌ LOAD ERROR:",
                    result.error
                );


                container.innerHTML =
                    '<div class="error-box">❌ ' +
                    escapeHTML(
                        result.error.message
                    ) +
                    '</div>';

                return;

            }


            const records =
                result.data || [];


            if (
                records.length === 0
            ) {

                container.innerHTML =
                    '<div class="empty">' +
                    'لا توجد بيانات مسجلة حتى الآن' +
                    '</div>';

                return;

            }


            container.innerHTML = "";


            records.forEach(
                function(record) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "record";


                    div.innerHTML = `

                        <h3>
                            🚆
                            ${escapeHTML(
                                record.car_name
                            )}
                        </h3>

                        <p>

                            <strong>
                                🔢 رقم العربية:
                            </strong>

                            ${escapeHTML(
                                record.car_number
                            )}

                        </p>

                        <p>

                            <strong>
                                ✅ الحالة:
                            </strong>

                            ${escapeHTML(
                                record.done
                            )}

                        </p>

                        <p>

                            <strong>
                                📝 الملاحظات:
                            </strong>

                            ${escapeHTML(
                                record.notes || ""
                            )}

                        </p>

                        <p>

                            <strong>
                                👤 المستخدم:
                            </strong>

                            ${escapeHTML(
                                record.created_by || ""
                            )}

                        </p>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );

        }

        catch (error) {

            console.error(
                "❌ LOAD ERROR:",
                error
            );


            container.innerHTML =
                '<div class="error-box">' +
                '❌ حصل خطأ أثناء تحميل البيانات' +
                '</div>';

        }

    }



    // =====================================================
    // GO HOME
    // =====================================================

    function goHome() {

        window.location.href =
            "index.html";

    }



    // =====================================================
    // START
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadWiringRecords();

        }
    );

</script>


</body>

</html>
