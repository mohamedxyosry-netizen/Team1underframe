<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بيانات الفريق - NERIC</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    background: #f1f5f9;
    font-family: Arial, Tahoma, sans-serif;
    color: #1f2937;
}

.header {
    background: rgb(52, 67, 84);
    color: white;
    padding: 20px 30px;
    border-bottom: 3px solid #5928e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.header h1 { margin: 0 0 6px 0; font-size: 26px; }
.header p { margin: 0; color: #d1d5db; font-size: 14px; }

.home-btn {
    border: none;
    background: #198754;
    color: white;
    padding: 11px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
}

.main-container {
    width: min(1200px, 94%);
    margin: 25px auto 40px;
}

/* ===============================
   Toolbar (للمدير بس)
=============================== */

.toolbar {
    background: white;
    border-radius: 14px;
    padding: 15px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
    border-right: 4px solid #0b3d91;
}

.toolbar-info {
    color: #334155;
    font-size: 15px;
    font-weight: 600;
}

.toolbar-info strong {
    color: #0b3d91;
    font-size: 18px;
}

.search-box {
    position: relative;
    flex: 1;
    max-width: 400px;
    min-width: 200px;
}

.search-box input {
    width: 100%;
    padding: 11px 38px 11px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fafbfc;
    outline: none;
    transition: 0.2s;
    box-sizing: border-box;
}

.search-box input:focus {
    border-color: #0b3d91;
    background: white;
    box-shadow: 0 0 0 3px rgba(11,61,145,.1);
}

.search-box::before {
    content: "🔍";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
}

/* ===============================
   Grid (للمدير)
=============================== */

.employees-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

.employee-mini-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
    border-right: 5px solid #0b3d91;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-top: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
    border-left: 1px solid #e5e7eb;
}

.employee-mini-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
    border-right-color: #7c3aed;
}

.employee-mini-card.my-card {
    border-right-color: #198754;
    background: linear-gradient(135deg, #f0fdf4, #ffffff);
}

.mini-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0b3d91, #092e6e);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 28px;
    margin: 0 auto 12px;
    box-shadow: 0 4px 12px rgba(11,61,145,.25);
}

.my-card .mini-avatar {
    background: linear-gradient(135deg, #198754, #157347);
    box-shadow: 0 4px 12px rgba(25,135,84,.25);
}

.mini-name {
    font-size: 17px;
    font-weight: bold;
    color: #1e293b;
    margin: 0 0 4px 0;
}

.mini-username {
    font-size: 12px;
    color: #94a3b8;
    margin: 0 0 10px 0;
    direction: ltr;
}

.mini-dept {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #dbeafe;
    color: #0b3d91;
    margin-bottom: 8px;
}

.role-admin { background: #fee2e2; color: #991b1b; }
.role-wiring { background: #fef3c7; color: #92400e; }
.role-lt { background: #dbeafe; color: #1e40af; }
.role-ht { background: #fce7f3; color: #9d174d; }
.role-installation { background: #d1fae5; color: #065f46; }
.role-final { background: #ede9fe; color: #5b21b6; }

.mini-code {
    display: block;
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
    margin-top: 4px;
}

.mini-code strong {
    color: #0b3d91;
    font-family: 'Courier New', monospace;
    direction: ltr;
    display: inline-block;
}

.mini-hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #e5e7eb;
}

/* ===============================
   Detail (للفني - عرض كبير)
=============================== */

.employee-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 6px 25px rgba(0,0,0,.08);
    border-right: 6px solid #198754;
    max-width: 750px;
    margin: 0 auto;
    background: linear-gradient(135deg, #f0fdf4, #ffffff);
}

.employee-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e5e7eb;
    flex-wrap: wrap;
}

.avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #198754, #157347);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 32px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(25,135,84,.25);
}

.employee-title { flex: 1; min-width: 200px; }
.employee-title h3 { margin: 0 0 6px 0; font-size: 26px; color: #1e293b; }
.employee-title small { color: #64748b; font-size: 14px; }

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid #f1f5f9;
    border-radius: 8px;
    transition: background 0.15s;
}

.info-row:hover { background: #f8fafc; }
.info-row:last-child { border-bottom: none; }

.info-label {
    color: #64748b;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 130px;
}

.info-value {
    color: #1e293b;
    font-weight: 700;
    font-size: 15px;
    flex: 1;
    text-align: left;
    direction: rtl;
    word-break: break-word;
}

.info-value.empty {
    color: #cbd5e1;
    font-style: italic;
    font-weight: normal;
    font-size: 14px;
}

.dept-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    background: #d1fae5;
    color: #065f46;
}

.tools-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(124,58,237,.3);
    transition: all 0.2s;
}

.tools-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(124,58,237,.4);
}

/* ===============================
   Modal (للمدير - تفاصيل الموظف)
=============================== */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(3px);
}

.modal-overlay.show { display: flex; }

.modal-box {
    background: white;
    border-radius: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    position: relative;
}

.modal-close {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #fee2e2;
    color: #991b1b;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    font-weight: bold;
    z-index: 10;
    line-height: 1;
}

.modal-close:hover {
    background: #dc2626;
    color: white;
}

.modal-body {
    padding: 25px;
}

/* ===============================
   Loading/Empty
=============================== */

.loading {
    text-align: center;
    padding: 50px;
    color: #64748b;
    font-size: 16px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.error-box {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #b42318;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    line-height: 1.7;
    font-weight: bold;
}

@media (max-width: 600px) {
    .header { padding: 15px; }
    .header h1 { font-size: 20px; }
    .main-container { width: 96%; }
    .employees-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .employee-mini-card { padding: 15px; }
    .mini-avatar { width: 55px; height: 55px; font-size: 22px; }
    .mini-name { font-size: 15px; }
    .employee-card { padding: 20px; }
    .avatar { width: 65px; height: 65px; font-size: 26px; }
    .employee-title h3 { font-size: 22px; }
}

</style>

</head>

<body>

<div class="header">
    <div>
        <h1>👥 بيانات الفريق</h1>
        <p id="pageSubtitle">بيانات الموظفين وكوداتهم وأقسامهم</p>
    </div>
    <button class="home-btn" onclick="window.location.href='index.html'">
        🏠 الرئيسية
    </button>
</div>

<div class="main-container">

    <div class="toolbar" id="toolbarSection" style="display:none;">
        <div class="toolbar-info">
            📊 إجمالي الموظفين: <strong id="totalCount">0</strong>
        </div>
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="ابحث بالاسم أو الكود أو القسم..."
                autocomplete="off">
        </div>
    </div>

    <div id="employeesContainer">
        <div class="loading">⏳ جاري تحميل البيانات...</div>
    </div>

</div>


<!-- Modal تفاصيل الموظف (للمدير) -->
<div id="employeeModal" class="modal-overlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeEmployeeModal()">×</button>
        <div class="modal-body" id="employeeModalBody"></div>
    </div>
</div>


<script>

const SUPABASE_URL = "https://gzyybadyaunizdlvmcle.supabase.co";
const SUPABASE_KEY = "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = db;


let allEmployees = [];
let currentUser = null;
let isAdmin = false;


function getCurrentUser() {
    try {
        const raw = sessionStorage.getItem("currentUser");
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) {
        return null;
    }
}


function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    if (isNaN(date.getTime())) return value;
    return date.toLocaleDateString("ar-EG", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


function getDepartmentName(dept) {
    const map = {
        admin: "الإدارة",
        wiring: "Wiring",
        lt: "LT",
        ht: "HT",
        installation: "التركيبات",
        final: "Final"
    };
    return map[dept] || dept || "غير محدد";
}


function getInitial(name) {
    const n = String(name || "").trim();
    return n ? n.charAt(0).toUpperCase() : "👤";
}


async function loadEmployees() {

    const container = document.getElementById("employeesContainer");

    try {

        const { data, error } = await db
            .from("employees")
            .select("*")
            .order("id", { ascending: true });

        if (error) {
            console.error("Load error:", error);
            container.innerHTML = `
                <div class="error-box">
                    ❌ فشل تحميل البيانات<br>
                    <small>${escapeHTML(error.message)}</small>
                </div>
            `;
            return;
        }

        allEmployees = data || [];
        document.getElementById("totalCount").textContent = allEmployees.length;

        renderEmployees();

    } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="error-box">❌ حصل خطأ أثناء التحميل</div>`;
    }
}


function renderEmployees() {

    const container = document.getElementById("employeesContainer");

    const term = (document.getElementById("searchInput")?.value || "")
        .trim()
        .toLowerCase();

    let list = allEmployees;

    // لو فني — يشوف بياناته بس
    if (!isAdmin) {
        const username = currentUser?.username || "";
        list = list.filter(e => e.username === username);
    }

    // فلترة البحث (للمدير بس)
    if (term && isAdmin) {
        list = list.filter(e => {
            return (
                String(e.name || "").toLowerCase().includes(term) ||
                String(e.username || "").toLowerCase().includes(term) ||
                String(e.employee_code || "").toLowerCase().includes(term) ||
                String(e.department || "").toLowerCase().includes(term)
            );
        });
    }

    if (list.length === 0) {
        container.innerHTML = `
            <div class="error-box" style="background:#f8fafc;border-color:#e2e8f0;color:#64748b;">
                🔍 لا توجد نتائج
            </div>
        `;
        return;
    }

    /* ============================================
       للمدير: شبكة مربعات صغيرة
    ============================================ */
    if (isAdmin) {
        container.innerHTML = `
            <div class="employees-grid">
                ${list.map(renderMiniCard).join("")}
            </div>
        `;
        return;
    }

    /* ============================================
       للفني: كارت كبير بتفاصيله
    ============================================ */
    container.innerHTML = list.map(renderDetailedCard).join("");
}


/* =========================================================
   MINI CARD (للمدير)
========================================================= */

function renderMiniCard(emp) {

    const isMyCard = currentUser && emp.username === currentUser.username;
    const deptClass = "role-" + (emp.department || "unknown");

    const codeHTML = emp.employee_code
        ? `<span class="mini-code">🆔 <strong>${escapeHTML(emp.employee_code)}</strong></span>`
        : `<span class="mini-code" style="color:#cbd5e1;">🆔 لم يُسجّل</span>`;

    return `
        <div class="employee-mini-card ${isMyCard ? 'my-card' : ''}"
             onclick="openEmployeeModal('${escapeHTML(emp.username)}')">

            <div class="mini-avatar">
                ${escapeHTML(getInitial(emp.name))}
            </div>

            <h3 class="mini-name">${escapeHTML(emp.name || "غير معروف")}</h3>

            <p class="mini-username">@${escapeHTML(emp.username || "")}</p>

            <span class="mini-dept ${deptClass}">
                ${escapeHTML(getDepartmentName(emp.department))}
            </span>

            ${codeHTML}

            <div class="mini-hint">👆 اضغط للتفاصيل</div>

        </div>
    `;
}


/* =========================================================
   DETAILED CARD (للفني)
========================================================= */

function renderDetailedCard(emp) {

    const deptClass = "role-" + (emp.department || "unknown");

    const valueOrEmpty = (value, emptyText) => {
        if (value && String(value).trim()) {
            return escapeHTML(String(value));
        }
        return `<span class="empty">${emptyText}</span>`;
    };

    return `
        <div class="employee-card">

            <div class="employee-header">
                <div class="avatar">
                    ${escapeHTML(getInitial(emp.name))}
                </div>

                <div class="employee-title">
                    <h3>${escapeHTML(emp.name || "غير معروف")}</h3>
                    <small>@${escapeHTML(emp.username || "")}</small>
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">👤 الاسم</div>
                <div class="info-value">${escapeHTML(emp.name || "غير معروف")}</div>
            </div>

            <div class="info-row">
                <div class="info-label">🆔 كود الموظف</div>
                <div class="info-value">${valueOrEmpty(emp.employee_code, "لم يُسجّل بعد")}</div>
            </div>

            <div class="info-row">
                <div class="info-label">📅 تاريخ التعيين</div>
                <div class="info-value">
                    ${emp.join_date ? escapeHTML(formatDate(emp.join_date)) : '<span class="empty">لم يُسجّل بعد</span>'}
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">🏢 القسم</div>
                <div class="info-value">
                    <span class="dept-badge ${deptClass}">
                        ${escapeHTML(getDepartmentName(emp.department))}
                    </span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">📞 التليفون</div>
                <div class="info-value">${valueOrEmpty(emp.phone, "لا يوجد")}</div>
            </div>

            <div class="info-row">
                <div class="info-label">📝 ملاحظات</div>
                <div class="info-value">${valueOrEmpty(emp.notes, "لا توجد")}</div>
            </div>

            <button class="tools-btn" onclick="openEmployeeTools('${escapeHTML(emp.username)}')">
                🔧 العدة المستلمة
            </button>

        </div>
    `;
}


/* =========================================================
   MODAL (للمدير - تفاصيل موظف)
========================================================= */

function openEmployeeModal(username) {

    const emp = allEmployees.find(e => e.username === username);

    if (!emp) return;

    const deptClass = "role-" + (emp.department || "unknown");

    const editBtn = (field, value) => `
        <button class="edit-btn"
            onclick="editField(${emp.id}, '${field}', '${escapeHTML(String(value || ""))}')">
            ✏️
        </button>
    `;

    const valueOrEmpty = (value, emptyText) => {
        if (value && String(value).trim()) return escapeHTML(String(value));
        return `<span class="info-value empty">${emptyText}</span>`;
    };

    const html = `
        <div class="employee-card" style="border-right-color:#0b3d91;background:white;box-shadow:none;max-width:100%;margin:0;">

            <div class="employee-header">
                <div class="avatar" style="background:linear-gradient(135deg,#0b3d91,#092e6e);">
                    ${escapeHTML(getInitial(emp.name))}
                </div>
                <div class="employee-title">
                    <h3>${escapeHTML(emp.name || "غير معروف")}</h3>
                    <small>@${escapeHTML(emp.username || "")}</small>
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">👤 الاسم</div>
                <div class="info-value">${escapeHTML(emp.name || "")}</div>
                ${editBtn("name", emp.name || "")}
            </div>

            <div class="info-row">
                <div class="info-label">🆔 كود الموظف</div>
                <div class="info-value">${valueOrEmpty(emp.employee_code, "لم يُسجّل بعد")}</div>
                ${editBtn("employee_code", emp.employee_code || "")}
            </div>

            <div class="info-row">
                <div class="info-label">📅 تاريخ التعيين</div>
                <div class="info-value">${emp.join_date ? escapeHTML(formatDate(emp.join_date)) : '<span class="empty">لم يُسجّل بعد</span>'}</div>
                ${editBtn("join_date", emp.join_date || "")}
            </div>

            <div class="info-row">
                <div class="info-label">🏢 القسم</div>
                <div class="info-value">
                    <span class="dept-badge ${deptClass}">
                        ${escapeHTML(getDepartmentName(emp.department))}
                    </span>
                </div>
                ${editBtn("department", emp.department || "")}
            </div>

            <div class="info-row">
                <div class="info-label">📞 التليفون</div>
                <div class="info-value">${valueOrEmpty(emp.phone, "لا يوجد")}</div>
                ${editBtn("phone", emp.phone || "")}
            </div>

            <div class="info-row">
                <div class="info-label">📝 ملاحظات</div>
                <div class="info-value">${valueOrEmpty(emp.notes, "لا توجد")}</div>
                ${editBtn("notes", emp.notes || "")}
            </div>

            <button class="tools-btn" onclick="openEmployeeTools('${escapeHTML(emp.username)}')">
                🔧 العدة المستلمة
            </button>

        </div>
    `;

    document.getElementById("employeeModalBody").innerHTML = html;
    document.getElementById("employeeModal").classList.add("show");
}


function closeEmployeeModal() {
    document.getElementById("employeeModal").classList.remove("show");
}

document.addEventListener("click", function(e) {
    if (e.target && e.target.id === "employeeModal") {
        closeEmployeeModal();
    }
});


/* =========================================================
   EDIT FIELD
========================================================= */

async function editField(empId, field, currentValue) {

    if (!isAdmin) {
        alert("❌ التعديل متاح للمدير فقط");
        return;
    }

    const fieldNames = {
        name: "الاسم",
        employee_code: "كود الموظف",
        join_date: "تاريخ التعيين (YYYY-MM-DD)",
        department: "القسم (admin / wiring / lt / ht / installation / final)",
        phone: "التليفون",
        notes: "ملاحظات"
    };

    const label = fieldNames[field] || field;

    const newValue = prompt(
        `تعديل ${label}\n\nالقيمة الحالية: ${currentValue || "(فاضي)"}\n\nاكتب القيمة الجديدة:`,
        currentValue || ""
    );

    if (newValue === null) return;

    let finalValue = newValue.trim();
    if (finalValue === "") finalValue = null;

    try {

        const updatePayload = {};
        updatePayload[field] = finalValue;
        updatePayload.updated_at = new Date().toISOString();

        const { error } = await db
            .from("employees")
            .update(updatePayload)
            .eq("id", empId);

        if (error) {
            console.error("Update error:", error);
            alert("❌ فشل التعديل:\n" + error.message);
            return;
        }

        alert("✅ تم التعديل بنجاح");

        await loadEmployees();

        // نعيد فتح المودال بنفس الموظف بعد التحديث
        const emp = allEmployees.find(e => e.id === empId);
        if (emp) {
            openEmployeeModal(emp.username);
        }

    } catch (error) {
        console.error(error);
        alert("❌ حصل خطأ أثناء التعديل");
    }
}


/* =========================================================
   OPEN EMPLOYEE TOOLS
========================================================= */

function openEmployeeTools(username) {
    if (!username) return;
    localStorage.setItem("viewingToolsFor", username);
    window.location.href = "employee-tools.html";
}


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async function () {

    currentUser = getCurrentUser();

    if (!currentUser) {
        window.location.href = "login.html";
        return;
    }

    isAdmin = currentUser.role === "admin";

    // للمدير: إظهار شريط البحث
    if (isAdmin) {
        const toolbar = document.getElementById("toolbarSection");
        if (toolbar) toolbar.style.display = "flex";

        document.getElementById("searchInput")
            .addEventListener("input", renderEmployees);

        // نغير الـ subtitle للمدير
        document.getElementById("pageSubtitle").innerText =
            "👆 اضغط على أي موظف لعرض بياناته";
    } else {
        document.getElementById("pageSubtitle").innerText =
            "بياناتك الشخصية";
    }

    await loadEmployees();

});

</script>
