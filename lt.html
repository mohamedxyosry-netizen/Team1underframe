<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NERIC - LT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
}

.dashboard {
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
    background: rgb(52, 67, 84);
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    border-bottom: 3px solid #5928e0;
}

.header h1 {
    margin: 0 0 7px;
    font-size: 28px;
    color: white;
}

.header p {
    margin: 0;
    color: #d1d5db;
    font-size: 14px;
}

.logout-btn {
    border: none;
    background: #198754;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.logout-btn:hover {
    opacity: .9;
}

/* =========================
   PAGE
========================= */

.form-page {
    width: min(1100px, 94%);
    margin: 30px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    align-items: start;
}

.form-card,
.records-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    border: 1px solid #e5e7eb;
}

.form-card {
    border-top: 5px solid #198754;
}

.records-card {
    border-top: 5px solid #0d6efd;
}

.form-card h2,
.records-card h2 {
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 21px;
}

.form-card h2 {
    color: #198754;
}

.records-card h2 {
    color: #0d6efd;
}

/* =========================
   INPUTS
========================= */

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #374151;
}

.input-group input,
.input-group select,
.input-group textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    background: #f9fafb;
    outline: none;
    transition: .2s;
    font-family: inherit;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
    border-color: #198754;
    background: white;
    box-shadow: 0 0 0 3px rgba(25,135,84,.12);
}

.input-group textarea {
    min-height: 110px;
    resize: vertical;
}

.hidden {
    display: none !important;
}

/* =========================
   STATUS
========================= */

.status-box {
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    background: #f8fafc;
}

.status-help {
    margin-top: 7px;
    font-size: 13px;
    color: #64748b;
}

/* =========================
   REASON
========================= */

.reason-box {
    background: #fff7ed;
    border: 1px solid #fdba74;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
}

.reason-box label {
    color: #c2410c;
}

.reason-box textarea {
    background: white;
    border-color: #fdba74;
}

/* =========================
   CAR NUMBER
========================= */

.car-number-preview {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
    direction: ltr;
}

.number-part {
    background: #f8fafc;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 10px 5px;
    text-align: center;
    min-height: 78px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.number-part span {
    display: block;
    font-size: 12px;
    color: #64748b;
    margin-bottom: 5px;
    direction: rtl;
}

.number-part strong {
    display: block;
    font-size: 22px;
    color: #344354;
    direction: ltr;
}

.car-name-part {
    background: #f0fdf4;
    border: 2px solid #198754;
}

.car-name-part strong {
    color: #198754;
    font-size: 23px;
}

/* =========================
   SAVE BUTTON
========================= */

.save-btn {
    width: 100%;
    border: none;
    background: #198754;
    color: white;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    margin-top: 5px;
}

.save-btn:hover {
    background: #157347;
}

.save-btn:disabled {
    background: #6c757d;
    cursor: not-allowed;
}

#ltMessage {
    text-align: center;
    font-weight: bold;
    margin-top: 18px;
    line-height: 1.7;
    white-space: pre-line;
}

/* =========================
   RECORDS
========================= */

#ltRecords {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.record {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-right: 5px solid #0d6efd;
    border-radius: 12px;
    padding: 18px;
    transition: .2s;
}

.record:hover {
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.record.completed {
    border-right-color: #198754;
    background: #f0fdf4;
}

.record.not-completed {
    border-right-color: #dc3545;
    background: #fff7f7;
}

.record h3 {
    margin-top: 0;
    font-size: 16px;
    color: #0d6efd;
}

.record.completed h3 {
    color: #198754;
}

.record.not-completed h3 {
    color: #dc3545;
}

.record p {
    margin: 9px 0;
    line-height: 1.7;
}

.record strong {
    color: #374151;
}

/* =========================
   STATUS BADGE
========================= */

.status-badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
}

.status-completed {
    background: #dcfce7;
    color: #166534;
}

.status-not-completed {
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   REASON DISPLAY
========================= */

.reason-display {
    background: #fff7ed;
    border: 1px solid #fdba74;
    color: #9a3412;
    padding: 12px;
    border-radius: 9px;
    margin-top: 10px;
    line-height: 1.8;
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;
    color: #64748b;
    padding: 20px;
}

.error-box {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #b42318;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    line-height: 1.7;
}

/* =========================
   COMPLETED INFO
========================= */

.completed-info {
    background: #ecfdf3;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

/* =========================
   MOBILE
========================= */

    .header {
        padding: 18px;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
    }

    .logout-btn {

    }

    .form-page {

    }

    }

    }

    }

        font-size: 11px;
    }

    .number-part strong {
        font-size: 18px;
    }

    .car-name-part strong {
        font-size: 19px;
    }

}

</style>

/* =====================================================
   الأجهزة حسب العربية
===================================================== */

function updateLTDevices() {

    const carName =
        document.getElementById("ltCarName").value;

    const deviceSelect =
        document.getElementById("ltDevice");

    deviceSelect.innerHTML = `
        <option value="">
            ⬇️ اختر اسم الجهاز
        </option>
    `;

    if (
        !carName ||
        !LT_DEVICES[carName]
    ) {

        return;

    }

    LT_DEVICES[carName].forEach(function(device) {

        const option =
            document.createElement("option");

        option.value = device;

        option.textContent = device;

        deviceSelect.appendChild(option);

    });

}


/* =====================================================
   حالة الجهاز
===================================================== */

function updateLTStatus() {

    const status =
        document.getElementById("ltDone").value;

    const reasonGroup =
        document.getElementById("ltReasonGroup");

    const reason =
        document.getElementById("ltReason");

    if (status === "لا") {

        reasonGroup.classList.remove("hidden");

        reason.required = true;

    }

    else {

        reasonGroup.classList.add("hidden");

        reason.required = false;

        if (status === "نعم") {

            reason.value = "";

        }

    }

}

                sessionStorage.getItem("currentUser")
            );

        if (
            currentUser &&
            currentUser.name
        ) {

            return currentUser.name;

        }

        if (

        ) {

    } catch (error) {

        console.log(
            "Could not read current user"
        );

    }

    return "Unknown";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   DATE
===================================================== */

function formatArabicDate(value) {

    if (!value) {

        return "غير محدد";

    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {

        return escapeHTML(value);

    }

    return new Intl.DateTimeFormat(

        "ar-EG",

        {

            day: "numeric",

            month: "long",

            year: "numeric",

            hour: "numeric",

            minute: "2-digit",

            hour12: true

        }

    ).format(date);

}


/* =====================================================
   رقم العربية
===================================================== */

function updateLTCarNumber() {

    const carName =
        document.getElementById("ltCarName").value;

    const unitNumber =
        document.getElementById("ltUnitNumber").value.trim();

    const carNumberInput =
        document.getElementById("ltCarNumber");

    const carDisplay =
        document.getElementById("ltCarDisplay");

    const nameDisplay =
        document.getElementById("ltNameDisplay");

    const unitDisplay =
        document.getElementById("ltUnitDisplay");

    nameDisplay.textContent =
        carName || "--";

    unitDisplay.textContent =
        unitNumber || "--";

    if (
        !carName ||
        !unitNumber
    ) {

        carDisplay.textContent = "--";

        carNumberInput.value = "";

        return;

    }

    const carPositions = {

        DTC: 0,
        MC1: 1,
        MC2: 2,
        MCI: 3

    };

    const position =
        carPositions[carName];

    const baseNumber =
        65 +
        (
            (Number(unitNumber) - 17)
            * 4
        );

    const finalNumber =
        baseNumber + position;

    carDisplay.textContent =
        finalNumber;

    carNumberInput.value =
        finalNumber +
        "-" +
        carName +
        "-" +
        unitNumber;

}

        message.innerText =
            "❌ رقم الوحدة يجب أن يبدأ من 17";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!supabaseClient) {

        message.innerText =
            "❌ Supabase غير متصل";

        message.style.color =
            "#dc3545";

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ جاري التحقق...";


    /* =========================
       منع التكرار
    ========================= */

    const checkResult =
        await supabaseClient

            .from("records")

            .select("id")

            .eq(
                "department",
                "lt"
            )

            .eq(
                "car_number",
                carNumber
            )

            .eq(
                "device",
                device
            )

            .limit(1);


    if (checkResult.error) {

        console.error(
            "CHECK DEVICE ERROR:",
            checkResult.error
        );

        message.innerText =
            "❌ حصل خطأ أثناء التحقق:\n" +
            checkResult.error.message;

        message.style.color =
            "#dc3545";

        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";

        return;

    }


    if (
        checkResult.data &&
        checkResult.data.length > 0
    ) {

        message.innerText =
            "⚠️ هذا الجهاز مسجل بالفعل لهذه العربية";

        message.style.color =
            "#d97706";

        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";

        return;

    }


    /* =========================
       المستخدم
    ========================= */

    const username =
        getCurrentUsername();


    let completedBy = null;

    let completedAt = null;


    if (
        done === "نعم"
    ) {

        completedBy =
            username;

        completedAt =
            new Date().toISOString();

    }


    /* =========================
       البيانات
    ========================= */

    const payload = {

        department: "lt",

        car_name: carName,

        car_number: carNumber,

        device: device,

        socket: socket,

        notes: notes,

        done: done,

        completed_by: completedBy,

        completed_at: completedAt,

        not_completed_reason:
            done === "لا"
                ? reason
                : null,

        created_by: username

    };


    button.innerText =
        "⏳ جاري الحفظ...";

    message.innerText =
        "⏳ جاري حفظ البيانات...";

    message.style.color =
        "#0d6efd";


    try {

        const result =
            await supabaseClient

                .from("records")

                .insert(payload)

                .select()

                .single();


        if (result.error) {

            console.error(
                "LT INSERT ERROR:",
                result.error
            );

            message.innerText =
                "❌ فشل الحفظ:\n" +
                result.error.message;

            message.style.color =
                "#dc3545";

            button.disabled = false;

            button.innerText =
                "💾 حفظ البيانات";

            return;

        }


        /* =========================
           نجاح
        ========================= */

        if (
            done === "نعم"
        ) {

            message.innerText =
                "✅ تم الانتهاء من الجهاز وتسجيل البيانات بنجاح";

            message.style.color =
                "#198754";

        }

        else {

            message.innerText =
                "⚠️ تم حفظ الجهاز كـ لم يتم الانتهاء\nتم حفظ السبب بنجاح";

            message.style.color =
                "#d97706";

        }


        /* =========================
           تفريغ البيانات
        ========================= */

        document.getElementById(
            "ltCarName"
        ).value = "";

        document.getElementById(
            "ltUnitNumber"
        ).value = "";

        document.getElementById(
            "ltCarNumber"
        ).value = "";

        document.getElementById(
            "ltCarDisplay"
        ).textContent = "--";

        document.getElementById(
            "ltNameDisplay"
        ).textContent = "--";

        document.getElementById(
            "ltUnitDisplay"
        ).textContent = "--";


        document.getElementById(
            "ltDevice"
        ).innerHTML = `

            <option value="">

                ⬇️ اختر اسم الجهاز

            </option>

        `;


        document.getElementById(
            "ltSocket"
        ).value = "";

        document.getElementById(
            "ltDone"
        ).value = "";

        document.getElementById(
            "ltReason"
        ).value = "";

        document.getElementById(
            "ltNotes"
        ).value = "";


        updateLTStatus();


        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";


        await loadLTRecords();

    }

    catch (error) {

        console.error(
            "LT SAVE ERROR:",
            error
        );

        message.innerText =
            "❌ حصل خطأ أثناء الحفظ:\n" +
            error.message;

        message.style.color =
            "#dc3545";

        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";

    }

}


/* =====================================================
   LOAD RECORDS
===================================================== */

async function loadLTRecords() {

    const container =
        document.getElementById(
            "ltRecords"
        );


    if (!container) {

        return;

    }


    if (!supabaseClient) {

        container.innerHTML =
            '<div class="error-box">❌ Supabase غير متصل</div>';

        return;

    }


    try {

        const result =
            await supabaseClient

                .from("records")

                .select("*")

                .eq(
                    "department",
                    "lt"
                );


        if (result.error) {

            console.error(
                "LT LOAD ERROR:",
                result.error
            );

            container.innerHTML =
                '<div class="error-box">❌ ' +
                escapeHTML(
                    result.error.message
                ) +
                '</div>';

            return;

        }


        const records =
            result.data || [];


        if (!records.length) {

            container.innerHTML =
                '<div class="empty">' +
                "لا توجد بيانات مسجلة حتى الآن" +
                "</div>";

            return;

        }


        /* =========================
           ترتيب الأحدث أولاً
        ========================= */

        records.sort(
            function(a, b) {

                return new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                );

            }
        );


        container.innerHTML = "";


        /* =========================
           عرض السجلات
        ========================= */

        records.forEach(
            function(record) {

                const div =
                    document.createElement(
                        "div"
                    );


                const isCompleted =
                    String(
                        record.done || ""
                    ).trim() === "نعم";


                div.className =
                    isCompleted
                        ? "record completed"
                        : "record not-completed";


                /* =========================
                   الحالة
                ========================= */

                let statusHTML = "";


                if (isCompleted) {

                    statusHTML = `

                        <div class="completed-info">

                            <p>

                                <strong>
                                    📌 الحالة:
                                </strong>

                                <span class="status-badge status-completed">

                                    ✅ تم الانتهاء بنجاح

                                </span>

                            </p>



                        </div>

                    `;

                }

                else {

                    statusHTML = `

                        <p>

                            <strong>
                                📌 الحالة:
                            </strong>

                            <span class="status-badge status-not-completed">

                                ❌  لم يتم الانتهاء

                            </span>

                        </p>

                    `;


                    if (
                        record.not_completed_reason
                    ) {

                        statusHTML += `

                            <div class="reason-display">

                                <strong>

                                    ❌ سبب عدم الانتهاء:

                                </strong>

                                <br>

                                ${escapeHTML(
                                    record.not_completed_reason
                                )}

                            </div>

                        `;

                    }

                }


                /* =========================
                   HTML السجل
                ========================= */

                div.innerHTML = `

                    <h3>

                        🚆

                        ${escapeHTML(
                            record.car_name ||
                            "غير موجود"
                        )}

                    </h3>


                    <p>

                        <strong>
                            🔢 رقم العربية:
                        </strong>

                        ${escapeHTML(
                            record.car_number ||
                            "غير موجود"
                        )}

                    </p>


                    <p>

                        <strong>
                            🔌 الجهاز:
                        </strong>

                        ${escapeHTML(
                            record.device ||
                            "غير موجود"
                        )}

                    </p>


                    <p>

                        <strong>
                            🔗 السوكيت:
                        </strong>

                        ${escapeHTML(
                            record.socket ||
                            "لا يوجد"
                        )}

                    </p>


                    ${statusHTML}


                    <p>

                        <strong>
                            📝 الملاحظات:
                        </strong>

                        ${escapeHTML(
                            record.notes ||
                            "لا يوجد"
                        )}

                    </p>


                    <p>

                        <strong>
                            👤 المستخدم الذي سجل:
                        </strong>

                        ${escapeHTML(
                            record.created_by ||
                            "غير معروف"
                        )}

                    </p>


                    <p>

                        <strong>
                            🕐 وقت التسجيل:
                        </strong>

                        ${formatArabicDate(
                            record.created_at
                        )}

                    </p>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }

    catch (error) {

        console.error(
            "LT LOAD ERROR:",
            error
        );

        container.innerHTML =
            '<div class="error-box">' +
            "❌ حصل خطأ أثناء تحميل البيانات" +
            '</div>';

    }

}
