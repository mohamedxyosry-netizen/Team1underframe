<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NERIC - HT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
}

.dashboard {
    min-height: 100vh;
}

/* =====================================================
   HEADER
===================================================== */

.header {
    background: rgb(52, 67, 84);
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    border-bottom: 3px solid #5928e0;
}

.header h1 {
    margin: 0 0 7px;
    font-size: 28px;
    color: white;
}

.header p {
    margin: 0;
    color: #d1d5db;
    font-size: 14px;
}

.logout-btn {
    border: none;
    background: #198754;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.logout-btn:hover {
    opacity: .9;
}

/* =====================================================
   PAGE
===================================================== */

.form-page {
    width: min(1100px, 94%);
    margin: 30px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    align-items: start;
}

/* =====================================================
   CARDS
===================================================== */

.form-card,
.records-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    border: 1px solid #e5e7eb;
}

.form-card {
    border-top: 5px solid #198754;
}

.records-card {
    border-top: 5px solid #0d6efd;
}

.form-card h2,
.records-card h2 {
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 21px;
}

.form-card h2 {
    color: #198754;
}

.records-card h2 {
    color: #0d6efd;
}

/* =====================================================
   INPUTS
===================================================== */

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #374151;
}

.input-group input,
.input-group select,
.input-group textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    background: #f9fafb;
    outline: none;
    transition: .2s;
    font-family: inherit;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
    border-color: #198754;
    background: white;
    box-shadow: 0 0 0 3px rgba(25,135,84,.12);
}

.input-group textarea {
    min-height: 110px;
    resize: vertical;
}

/* =====================================================
   DEVICE
===================================================== */

#htDevice {
    cursor: pointer;
    background: #f9fafb;
}

/* =====================================================
   رقم العربية - نفس شكل LT
===================================================== */

.car-number-preview {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
    direction: ltr;
}

.number-part {
    background: #f8fafc;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 10px 5px;
    text-align: center;
    min-height: 78px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.number-part span {
    display: block;
    font-size: 12px;
    color: #64748b;
    margin-bottom: 5px;
    direction: rtl;
}

.number-part strong {
    display: block;
    font-size: 22px;
    color: #344354;
    direction: ltr;
}

.car-name-part {
    background: #f0fdf4;
    border: 2px solid #198754;
}

.car-name-part strong {
    color: #198754;
    font-size: 23px;
}

/* =====================================================
   SAVE BUTTON
===================================================== */

.save-btn {
    width: 100%;
    border: none;
    background: #198754;
    color: white;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    margin-top: 5px;
}

.save-btn:hover {
    background: #157347;
}

.save-btn:disabled {
    background: #6c757d;
    cursor: not-allowed;
}

/* =====================================================
   MESSAGE
===================================================== */

#htMessage {
    text-align: center;
    font-weight: bold;
    margin-top: 18px;
    line-height: 1.7;
    white-space: pre-line;
}

/* =====================================================
   RECORDS
===================================================== */

#htRecords {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.record {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-right: 5px solid #0d6efd;
    border-radius: 12px;
    padding: 18px;
}

.record h3 {
    margin-top: 0;
    font-size: 16px;
    color: #0d6efd;
}

.record p {
    margin: 9px 0;
    line-height: 1.7;
}

.record strong {
    color: #374151;
}

/* =====================================================
   STATUS
===================================================== */

.status-badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 8px;
    font-weight: bold;
}

.status-completed {
    background: #dcfce7;
    color: #15803d;
}

.status-pending {
    background: #fff7ed;
    color: #c2410c;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
    text-align: center;
    color: #64748b;
    padding: 20px;
}

/* =====================================================
   ERROR
===================================================== */

.error-box {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #b42318;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    line-height: 1.7;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 750px) {

    .header {
        padding: 18px;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
    }

    .logout-btn {
        width: 100%;
    }

    .form-page {
        grid-template-columns: 1fr;
        width: 94%;
        margin: 20px auto;
    }

    .form-card,
    .records-card {
        padding: 20px;
    }

    .car-number-preview {
        gap: 6px;
    }

    .number-part {
        padding: 10px 5px;
    }

    .number-part span {
        font-size: 11px;
    }

    .number-part strong {
        font-size: 18px;
    }

    .car-name-part strong {
        font-size: 19px;
    }

}

</style>

</head>

/* =====================================================
   المستخدم الحالي
===================================================== */

function getCurrentUsername() {

    try {

        const currentUser =
            JSON.parse(
                sessionStorage.getItem("currentUser")
            );

        if (
            currentUser &&
            currentUser.name
        ) {

            return currentUser.name;

        }

        if (
            currentUser &&
            currentUser.username
        ) {

            return currentUser.username;

        }

    }
    catch(error) {

        console.log(
            "Could not read current user"
        );

    }

    return "Unknown";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   DATE
===================================================== */

function formatArabicDate(value) {

    if (!value) {
        return "غير محدد";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }
    ).format(date);

}


/* =====================================================
   تحديث الأجهزة
===================================================== */

function updateHTDevices() {

    const carName =
        document.getElementById("htCarName").value;

    const deviceSelect =
        document.getElementById("htDevice");

    if (!deviceSelect) {
        return;
    }

    deviceSelect.innerHTML = "";

    if (!carName) {

        deviceSelect.disabled = true;

        deviceSelect.innerHTML = `
            <option value="">
                اختر اسم العربية أولاً
            </option>
        `;

        return;
    }

    const devices =
        HT_DEVICES[carName] || [];

    deviceSelect.disabled = false;

    deviceSelect.innerHTML = `
        <option value="">
            ⬇️ اختر اسم الجهاز
        </option>
    `;

    devices.forEach(function(device) {

        const option =
            document.createElement("option");

        option.value = device;
        option.textContent = device;

        deviceSelect.appendChild(option);

    });

}


/* =====================================================
   توليد رقم العربية
   نفس معادلة LT
===================================================== */

function updateHTCarNumber() {

    const carName =
        document.getElementById("htCarName").value;

    const unitNumber =
        document.getElementById("htUnitNumber").value.trim();

    const carNumberInput =
        document.getElementById("htCarNumber");

    const carDisplay =
        document.getElementById("htCarDisplay");

    const nameDisplay =
        document.getElementById("htNameDisplay");

    const unitDisplay =
        document.getElementById("htUnitDisplay");


    /* عرض اسم العربية */

    nameDisplay.textContent =
        carName || "--";


    /* عرض رقم الوحدة */

    unitDisplay.textContent =
        unitNumber || "--";


    /* لو البيانات ناقصة */

    if (
        !carName ||
        !unitNumber ||
        Number(unitNumber) < 17
    ) {

        carDisplay.textContent =
            "--";

        carNumberInput.value =
            "";

        return;

    }


    /* ترتيب العربيات */

    const carPositions = {

        DTC: 0,
        MC1: 1,
        MC2: 2,
        MCI: 3

    };


    const position =
        carPositions[carName];


    /* نفس حساب LT */

    const baseNumber =
        65 +
        (
            (Number(unitNumber) - 17)
            * 4
        );


    const finalNumber =
        baseNumber + position;


    /* عرض الرقم في المربع */

    carDisplay.textContent =
        finalNumber;


    /* الرقم الكامل الذي سيتم حفظه */

    carNumberInput.value =
        finalNumber +
        "-" +
        carName +
        "-" +
        unitNumber;

}


/* =====================================================
   حالة الجهاز
===================================================== */

document
.getElementById("htDone")
.addEventListener(
    "change",
    function() {

        const group =
            document.getElementById(
                "htReasonGroup"
            );

        const reason =
            document.getElementById(
                "htReason"
            );

        if (this.value === "لا") {

            group.style.display =
                "block";

            reason.required =
                true;

        }
        else {

            group.style.display =
                "none";

            reason.required =
                false;

            reason.value =
                "";

        }

    }
);


/* =====================================================
   حفظ HT
===================================================== */

async function saveHT() {

    const carNameElement =
        document.getElementById("htCarName");

    const unitNumberElement =
        document.getElementById("htUnitNumber");

    const carNumberElement =
        document.getElementById("htCarNumber");

    const deviceElement =
        document.getElementById("htDevice");

    const doneElement =
        document.getElementById("htDone");

    const reasonElement =
        document.getElementById("htReason");

    const notesElement =
        document.getElementById("htNotes");

    const message =
        document.getElementById("htMessage");

    const button =
        document.getElementById("saveHTButton");


    const carName =
        carNameElement.value.trim();

    const unitNumber =
        unitNumberElement.value.trim();

    const carNumber =
        carNumberElement.value.trim();

    const device =
        deviceElement.value.trim();

    const done =
        doneElement.value;

    const reason =
        reasonElement.value.trim();

    const notes =
        notesElement.value.trim();


    /* =================================================
       التحقق
    ================================================= */

    if (
        !carName ||
        !unitNumber ||
        !carNumber ||
        !device ||
        !done
    ) {

        message.innerText =
            "❌ من فضلك اختر اسم العربية ورقم الوحدة واسم الجهاز والحالة";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        Number(unitNumber) < 17
    ) {

        message.innerText =
            "❌ رقم الوحدة يجب أن يكون 17 أو أكبر";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        done === "لا" &&
        !reason
    ) {

        message.innerText =
            "❌ من فضلك اكتب سبب عدم الانتهاء";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!supabaseClient) {

        message.innerText =
            "❌ Supabase غير متصل";

        message.style.color =
            "#dc3545";

        return;

    }


    button.disabled =
        true;

    button.innerText =
        "⏳ جاري الحفظ...";

    message.innerText =
        "⏳ جاري حفظ البيانات...";

    message.style.color =
        "#0d6efd";


    /* =================================================
       البيانات
    ================================================= */

    const payload = {

        department: "ht",

        car_name: carName,

        car_number: carNumber,

        device: device,

        done: done,

        notes: notes,

        created_by:
            getCurrentUsername(),

        not_completed_reason:
            done === "لا"
                ? reason
                : null

    };


    try {

        const result =
            await supabaseClient
                .from("records")
                .insert(payload)
                .select()
                .single();


        if (result.error) {

            console.error(
                "HT INSERT ERROR:",
                result.error
            );

            message.innerText =
                "❌ فشل الحفظ:\n" +
                result.error.message;

            message.style.color =
                "#dc3545";

            button.disabled =
                false;

            button.innerText =
                "💾 حفظ البيانات";

            return;

        }


        /* =================================================
           نجاح
        ================================================= */

        message.innerText =
            "✅ تم حفظ البيانات بنجاح";

        message.style.color =
            "#198754";


        /* =================================================
           تفريغ البيانات
        ================================================= */

        carNameElement.value =
            "";

        unitNumberElement.value =
            "";

        carNumberElement.value =
            "";

        document.getElementById(
            "htCarDisplay"
        ).textContent =
            "--";

        document.getElementById(
            "htNameDisplay"
        ).textContent =
            "--";

        document.getElementById(
            "htUnitDisplay"
        ).textContent =
            "--";


        deviceElement.innerHTML = `
            <option value="">
                اختر اسم العربية أولاً
            </option>
        `;

        deviceElement.disabled =
            true;

        doneElement.value =
            "";

        reasonElement.value =
            "";

        notesElement.value =
            "";

        document.getElementById(
            "htReasonGroup"
        ).style.display =
            "none";


        button.disabled =
            false;

        button.innerText =
            "💾 حفظ البيانات";


        await loadHTRecords();

    }

    catch(error) {

        console.error(
            "HT SAVE ERROR:",
            error
        );

        message.innerText =
            "❌ حصل خطأ أثناء الحفظ:\n" +
            error.message;

        message.style.color =
            "#dc3545";

        button.disabled =
            false;

        button.innerText =
            "💾 حفظ البيانات";

    }

}


/* =====================================================
   تحميل السجلات
===================================================== */

async function loadHTRecords() {

    const container =
        document.getElementById(
            "htRecords"
        );

    if (!container) {
        return;
    }

    if (!supabaseClient) {

        container.innerHTML = `
            <div class="error-box">
                ❌ Supabase غير متصل
            </div>
        `;

        return;
    }


    try {

        const result =
            await supabaseClient
                .from("records")
                .select("*")
                .eq("department", "ht");


        if (result.error) {

            container.innerHTML = `
                <div class="error-box">
                    ❌
                    ${escapeHTML(
                        result.error.message
                    )}
                </div>
            `;

            return;

        }


        const records =
            result.data || [];


        if (!records.length) {

            container.innerHTML = `
                <div class="empty">
                    لا توجد بيانات مسجلة حتى الآن
                </div>
            `;

            return;

        }


        records.sort(
            function(a, b) {

                return new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                );

            }
        );


        container.innerHTML =
            "";


        records.forEach(
            function(record) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "record";


                /* مهم لنظام الحذف */

                div.dataset.recordId =
                    record.id;


                const isCompleted =
                    String(
                        record.done || ""
                    ).trim() === "نعم";


                div.innerHTML = `

                    <h3>

                        🔧

                        ${escapeHTML(
                            record.device ||
                            "جهاز HT"
                        )}

                    </h3>


                    <p>

                        <strong>
                            🚆 اسم العربية:
                        </strong>

                        ${escapeHTML(
                            record.car_name ||
                            ""
                        )}

                    </p>


                    <p>

                        <strong>
                            🔢 رقم العربية:
                        </strong>

                        ${escapeHTML(
                            record.car_number ||
                            ""
                        )}

                    </p>


                    <p>

                        <strong>
                            📌 الحالة:
                        </strong>

                        <span
                            class="status-badge
                            ${
                                isCompleted
                                ?
                                "status-completed"
                                :
                                "status-pending"
                            }">

                            ${
                                isCompleted
                                ?
                                "✅ تم التقفيل"
                                :
                                "❌ لم يتم التقفيل"
                            }

                        </span>

                    </p>


                    ${
                        !isCompleted &&
                        record.not_completed_reason

                        ?

                        `

                        <p>

                            <strong>
                                ❌ سبب عدم الانتهاء:
                            </strong>

                            ${escapeHTML(
                                record.not_completed_reason
                            )}

                        </p>

                        `

                        :

                        ""
                    }


                    <p>

                        <strong>
                            📝 الملاحظات:
                        </strong>

                        ${escapeHTML(
                            record.notes ||
                            "لا يوجد"
                        )}

                    </p>


                    <p>

                        <strong>
                            👤 المستخدم:
                        </strong>

                        ${escapeHTML(
                            record.created_by ||
                            ""
                        )}

                    </p>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }

    catch(error) {

        console.error(
            "HT LOAD ERROR:",
            error
        );

        container.innerHTML = `
            <div class="error-box">
                ❌ حصل خطأ أثناء تحميل البيانات
            </div>
        `;

    }

}
