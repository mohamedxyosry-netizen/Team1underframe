<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>البحث عن سيارة</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   تصميم صفحة البحث - الشكل فقط
========================================================= */

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #0f172a;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
    --warning: #ea580c;
    --danger: #dc2626;
}

body {
    background:
        radial-gradient(
            circle at top right,
            rgba(37,99,235,.08),
            transparent 35%
        ),
        #f1f5f9 !important;

    color: var(--text);
}


/* =========================================================
   HEADER
========================================================= */

.header {

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b
        ) !important;

    border-bottom:
        3px solid #2563eb !important;

    min-height: 82px;

    box-shadow:
        0 8px 25px rgba(15,23,42,.15);

    padding:
        18px 25px !important;
}

.header h1 {

    color: #ffffff !important;

    font-size: 25px !important;

    font-weight: 800;

    margin-bottom: 5px !important;
}

.header p {

    color: #cbd5e1 !important;

    font-size: 14px;

    margin: 0 !important;
}


/* =========================================================
   زر الأقسام الرئيسية
========================================================= */

.logout-btn {

    background:
        rgba(255,255,255,.08) !important;

    color: #ffffff !important;

    border:
        1px solid rgba(255,255,255,.18) !important;

    border-radius: 10px !important;

    padding:
        11px 18px !important;

    font-weight: 700;

    transition: .2s;
}

.logout-btn:hover {

    background:
        #2563eb !important;

    border-color:
        #2563eb !important;

    transform:
        translateY(-1px);
}


/* =========================================================
   الصفحة
========================================================= */

.search-page {

    max-width: 1100px !important;

    margin: 0 auto;

    padding:
        28px 20px 50px !important;
}


/* =========================================================
   كارت البحث
========================================================= */

.form-card {

    background:
        rgba(255,255,255,.96) !important;

    border:
        1px solid #e2e8f0 !important;

    border-radius:
        20px !important;

    padding:
        28px !important;

    box-shadow:
        0 10px 35px rgba(15,23,42,.08) !important;

    margin-bottom:
        25px;

    position:
        relative;

    overflow:
        hidden;
}

.form-card::before {

    content: "";

    position:
        absolute;

    top: 0;

    right: 0;

    left: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed,
            #06b6d4
        );
}

.form-card h2 {

    font-size:
        22px !important;

    color:
        #0f172a;

    margin-bottom:
        22px !important;

    font-weight:
        800;
}


/* =========================================================
   INPUT
========================================================= */

.input-group {

    margin-bottom:
        18px;
}

.input-group label {

    display:
        block;

    font-size:
        14px;

    font-weight:
        800;

    color:
        #334155;

    margin-bottom:
        8px;
}


/* =========================================================
   SELECT
========================================================= */

.device-select,
#searchCarNumber {

    width:
        100% !important;

    height:
        52px;

    padding:
        0 16px !important;

    border:
        1px solid #cbd5e1 !important;

    border-radius:
        12px !important;

    background:
        #ffffff !important;

    color:
        #0f172a;

    font-size:
        15px !important;

    font-family:
        inherit;

    outline:
        none;

    transition:
        .2s;

    cursor:
        pointer;

    box-shadow:
        0 2px 6px rgba(15,23,42,.03);
}

#searchCarNumber:hover {

    border-color:
        #94a3b8 !important;
}

#searchCarNumber:focus {

    border-color:
        #2563eb !important;

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,.10) !important;
}


/* =========================================================
   زر البحث
========================================================= */

.save-btn {

    width:
        100% !important;

    height:
        52px;

    border:
        none !important;

    border-radius:
        12px !important;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        ) !important;

    color:
        #ffffff !important;

    font-size:
        16px !important;

    font-weight:
        800 !important;

    cursor:
        pointer;

    box-shadow:
        0 7px 18px
        rgba(37,99,235,.22);

    transition:
        .2s;
}

.save-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 24px
        rgba(37,99,235,.30);
}

.save-btn:active {

    transform:
        translateY(0);
}

.save-btn:disabled {

    opacity:
        .7;

    cursor:
        wait;

    transform:
        none;
}


/* =========================================================
   عنوان نتيجة البحث
========================================================= */

.search-title {

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8fafc
        ) !important;

    border:
        1px solid #e2e8f0 !important;

    border-radius:
        18px !important;

    padding:
        22px 24px !important;

    margin-bottom:
        18px !important;

    box-shadow:
        0 7px 25px
        rgba(15,23,42,.06) !important;

    position:
        relative;
}

.search-title::before {

    content:
        "";

    position:
        absolute;

    right:
        0;

    top:
        15px;

    bottom:
        15px;

    width:
        4px;

    background:
        #2563eb;

    border-radius:
        5px;
}

.search-title h2 {

    color:
        #0f172a !important;

    font-size:
        20px !important;

    font-weight:
        800;

    margin:
        0 0 7px !important;
}

.search-title p {

    color:
        #64748b !important;

    font-size:
        14px;

    margin:
        0 !important;
}

.search-title strong {

    color:
        #2563eb;
}


/* =========================================================
   كروت الأقسام
========================================================= */

.department-result {

    background:
        #ffffff !important;

    border:
        1px solid #e2e8f0 !important;

    border-radius:
        18px !important;

    padding:
        20px !important;

    margin-bottom:
        18px !important;

    box-shadow:
        0 7px 25px
        rgba(15,23,42,.06) !important;

    overflow:
        hidden;

    transition:
        .2s;
}

.department-result:hover {

    box-shadow:
        0 10px 30px
        rgba(15,23,42,.09) !important;

    transform:
        translateY(-1px);
}

.department-result > h2 {

    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );

    border-radius:
        12px;

    padding:
        13px 16px;

    margin:
        0 0 16px !important;

    color:
        #1e293b;

    font-size:
        18px !important;

    font-weight:
        800;

    border:
        1px solid #e2e8f0;
}

.department-result p {

    background:
        #f8fafc;

    border-bottom:
        1px solid #e2e8f0;

    padding:
        10px 12px;

    margin:
        0 !important;

    line-height:
        1.8;

    color:
        #475569;

    font-size:
        14px;
}

.department-result p:last-child {

    border-bottom:
        none;
}

.department-result p strong {

    color:
        #1e293b;

    font-weight:
        800;
}


/* =========================================================
   WORK BOX
========================================================= */

.work-box {

    margin-top:
        15px !important;

    background:
        #ffffff !important;

    border:
        1px solid #e2e8f0 !important;

    border-radius:
        14px !important;

    padding:
        17px !important;

    box-shadow:
        0 3px 12px
        rgba(15,23,42,.03);
}

.work-title {

    font-size:
        17px !important;

    font-weight:
        800 !important;

    color:
        #1e293b;

    margin-bottom:
        13px !important;
}


/* =========================================================
   CLOSED
========================================================= */

.closed-box {

    background:
        linear-gradient(
            135deg,
            #f0fdf4,
            #ffffff
        ) !important;

    border-color:
        #bbf7d0 !important;
}

.closed-title {

    color:
        #15803d !important;
}


/* =========================================================
   REGISTERED
========================================================= */

.registered-box {

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #ffffff
        ) !important;

    border-color:
        #bfdbfe !important;
}


/* =========================================================
   DEVICE CARD
========================================================= */

.device-card {

    background:
        #ffffff !important;

    border:
        1px solid #dbeafe !important;

    border-radius:
        13px !important;

    padding:
        16px !important;

    margin-top:
        12px !important;

    box-shadow:
        0 4px 14px
        rgba(37,99,235,.06);
}

.device-card-title {

    color:
        #1d4ed8 !important;

    font-size:
        17px !important;

    font-weight:
        800 !important;

    padding-bottom:
        10px;

    border-bottom:
        1px solid #e2e8f0;

    margin-bottom:
        8px !important;
}


/* =========================================================
   التفاصيل
========================================================= */

.detail-row {

    padding:
        9px 0 !important;

    border-bottom:
        1px solid #f1f5f9 !important;

    line-height:
        1.7;
}

.detail-row:last-child {

    border-bottom:
        none !important;
}

.detail-label {

    color:
        #334155 !important;

    font-weight:
        800 !important;
}

.person {

    color:
        #047857 !important;

    font-weight:
        800;
}


/* =========================================================
   PENDING
========================================================= */

.pending-button {

    width:
        100% !important;

    border:
        1px solid #fed7aa !important;

    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #ffffff
        ) !important;

    color:
        #c2410c !important;

    padding:
        15px 16px !important;

    border-radius:
        12px !important;

    cursor:
        pointer;

    font-size:
        15px !important;

    font-weight:
        800 !important;

    font-family:
        inherit;

    text-align:
        right;

    transition:
        .2s;
}

.pending-button:hover {

    background:
        #ffedd5 !important;

    transform:
        translateY(-1px);

    box-shadow:
        0 5px 15px
        rgba(234,88,12,.08);
}

.pending-list {

    display:
        none;

    margin-top:
        12px;
}

.pending-item {

    background:
        #fff7ed !important;

    border:
        1px solid #fed7aa !important;

    color:
        #9a3412 !important;

    border-radius:
        11px !important;

    padding:
        13px !important;

    margin-bottom:
        8px !important;

    font-weight:
        800 !important;

    cursor:
        pointer;

    transition:
        .2s;
}

.pending-item:hover {

    background:
        #ffedd5 !important;

    transform:
        translateY(-1px);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.05);
}

.pending-item small {

    display:
        block;

    margin-top:
        5px;

    font-weight:
        normal;

    color:
        #b45309;
}


/* =========================================================
   PENDING DETAILS
========================================================= */

.pending-details {

    display:
        none;

    background:
        #ffffff !important;

    border:
        1px solid #fdba74 !important;

    border-radius:
        11px !important;

    padding:
        14px !important;

    margin:
        -3px 0 10px;

    line-height:
        1.8;
}

.pending-details.show {

    display:
        block;
}

.pending-detail-row {

    padding:
        8px 0 !important;

    border-bottom:
        1px solid #f1f5f9 !important;
}

.pending-detail-row:last-child {

    border-bottom:
        none !important;
}

.pending-detail-label {

    font-weight:
        800;

    color:
        #475569;
}

   SELECT الأجهزة
========================================================= */

.device-select {

    height:

    border-radius:
        11px !important;

    background:
        #ffffff !important;

    border:
        1px solid #cbd5e1 !important;
}


/* =========================================================
   INFO
========================================================= */

    margin-top:
        11px !important;

    color:
        #64748b !important;

    font-size:
        13px !important;

    line-height:
        1.9;
}

.info-box strong {

    color:
        #1e293b;
}


/* =========================================================
   COMPLETE
========================================================= */

.complete-box {

    background:
        #ecfdf3 !important;

    border:
        1px solid #abefc6 !important;

    color:
        #067647 !important;

    padding:
        16px !important;

    border-radius:
        11px !important;

    text-align:
        center;

    font-weight:
        800;
}


/* =========================================================
   NO RECORDS
========================================================= */

.no-records-box,
.no-car {

    background:
        #f8fafc !important;

    border:
        1px dashed #cbd5e1 !important;

    padding:
        16px !important;

    border-radius:
        11px !important;

    text-align:
        center;

    color:
        #64748b !important;

    font-weight:
        700;
}


/* =========================================================
   REASON
========================================================= */

.reason {

    background:
        #fff7ed !important;

    border:
        1px solid #fdba74 !important;

    color:
        #9a3412 !important;

    padding:
        12px !important;

    border-radius:
        9px !important;

    margin-top:
        9px !important;

    line-height:
        1.8;
}


/* =========================================================
   NOT REGISTERED
========================================================= */

.not-registered {

    background:
        #f8fafc !important;

    border:
        1px dashed #cbd5e1 !important;

    color:
        #64748b !important;

    padding:
        12px !important;

    border-radius:
        9px !important;

    text-align:
        center;

    margin-top:
        5px !important;
}


/* =========================================================
   ERROR
========================================================= */

.error {

    background:
        #fef2f2 !important;

    border:
        1px solid #fecaca !important;

    color:
        #b91c1c !important;

    padding:
        16px !important;

    border-radius:
        13px !important;

    margin-bottom:
        18px;

    text-align:
        center;

    font-weight:
        700;

    box-shadow:
        0 5px 15px
        rgba(220,38,38,.06);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:750px) {

    .header {

        padding:
            15px !important;

        gap:
            10px;
    }

    .header h1 {

        font-size:
            20px !important;
    }

    .header p {

        font-size:
            12px;
    }

    .logout-btn {

        padding:
            9px 12px !important;

        font-size:
            12px;
    }

    .search-page {

        padding:
            18px 12px 35px !important;
    }

    .form-card {

        padding:
            20px !important;

        border-radius:
            16px !important;
    }

    .form-card h2 {

        font-size:
            19px !important;
    }

    .device-select {

        font-size:
            15px;
    }

    .department-result {

        padding:
            14px !important;

        border-radius:
            15px !important;
    }

    .department-result > h2 {

        font-size:
            16px !important;
    }

    .work-box {

        padding:
            13px !important;
    }

    .pending-button {

        font-size:
            14px !important;
    }

/* =========================================================
   تحسين إضافي للموبايل الصغير
========================================================= */

@media (max-width:480px) {

    .header {

        min-height:
            auto;

        flex-direction:
            column;

        align-items:
            stretch;

        text-align:
            center;
    }

    .logout-btn {

        width:
            100%;
    }

    .form-card {

        padding:
            17px !important;
    }

    .search-title {

        padding:
            18px !important;
    }

    .search-title h2 {

        font-size:
            17px !important;
    }

    .device-card {

        padding:
            13px !important;
    }

}

</style>

</head>

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

if(value === null || value === undefined) {
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   DATE
========================================================= */

function formatArabicDate(value) {

if(!value) {
return "غير موجود";
}

const date = new Date(value);

if(isNaN(date.getTime())) {
return escapeHTML(value);
}

return new Intl.DateTimeFormat(
"ar-EG",
{
day:"numeric",
month:"long",
year:"numeric",
hour:"numeric",
minute:"2-digit",
hour12:true
}
).format(date);

}

/* =========================================================
   تحميل العربيات
========================================================= */

async function loadCarNumbers() {

const select =
document.getElementById("searchCarNumber");

if(!select) return;

select.innerHTML = `
<option value="">
⏳ جاري تحميل أرقام العربيات...
</option>
`;

try {

const response =
await supabaseClient
.from("records")
.select("car_number")
.not("car_number","is",null)
.order("car_number",{ascending:true});

if(response.error) {

console.error(response.error);

select.innerHTML = `
<option value="">
❌ تعذر تحميل أرقام العربيات
</option>
`;

return;

}

const rows = response.data || [];

const numbers = [
...new Set(
rows
.map(function(row) {
return String(row.car_number || "").trim();
})
.filter(function(number) {
return number !== "";
})
)
];

numbers.sort(function(a,b) {

const numberA =
parseInt(a.split("-")[0]) || 999999;

const numberB =
parseInt(b.split("-")[0]) || 999999;

if(numberA !== numberB) {
return numberA - numberB;
}

return a.localeCompare(b,"ar");

});

if(!numbers.length) {

select.innerHTML = `
<option value="">
❌ لا توجد عربيات مسجلة
</option>
`;

return;

}

select.innerHTML = `
<option value="">
⬇️ اختر رقم العربية
</option>
`;

numbers.forEach(function(number) {

const option =
document.createElement("option");

option.value = number;

option.textContent =
number.replace(/-/g,"  ");

select.appendChild(option);

});

}
catch(error) {

console.error(error);

select.innerHTML = `
<option value="">
❌ حصل خطأ أثناء تحميل العربيات
</option>
`;

}

}

async function searchCar() {

const input =
document.getElementById(
"searchCarNumber"
);

const result =
document.getElementById(
"searchResult"
);

const button =
document.getElementById(
"searchButton"
);

if(!input || !result) return;

const number =
input.value.trim();

if(!number) {

result.innerHTML = `

<div class="error">

من فضلك اختر رقم العربية

</div>

`;

return;

}

if(button) {

button.disabled = true;

button.innerHTML =
"⏳ جاري البحث...";

}

result.innerHTML = `

<div class="search-title">

<h2>

⏳ جاري البحث عن العربية رقم:

${escapeHTML(number)}

</h2>

</div>

`;

try {

const response =
await supabaseClient
.from("records")
.select("*")
.eq("car_number",number)
.order("id",{ascending:false});

if(response.error) {

console.error(response.error);

result.innerHTML = `

<div class="error">

❌ تعذر البحث في قاعدة البيانات

<br><br>

${escapeHTML(
response.error.message
)}

</div>

`;

return;

}

const records =
response.data || [];


/* =================================================
   اسم العربية
================================================= */

let carName = "";

const carNameRecord =
records.find(function(record) {

return (
record.car_name &&
String(record.car_name).trim() !== ""
);

});

if(carNameRecord) {

carName =
String(
carNameRecord.car_name
).trim();

}

if(!carName) {

const parts =
number.split("-");

if(parts.length >= 2) {

carName =
parts[1].trim();

}

}


/* =================================================
   العنوان
================================================= */

result.innerHTML = `

<div class="search-title">

<h2>

بيانات العربية رقم:

${escapeHTML(number)}

</h2>

تم العثور على

<strong>
${records.length}
</strong>

تسجيل

</p>

</div>

`;


/* =================================================
   الأقسام
================================================= */

const departments = {

wiring:"🔌 قسم Wiring",

lt:"⚡ قسم LT",

ht:"⚡ قسم HT",

installation:"🔧 قسم التركيبات",

final:"✅ FINAL✅"

};


/* =================================================
   عرض الأقسام
================================================= */

Object.keys(departments).forEach(
function(department) {


/* =================================================
   Wiring
================================================= */

if(department === "wiring") {

result.innerHTML +=
createWiringWorkSection(
records,
carName
);

return;

}


/* =================================================
   LT
================================================= */

if(department === "lt") {

result.innerHTML +=
createLTWorkSection(
records,
carName
);

return;

}


/* =================================================
   HT
================================================= */

if(department === "ht") {

result.innerHTML +=
createHTWorkSection(
records,
carName
);

return;

}


/* =================================================
   التركيبات
================================================= */

if(department === "installation") {

result.innerHTML +=
createInstallationWorkSection(
records,
carName
);

return;

}


/* =================================================
   باقي الأقسام
================================================= */

const departmentRecords =
records.filter(function(record) {

return String(
record.department || ""
).trim().toLowerCase() ===
department;

});


/* =================================================
   لا يوجد بيانات
================================================= */

if(departmentRecords.length === 0) {

result.innerHTML += `

<div class="department-result no-data">

<h2>

${departments[department]}

</h2>

<div class="no-car">

❌ لا يوجد بيانات لهذه العربية
في هذا القسم

</div>

</div>

`;

return;

}


/* =================================================
   سجلات القسم
================================================= */

departmentRecords.forEach(function(record) {

let extraFields = "";


/* الجهاز */

if(record.device) {

extraFields += `

<p>

<strong>
اسم الجهاز:
</strong>

${escapeHTML(
record.device
)}

</p>

`;

}


/* السوكت */

if(record.socket) {

extraFields += `

<p>

<strong>
اسم السوكيت:
</strong>

${escapeHTML(
record.socket
)}

</p>

`;

}


/* الشخص */

if(record.person) {

extraFields += `

<p>

<strong>
اسم الشخص:
</strong>

${escapeHTML(
record.person
)}

</p>

`;

}


/* الحالة */

const doneText =
record.done || "";


/* HTML */

result.innerHTML += `

<div class="department-result">

<h2>

${departments[department]}

</h2>


<p>

<strong>
اسم العربية:
</strong>

${escapeHTML(
record.car_name ||
"غير موجود"
)}

</p>


<p>

<strong>
رقم العربية:
</strong>

${escapeHTML(
record.car_number ||
"غير موجود"
)}

</p>


${extraFields}


${
doneText
?
`

<p>

<strong>
الحالة:
</strong>

${escapeHTML(
doneText
)}

</p>

`
:
""
}


<p>

<strong>
الملاحظات:
</strong>

${escapeHTML(
record.notes ||
"لا يوجد"
)}

</p>


<p>

<strong>
تم التسجيل بواسطة:
</strong>

${escapeHTML(
record.created_by ||
"غير معروف"
)}

</p>


<p>

<strong>
تاريخ التسجيل:
</strong>

${formatArabicDate(
record.created_at
)}

</p>

</div>

`;

});

});

}
catch(error) {

console.error(
"SEARCH ERROR:",
error
);

result.innerHTML = `

<div class="error">

❌ حصل خطأ أثناء البحث

<br><br>

${escapeHTML(
error.message ||
error
)}

</div>

`;

}

finally {

if(button) {

button.disabled =
false;

button.innerHTML =
"🔍 بحث";

}

}

}


/* =========================================================
   اختيار العربية
========================================================= */

document
.getElementById("searchCarNumber")
.addEventListener(
"change",
function() {

const number =
this.value.trim();

if(!number) return;

searchCar();

}
);


/* =========================================================
   تشغيل
========================================================= */

loadCarNumbers();


/* =========================================================
   رقم البحث القادم من الصفحة الرئيسية
========================================================= */

try {

const savedNumber =
localStorage.getItem(
"searchNumber"
);

if(savedNumber) {

setTimeout(function() {

const select =
document.getElementById(
"searchCarNumber"
);

if(!select) return;

const option =
Array.from(
select.options
).find(function(option) {

return option.value ===
savedNumber;

});

if(option) {

select.value =
savedNumber;

searchCar();

}

},700);

localStorage.removeItem(
"searchNumber"
);

}

}
catch(error) {

console.log(
"لا يوجد رقم بحث محفوظ"
);

}

</script>

</body>

</html>
