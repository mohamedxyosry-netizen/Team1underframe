/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

if(value === null || value === undefined) {
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   DATE
========================================================= */

function formatArabicDate(value) {

if(!value) {
return "غير موجود";
}

const date = new Date(value);

if(isNaN(date.getTime())) {
return escapeHTML(value);
}

return new Intl.DateTimeFormat(
"ar-EG",
{
day:"numeric",
month:"long",
year:"numeric",
hour:"numeric",
minute:"2-digit",
hour12:true
}
).format(date);

}

/* =========================================================
   تحميل العربيات
========================================================= */

async function loadCarNumbers() {

const select =
document.getElementById("searchCarNumber");

if(!select) return;

select.innerHTML = `
<option value="">
⏳ جاري تحميل أرقام العربيات...
</option>
`;

try {

const response =
await supabaseClient
.from("records")
.select("car_number")
.not("car_number","is",null)
.order("car_number",{ascending:true});

if(response.error) {

console.error(response.error);

select.innerHTML = `
<option value="">
❌ تعذر تحميل أرقام العربيات
</option>
`;

return;

}

const rows = response.data || [];

const numbers = [
...new Set(
rows
.map(function(row) {
return String(row.car_number || "").trim();
})
.filter(function(number) {
return number !== "";
})
)
];

numbers.sort(function(a,b) {

const numberA =
parseInt(a.split("-")[0]) || 999999;

const numberB =
parseInt(b.split("-")[0]) || 999999;

if(numberA !== numberB) {
return numberA - numberB;
}

return a.localeCompare(b,"ar");

});

if(!numbers.length) {

select.innerHTML = `
<option value="">
❌ لا توجد عربيات مسجلة
</option>
`;

return;

}

select.innerHTML = `
<option value="">
⬇️ اختر رقم العربية
</option>
`;

numbers.forEach(function(number) {

const option =
document.createElement("option");

option.value = number;

option.textContent =
number.replace(/-/g,"  ");

select.appendChild(option);

});

}
catch(error) {

console.error(error);

select.innerHTML = `
<option value="">
❌ حصل خطأ أثناء تحميل العربيات
</option>
`;

}

}

return String(record.department || "")
.trim().toLowerCase() === "lt";

});

const groupsMap = {};

ltRecords.forEach(function(record) {

const device =
String(record.device || "").trim();

if(!device) return;

if(!groupsMap[device]) {
groupsMap[device] = [];
}

groupsMap[device].push(record);

});

const pendingDevices = [];

const groupRecords =

groupRecords.filter(function(record) {

});

closedDevices.push({

records:closedRecords
});

}
else {

pendingDevices.push({

records:groupRecords
});

});

device:device,
records:closedRecords
});

}
else {

pendingDevices.push({
device:device,
records:groupRecords
});

}

}

const indexA = devices.indexOf(a.device);
const indexB = devices.indexOf(b.device);

if(indexA === -1 && indexB === -1) {
return a.device.localeCompare(b.device,"en");
}

if(indexA === -1) return 1;
if(indexB === -1) return -1;

return indexA - indexB;

response.error.message
)}

</div>

`;

return;

}

const records =
response.data || [];


/* =================================================
   اسم العربية
================================================= */

let carName = "";

const carNameRecord =
records.find(function(record) {

return (
record.car_name &&
String(record.car_name).trim() !== ""
);

});

if(carNameRecord) {

carName =
String(
carNameRecord.car_name
).trim();

}

if(!carName) {

const parts =
number.split("-");

if(parts.length >= 2) {

carName =
parts[1].trim();

}

}


/* =================================================
   العنوان
================================================= */

result.innerHTML = `

<div class="search-title">

<h2>

بيانات العربية رقم:

${escapeHTML(number)}

</h2>

<p>

تم العثور على

<strong>
${records.length}
</strong>

تسجيل

</p>

</div>

`;


/* =================================================
   الأقسام
================================================= */

const departments = {

wiring:"🔌 قسم Wiring",

lt:"⚡ قسم LT",

ht:"⚡ قسم HT",

installation:"🔧 قسم التركيبات",

final:"✅ قسم الفنش النهائي"

};


/* =================================================
   عرض الأقسام
================================================= */

Object.keys(departments).forEach(
function(department) {


/* =================================================
   LT
================================================= */

if(department === "lt") {

result.innerHTML +=
createLTWorkSection(
records,
carName
);

return;

}


/* =================================================
   HT
================================================= */

if(department === "ht") {

result.innerHTML +=
createHTWorkSection(
records,
carName
);

return;

}


/* =================================================
   التركيبات
================================================= */

if(department === "installation") {

result.innerHTML +=
createInstallationWorkSection(
records,
carName
);

return;

}


/* =================================================
   باقي الأقسام
================================================= */

const departmentRecords =
records.filter(function(record) {

return String(
record.department || ""
).trim().toLowerCase() ===
department;

});


/* =================================================
   لا يوجد بيانات
================================================= */

if(departmentRecords.length === 0) {

result.innerHTML += `

<div class="department-result no-data">

<h2>

${departments[department]}

</h2>

<div class="no-car">

❌ لا يوجد بيانات لهذه العربية
في هذا القسم

</div>

</div>

`;

return;

}


/* =================================================
   سجلات القسم
================================================= */

departmentRecords.forEach(function(record) {

let extraFields = "";


/* الجهاز */

if(record.device) {

extraFields += `

<p>

<strong>
اسم الجهاز:
</strong>

${escapeHTML(
record.device
)}

</p>

`;

}


/* السوكت */

if(record.socket) {

extraFields += `

<p>

<strong>
اسم السوكيت:
</strong>

${escapeHTML(
record.socket
)}

</p>

`;

}


/* الشخص */

if(record.person) {

extraFields += `

<p>

<strong>
اسم الشخص:
</strong>

${escapeHTML(
record.person
)}

</p>

`;

}


/* الحالة */

const doneText =
record.done || "";


/* HTML */

result.innerHTML += `

<div class="department-result">

<h2>

${departments[department]}

</h2>


<p>

<strong>
اسم العربية:
</strong>

${escapeHTML(
record.car_name ||
"غير موجود"
)}

</p>


<p>

<strong>
رقم العربية:
</strong>

${escapeHTML(
record.car_number ||
"غير موجود"
)}

</p>


${extraFields}


${
doneText
?
`

<p>

<strong>
الحالة:
</strong>

${escapeHTML(
doneText
)}

</p>

`
:
""
}


<p>

<strong>
الملاحظات:
</strong>

${escapeHTML(
record.notes ||
"لا يوجد"
)}

</p>


<p>

<strong>
تم التسجيل بواسطة:
</strong>

${escapeHTML(
record.created_by ||
"غير معروف"
)}

</p>


<p>

<strong>
تاريخ التسجيل:
</strong>

${formatArabicDate(
record.created_at
)}

</p>

</div>

`;

});

});

}
catch(error) {

console.error(
"SEARCH ERROR:",
error
);

result.innerHTML = `

<div class="error">

❌ حصل خطأ أثناء البحث

<br><br>

${escapeHTML(
error.message ||
error
)}

</div>

`;

}

finally {

if(button) {

button.disabled =
false;

button.innerHTML =
"🔍 بحث";

}

}

}


/* =========================================================
   اختيار العربية
========================================================= */

document
.getElementById("searchCarNumber")
.addEventListener(
"change",
function() {

const number =
this.value.trim();

if(!number) return;

searchCar();

}
);


/* =========================================================
   تشغيل
========================================================= */

loadCarNumbers();


/* =========================================================
   رقم البحث القادم من الصفحة الرئيسية
========================================================= */

try {

const savedNumber =
localStorage.getItem(
"searchNumber"
);

if(savedNumber) {

setTimeout(function() {

const select =
document.getElementById(
"searchCarNumber"
);

if(!select) return;

const option =
Array.from(
select.options
).find(function(option) {

return option.value ===
savedNumber;

});

if(option) {

select.value =
savedNumber;

searchCar();

}

},700);

localStorage.removeItem(
"searchNumber"
);

}

}
catch(error) {

console.log(
"لا يوجد رقم بحث محفوظ"
);

}

</script>

</body>

</html>
