<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>كشف الحضور - Under Frame</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .attendance-page {
            min-height: 100vh;
            padding: 25px;
        }

        .attendance-header {
            background: #fff;
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            gap: 15px;
            flex-wrap: wrap;
        }

        .attendance-title h1 {
            margin: 0 0 7px;
            color: #06345c;
            font-size: 26px;
        }

        .attendance-title p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            border: none;
            background: #06345c;
            color: white;
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .back-btn:hover { background: #0879e8; }

        .checkin-btn {
            border: none;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            padding: 12px 26px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 10px rgba(22,163,74,.3);
            transition: all 0.2s;
        }

        .checkin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(22,163,74,.4);
        }

        .leave-btn {
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 3px 10px rgba(245,158,11,.3);
            transition: all 0.2s;
        }

        .leave-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(245,158,11,.4);
        }

        .checkin-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .filters {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: end;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .filter-item label {
            font-size: 13px;
            font-weight: bold;
            color: #06345c;
        }

        .filter-item select {
            min-width: 150px;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .filter-item select:focus { border-color: #0879e8; }

        .show-btn {
            border: none;
            background: #0879e8;
            color: white;
            padding: 11px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .show-btn:hover { background: #06345c; }

        .month-info {
            background: #fff;
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            flex-wrap: wrap;
            gap: 10px;
        }

        .month-info strong {
            color: #06345c;
            font-size: 20px;
        }

        .month-info span {
            color: #6b7280;
            font-size: 14px;
        }

        .attendance-container {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-header h2 {
            margin: 0;
            color: #06345c;
            font-size: 20px;
        }

        .refresh-btn {
            border: none;
            background: #0879e8;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .refresh-btn:hover { background: #06345c; }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: #06345c;
            color: white;
            padding: 12px 10px;
            border: 1px solid #d1d5db;
            white-space: nowrap;
            font-size: 13px;
        }

        td {
            padding: 9px 8px;
            border: 1px solid #dfe4ea;
            background: white;
            font-size: 13px;
            white-space: nowrap;
        }

        tbody tr:hover td { background: #f5f9ff; }

        .person-name {
            font-weight: bold;
            color: #06345c;
        }

        .person-role {
            color: #6b7280;
            font-size: 12px;
        }

        .day-cell {
            width: 65px;
            min-width: 65px;
            height: 55px;
            cursor: pointer;
            user-select: none;
            transition: .15s;
        }

        .day-cell:hover {
            background: #eaf3ff !important;
            transform: scale(1.03);
        }

        .present-cell {
            background: #e9f8ef !important;
            color: #14833b;
            font-size: 22px;
            font-weight: bold;
        }

        .absent-cell {
            background: #ffeaea !important;
            color: #c62828;
            font-size: 22px;
            font-weight: bold;
        }

        .sick-cell {
            background: #fff3e0 !important;
            color: #e65100;
            font-size: 22px;
            font-weight: bold;
        }

        .annual-cell {
            background: #e3f2fd !important;
            color: #1565c0;
            font-size: 22px;
            font-weight: bold;
        }

        .casual-cell {
            background: #f3e5f5 !important;
            color: #6a1b9a;
            font-size: 22px;
            font-weight: bold;
        }

        .mission-cell {
            background: #e0f7fa !important;
            color: #00695c;
            font-size: 22px;
            font-weight: bold;
        }

        .no-record-cell {
            background: #f5f6f8 !important;
            color: #9ca3af;
            font-size: 18px;
        }

        .future-cell {
            background: #eeeeee !important;
            color: #9ca3af;
            cursor: default;
            font-size: 17px;
        }

        .future-cell:hover {
            transform: none;
            background: #eeeeee !important;
        }

        .table-note {
            margin-top: 15px;
            padding: 12px;
            background: #f5f9ff;
            border-radius: 8px;
            color: #52606d;
            font-size: 13px;
            text-align: center;
            line-height: 1.9;
        }

        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* =========================================
           Status Picker Modal
        ========================================= */

        .status-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .status-modal-overlay.show { display: flex; }

        .status-modal-box {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .status-modal-box h3 {
            margin: 0 0 8px 0;
            color: #06345c;
            font-size: 19px;
        }

        .status-modal-box .subtitle {
            margin: 0 0 20px 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-option-btn {
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .status-option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }

        .status-option-btn .opt-icon {
            font-size: 28px;
            line-height: 1;
        }

        .status-option-btn.present { color: #16a34a; border-color: #bbf7d0; }
        .status-option-btn.present:hover { background: #f0fdf4; }

        .status-option-btn.absent { color: #dc2626; border-color: #fecaca; }
        .status-option-btn.absent:hover { background: #fef2f2; }

        .status-option-btn.sick { color: #ea580c; border-color: #fed7aa; }
        .status-option-btn.sick:hover { background: #fff7ed; }

        .status-option-btn.annual { color: #2563eb; border-color: #bfdbfe; }
        .status-option-btn.annual:hover { background: #eff6ff; }

        .status-option-btn.casual { color: #7c3aed; border-color: #ddd6fe; }
        .status-option-btn.casual:hover { background: #f5f3ff; }

        .status-option-btn.mission { color: #0d9488; border-color: #99f6e4; }
        .status-option-btn.mission:hover { background: #f0fdfa; }

        .status-modal-close {
            width: 100%;
            border: none;
            background: #f1f5f9;
            color: #475569;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
        }

        .status-modal-close:hover { background: #e2e8f0; }

        @media (max-width: 700px) {
            .attendance-page { padding: 12px; }
            .attendance-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions { flex-direction: column; }
            .back-btn, .checkin-btn, .leave-btn { width: 100%; }
            .month-info { flex-direction: column; align-items: stretch; }
            .filters { align-items: stretch; }
            .filter-item { width: 100%; }
            .filter-item select { width: 100%; }
            .show-btn { width: 100%; }
            .status-options { grid-template-columns: 1fr 1fr; }
        }

    </style>

</head>


<body>

<div class="attendance-page">

    <header class="attendance-header">

        <div class="attendance-title">
            <h1>📋 كشف الحضور</h1>
            <p id="headerSubtitle">متابعة حضور العاملين - Under Frame</p>
        </div>

        <div class="header-actions">

            <button
                id="checkinBtn"
                class="checkin-btn"
                onclick="registerTodayAttendance()"
                style="display:none;">
                ✅ سجّل حضورك اليوم
            </button>

            <button
                id="leaveBtn"
                class="leave-btn"
                onclick="window.location.href='leaves.html'"
                style="display:none;">
                🏖️ طلب إجازة
            </button>

            <button class="back-btn" onclick="goBack()">
                ← العودة للوحة التحكم
            </button>

        </div>

    </header>


    <section class="filters" id="filtersSection">

        <div class="filter-item">
            <label>السنة</label>
            <select id="yearSelect"></select>
        </div>

        <div class="filter-item">
            <label>الشهر</label>
            <select id="monthSelect">
                <option value="1">يناير</option>
                <option value="2">فبراير</option>
                <option value="3">مارس</option>
                <option value="4">أبريل</option>
                <option value="5">مايو</option>
                <option value="6">يونيو</option>
                <option value="7">يوليو</option>
                <option value="8">أغسطس</option>
                <option value="9">سبتمبر</option>
                <option value="10">أكتوبر</option>
                <option value="11">نوفمبر</option>
                <option value="12">ديسمبر</option>
            </select>
        </div>

        <button class="show-btn" onclick="loadAttendance()">
            🔎 عرض الشهر
        </button>

    </section>


    <section class="month-info">
        <strong id="monthTitle">كشف الحضور</strong>
        <span id="todayInfo">--</span>
    </section>


    <section class="attendance-container">

        <div class="table-header">
            <h2>📅 جدول الحضور</h2>
            <button class="refresh-btn" onclick="loadAttendance()">
                🔄 تحديث
            </button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead id="attendanceHead"></thead>
                <tbody id="attendanceBody">
                    <tr>
                        <td class="loading">جاري تحميل البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-note">
            🟢 حاضر &nbsp;|&nbsp; ❌ غائب &nbsp;|&nbsp; 🤒 مرضي &nbsp;|&nbsp; 🌴 سنوي &nbsp;|&nbsp; ⚡ عرضة &nbsp;|&nbsp; 📋 مأمورية
            <br>
            <span id="noteText">اضغط على اليوم لتغيير الحالة</span>
        </div>

    </section>

</div>


<!-- Status Picker Modal -->
<div id="statusModal" class="status-modal-overlay">
    <div class="status-modal-box">

        <h3 id="statusModalTitle">تحديد الحالة</h3>
        <p class="subtitle" id="statusModalSubtitle"></p>

        <div class="status-options">

            <button class="status-option-btn present" onclick="setStatus('present')">
                <span class="opt-icon">✅</span>
                حاضر
            </button>

            <button class="status-option-btn absent" onclick="setStatus('absent')">
                <span class="opt-icon">❌</span>
                غائب
            </button>

            <button class="status-option-btn sick" onclick="setStatus('sick')">
                <span class="opt-icon">🤒</span>
                مرضي
            </button>

            <button class="status-option-btn annual" onclick="setStatus('annual')">
                <span class="opt-icon">🌴</span>
                سنوي
            </button>

            <button class="status-option-btn casual" onclick="setStatus('casual')">
                <span class="opt-icon">⚡</span>
                عرضة
            </button>

            <button class="status-option-btn mission" onclick="setStatus('mission')">
                <span class="opt-icon">📋</span>
                مأمورية
            </button>

        </div>

        <button class="status-modal-close" onclick="closeStatusModal()">
            ✖ إلغاء
        </button>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>


<script>

let attendanceData = [];
let leavesData = [];
let selectedYear;
let selectedMonth;
let currentUser = null;
let isAdmin = false;

/* بيانات المودال الحالي */
let modalData = {
    username: "",
    fullName: "",
    role: "",
    date: "",
    recordId: null
};


/* =========================================
   دالة التاريخ المحلي
========================================= */

function getLocalDateString(date) {
    const d = date || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
}


function getLocalTimeString(date) {
    const d = date || new Date();
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    const s = String(d.getSeconds()).padStart(2, "0");
    return h + ":" + min + ":" + s;
}


/* =========================================
   USER
========================================= */

function loadUser() {
    try {
        if (typeof getCurrentUser === "function") {
            return getCurrentUser();
        }
        return JSON.parse(sessionStorage.getItem("currentUser"));
    } catch (error) {
        return null;
    }
}


function goBack() {
    window.location.href = "index.html";
}


function getRoleName(role) {
    const roles = {
        admin: "المدير",
        wiring: "Wiring",
        lt: "LT",
        ht: "HT",
        installation: "التركيبات",
        final: "الفنش النهائي"
    };
    return roles[String(role || "").toLowerCase()] || role || "-";
}


function setupYears() {
    const select = document.getElementById("yearSelect");
    if (!select) return;

    const currentYear = new Date().getFullYear();
    select.innerHTML = "";

    for (let year = currentYear - 2; year <= currentYear + 1; year++) {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        select.appendChild(option);
    }

    select.value = currentYear;
    document.getElementById("monthSelect").value = new Date().getMonth() + 1;
}


function getDaysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
}


function makeDate(year, month, day) {
    return year + "-" +
        String(month).padStart(2, "0") + "-" +
        String(day).padStart(2, "0");
}


/* =========================================
   STATUS MAP
========================================= */

const STATUS_MAP = {
    present: { icon: "✅", className: "present-cell", label: "حاضر" },
    absent:  { icon: "❌", className: "absent-cell", label: "غائب" },
    sick:    { icon: "🤒", className: "sick-cell", label: "مرضي" },
    annual:  { icon: "🌴", className: "annual-cell", label: "سنوي" },
    casual:  { icon: "⚡", className: "casual-cell", label: "عرضة" },
    mission: { icon: "📋", className: "mission-cell", label: "مأمورية" }
};


function getStatusInfo(status) {
    return STATUS_MAP[status] || { icon: "—", className: "no-record-cell", label: "—" };
}


/* =========================================
   LOAD ATTENDANCE
========================================= */

async function loadAttendance() {

    if (!currentUser) return;

    const year = Number(document.getElementById("yearSelect").value);
    const month = Number(document.getElementById("monthSelect").value);

    selectedYear = year;
    selectedMonth = month;

    document.getElementById("monthTitle").textContent =
        "كشف حضور " +
        new Date(year, month - 1, 1).toLocaleDateString("ar-EG", {
            month: "long",
            year: "numeric"
        });

    document.getElementById("todayInfo").textContent =
        isAdmin ? "اضغط على أي يوم لتغيير حالة الحضور" :
        "يمكنك مشاهدة حضورك المسجل";

    const head = document.getElementById("attendanceHead");
    const body = document.getElementById("attendanceBody");

    body.innerHTML = '<tr><td class="loading">جاري تحميل البيانات...</td></tr>';

    try {

        if (!window.supabaseClient) {
            throw new Error("supabaseClient غير موجود");
        }

        const firstDay = makeDate(year, month, 1);
        const lastDay = makeDate(year, month, getDaysInMonth(year, month));

        /* جلب بيانات الحضور */
        let query = window.supabaseClient
            .from("attendance")
            .select("id, username, full_name, role, attendance_date, attendance_time, status, created_at")
            .gte("attendance_date", firstDay)
            .lte("attendance_date", lastDay);

        if (!isAdmin) {
            query = query.eq("username", currentUser.username);
        }

        const result = await query.order("full_name", { ascending: true });

        if (result.error) throw result.error;

        attendanceData = result.data || [];

        /* جلب الأجازات المعتمدة للشهر */
        try {

            let leavesQuery = window.supabaseClient
                .from("leaves")
                .select("*")
                .eq("status", "approved")
                .gte("leave_date", firstDay)
                .lte("leave_date", lastDay);

            if (!isAdmin) {
                leavesQuery = leavesQuery.eq("username", currentUser.username);
            }

            const leavesResult = await leavesQuery;

            if (!leavesResult.error) {
                leavesData = leavesResult.data || [];
            }

        } catch (e) {
            console.warn("Leaves load error:", e);
        }

        renderTable(attendanceData, year, month);

    }

    catch (error) {

        console.error("Attendance load error:", error);

        head.innerHTML = "";

        body.innerHTML = `
            <tr>
                <td class="empty">
                    ❌ حصل خطأ أثناء تحميل بيانات الحضور
                    <br><br>
                    ${escapeHTML(error.message || "خطأ غير معروف")}
                </td>
            </tr>
        `;
    }

}


/* =========================================
   GET PEOPLE
========================================= */

function getPeople(data) {

    const people = {};

    data.forEach(function(row) {

        const username = row.username || row.full_name;
        if (!username) return;

        if (!people[username]) {
            people[username] = {
                username: row.username || "-",
                full_name: row.full_name || row.username || "-",
                role: row.role || "-"
            };
        }
    });

    /* إضافة أصحاب الأجازات حتى لو مش مسجلين حضور */
    leavesData.forEach(function(leave) {
        const username = leave.username;
        if (!username) return;

        if (!people[username]) {
            people[username] = {
                username: username,
                full_name: leave.employee_name || username,
                role: "-"
            };
        }
    });

    if (!isAdmin && currentUser) {
        const key = currentUser.username || currentUser.name;
        if (!people[key]) {
            people[key] = {
                username: currentUser.username,
                full_name: currentUser.name || currentUser.username,
                role: currentUser.role
            };
        }
    }

    return Object.values(people);
}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(data, year, month) {

    const head = document.getElementById("attendanceHead");
    const body = document.getElementById("attendanceBody");
    const days = getDaysInMonth(year, month);
    const people = getPeople(data);

    let headHTML = `
        <tr>
            <th>#</th>
            <th>اسم الفني</th>
    `;

    if (isAdmin) {
        headHTML += `<th>Username</th><th>القسم</th>`;
    }

    for (let day = 1; day <= days; day++) {
        headHTML += `<th>${day}</th>`;
    }

    headHTML += `<th>نسبة الحضور</th></tr>`;

    head.innerHTML = headHTML;

    if (people.length === 0) {
        body.innerHTML = `
            <tr>
                <td colspan="${days + 5}" class="empty">
                    📋 لا توجد أسماء مسجلة في هذا الشهر
                </td>
            </tr>
        `;
        return;
    }

    /* خريطة الحضور */
    const attendanceMap = {};
    data.forEach(function(row) {
        const username = row.username || row.full_name;
        const date = String(row.attendance_date || "").substring(0, 10);
        if (!username || !date) return;
        if (!attendanceMap[username]) attendanceMap[username] = {};
        attendanceMap[username][date] = row;
    });

    /* خريطة الأجازات (ممنوعة تتعارض مع الحضور المسجل) */
    const leavesMap = {};
    leavesData.forEach(function(leave) {
        const username = leave.username;
        if (!username) return;

        const startDate = new Date(leave.leave_date + "T00:00:00");
        const daysCount = Number(leave.leave_days) || 1;

        for (let i = 0; i < daysCount; i++) {
            const d = new Date(startDate);
            d.setDate(d.getDate() + i);
            const dateStr = getLocalDateString(d);

            const key = username + "_" + dateStr;

            /* أول أجازة بس */
            if (!leavesMap[key]) {
                leavesMap[key] = leave;
            }
        }
    });

    /* جسم الجدول */
    let bodyHTML = "";

    people.forEach(function(person, personIndex) {

        let presentDays = 0;

        let rowHTML = `
            <tr>
                <td>${personIndex + 1}</td>
                <td class="person-name">${escapeHTML(person.full_name)}</td>
        `;

        if (isAdmin) {
            rowHTML += `
                <td>${escapeHTML(person.username)}</td>
                <td class="person-role">${escapeHTML(getRoleName(person.role))}</td>
            `;
        }

        for (let day = 1; day <= days; day++) {

            const date = makeDate(year, month, day);

            const record = attendanceMap[person.username] && attendanceMap[person.username][date];
            const leaveRecord = leavesMap[person.username + "_" + date];

            const today = new Date();
            const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const cellDate = new Date(year, month - 1, day);

            /* يوم مستقبلي */
            if (cellDate > todayOnly) {
                rowHTML += `<td class="day-cell future-cell">—</td>`;
                continue;
            }

            /* ✅ فيه أجازة معتمدة - تظهر تلقائيًا */
            if (leaveRecord) {

                const type = String(leaveRecord.leave_type || "").trim();

                let leaveStatus = "sick";
                let leaveIcon = "🤒";

                if (type.includes("مرضي")) {
                    leaveStatus = "sick";
                    leaveIcon = "🤒";
                } else if (type.includes("سنوي")) {
                    leaveStatus = "annual";
                    leaveIcon = "🌴";
                } else if (type.includes("عرضة") || type.includes("عارضة")) {
                    leaveStatus = "casual";
                    leaveIcon = "⚡";
                }

                const info = getStatusInfo(leaveStatus);

                rowHTML += `
                    <td class="day-cell ${info.className}"
                        title="إجازة ${escapeHTML(type)} - معتمدة من المدير">
                        ${leaveIcon}
                    </td>
                `;
                continue;
            }

            /* فيه تسجيل حضور */
            if (record) {

                const status = String(record.status || "").trim().toLowerCase();

                /* حاضر */
                if (status === "present" || status === "حاضر" || status === "حضور") {
                    presentDays++;
                }

                const info = getStatusInfo(status);

                rowHTML += `
                    <td class="day-cell ${info.className}"
                        title="${info.label}"
                        ${isAdmin ? `onclick="openStatusModal('${escapeJS(person.username)}','${escapeJS(person.full_name)}','${escapeJS(person.role)}','${date}',${record.id})"` : ""}>
                        ${info.icon}
                    </td>
                `;

            }

            /* لا يوجد تسجيل */
            else {

                rowHTML += `
                    <td class="day-cell no-record-cell"
                        title="لا يوجد تسجيل"
                        ${isAdmin ? `onclick="openStatusModal('${escapeJS(person.username)}','${escapeJS(person.full_name)}','${escapeJS(person.role)}','${date}',null)"` : ""}>
                        —
                    </td>
                `;
            }

        }

        const percentage = days > 0 ? Math.round((presentDays / days) * 100) : 0;

        rowHTML += `<td><strong>${percentage}%</strong></td></tr>`;

        bodyHTML += rowHTML;
    });

    body.innerHTML = bodyHTML;
}


/* =========================================
   STATUS MODAL
========================================= */

function openStatusModal(username, fullName, role, date, recordId) {

    if (!isAdmin) return;

    modalData = {
        username: username,
        fullName: fullName,
        role: role,
        date: date,
        recordId: recordId
    };

    document.getElementById("statusModalTitle").innerText =
        "تحديد حالة " + fullName;

    document.getElementById("statusModalSubtitle").innerText =
        "📅 " + formatArabicDate(date);

    document.getElementById("statusModal").classList.add("show");
}


function closeStatusModal() {
    document.getElementById("statusModal").classList.remove("show");
}


async function setStatus(status) {

    if (!isAdmin) return;

    const { username, fullName, role, date, recordId } = modalData;

    closeStatusModal();

    try {

        if (recordId) {
            /* تحديث */
            const result = await window.supabaseClient
                .from("attendance")
                .update({
                    status: status,
                    attendance_time: getLocalTimeString()
                })
                .eq("id", recordId);

            if (result.error) throw result.error;

            const index = attendanceData.findIndex(r => Number(r.id) === Number(recordId));
            if (index !== -1) {
                attendanceData[index].status = status;
                attendanceData[index].attendance_time = getLocalTimeString();
            }

        } else {
            /* إضافة */
            const result = await window.supabaseClient
                .from("attendance")
                .insert({
                    username: username,
                    full_name: fullName,
                    role: role,
                    attendance_date: date,
                    attendance_time: getLocalTimeString(),
                    status: status
                })
                .select()
                .single();

            if (result.error) throw result.error;

            attendanceData.push(result.data);
        }

        renderTable(attendanceData, selectedYear, selectedMonth);

        const info = getStatusInfo(status);
        alert("✅ تم تسجيل " + info.label + " لـ " + fullName + " - " + formatArabicDate(date));

    } catch (error) {
        console.error("Set status error:", error);
        alert("❌ فشل التحديث:\n" + error.message);
    }
}


/* =========================================
   REGISTER TODAY (للفني)
========================================= */

async function registerTodayAttendance() {

    if (!currentUser || isAdmin) return;

    const btn = document.getElementById("checkinBtn");

    btn.disabled = true;
    btn.innerText = "⏳ جاري التسجيل...";

    try {

        const now = new Date();
        const todayDate = getLocalDateString(now);
        const time = getLocalTimeString(now);

        const checkResult = await window.supabaseClient
            .from("attendance")
            .select("id")
            .eq("username", currentUser.username)
            .eq("attendance_date", todayDate)
            .maybeSingle();

        if (checkResult.error) throw checkResult.error;

        if (checkResult.data) {
            alert("⚠️ تم تسجيل حضورك اليوم بالفعل");
            btn.disabled = true;
            btn.innerText = "✅ تم تسجيل حضورك اليوم";
            return;
        }

        const insertResult = await window.supabaseClient
            .from("attendance")
            .insert({
                username: currentUser.username,
                full_name: currentUser.name || currentUser.username,
                role: currentUser.role,
                attendance_date: todayDate,
                attendance_time: time,
                status: "present"
            });

        if (insertResult.error) throw insertResult.error;

        alert("✅ تم تسجيل حضورك بنجاح");

        btn.innerText = "✅ تم تسجيل حضورك اليوم";

        await loadAttendance();

    }

    catch (error) {
        console.error("Check-in error:", error);
        alert("❌ فشل تسجيل الحضور:\n" + error.message);
        btn.disabled = false;
        btn.innerText = "✅ سجّل حضورك اليوم";
    }
}


async function updateCheckinButtonState() {

    if (isAdmin) return;

    const btn = document.getElementById("checkinBtn");
    if (!btn) return;

    try {

        const todayDate = getLocalDateString();

        const result = await window.supabaseClient
            .from("attendance")
            .select("id")
            .eq("username", currentUser.username)
            .eq("attendance_date", todayDate)
            .maybeSingle();

        if (result.data) {
            btn.disabled = true;
            btn.innerText = "✅ تم تسجيل حضورك اليوم";
        } else {
            btn.disabled = false;
            btn.innerText = "✅ سجّل حضورك اليوم";
        }

    } catch (e) {
        console.warn("Check-in state error:", e);
    }
}


/* =========================================
   HELPERS
========================================= */

function formatArabicDate(value) {
    if (!value) return "-";

    try {
        const d = new Date(value + "T00:00:00");
        if (isNaN(d.getTime())) return value;

        return d.toLocaleDateString("ar-EG", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    } catch (e) {
        return value;
    }
}


function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeJS(value) {
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
}

   START
========================================= */

document.addEventListener("DOMContentLoaded", function() {

    currentUser = loadUser();

    if (!currentUser) {
        window.location.href = "login.html";
        return;
    }

    isAdmin = currentUser.role === "admin";

    setupYears();

    if (!isAdmin) {

        document.getElementById("filtersSection").style.display = "none";

        document.getElementById("headerSubtitle").innerText =
            "حضورك الخاص - " + (currentUser.name || currentUser.username);

        document.getElementById("checkinBtn").style.display = "inline-block";
        document.getElementById("leaveBtn").style.display = "inline-block";

        document.getElementById("noteText").innerText =
            "الجدول يوضح حضورك أنت فقط";

        const now = new Date();
        document.getElementById("yearSelect").value = now.getFullYear();
        document.getElementById("monthSelect").value = now.getMonth() + 1;
    }

    setTimeout(loadAttendance, 500);

    if (!isAdmin) {
        setTimeout(updateCheckinButtonState, 1000);
    }

    /* إغلاق المودال لما تدوس على الخلفية */
    document.getElementById("statusModal").addEventListener("click", function(e) {
        if (e.target === this) closeStatusModal();
    });

    /* تحديث تلقائي كل 30 ثانية */
    setInterval(function() {
        if (selectedYear && selectedMonth) loadAttendance();
    }, 30000);

});

</script>
