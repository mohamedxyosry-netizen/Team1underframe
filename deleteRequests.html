<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلبات الحذف</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, Tahoma, sans-serif;
            color: #1f2937;
        }

        .delete-page {
            min-height: 100vh;
        }

        /* =========================
           Header
        ========================= */

        .header {
            background: rgb(52, 67, 84);
            color: white;
            padding: 20px 30px;
            border-bottom: 3px solid #dc3545;
        }

        .header h1 {
            margin: 0 0 6px 0;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
            font-size: 15px;
        }

        /* =========================
           Navigation
        ========================= */

        .top-actions {
            width: min(1100px, 94%);
            margin: 20px auto 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .home-btn {
            background: #198754;
            color: white;
        }

        .home-btn:hover {
            background: #157347;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }

        .logout-btn:hover {
            background: #bb2d3b;
        }

        /* =========================
           Main
        ========================= */

        .main-container {
            width: min(1100px, 94%);
            margin: 25px auto 40px;
        }

        .user-card {
            background: white;
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
            border-right: 5px solid #dc3545;
        }

        .user-card strong {
            color: #dc3545;
        }

        /* =========================
           Requests
        ========================= */

        .requests-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #dc3545;
        }

        .requests-title {
            margin: 0 0 20px 0;
            font-size: 23px;
            color: #dc3545;
        }

        .loading {
            text-align: center;
            padding: 35px 10px;
            color: #6b7280;
            font-size: 17px;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #6b7280;
            font-size: 17px;
        }

        /* =========================
           Request item
        ========================= */

        .request {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-right: 5px solid #dc3545;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .request:last-child {
            margin-bottom: 0;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .request-title {
            font-size: 20px;
            font-weight: bold;
            color: #374151;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-rejected {
            background: #f8d7da;
            color: #842029;
        }

        .request-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-item {
            background: white;
            border-radius: 9px;
            padding: 11px 13px;
            border: 1px solid #e5e7eb;
        }

        .info-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: bold;
            color: #374151;
            word-break: break-word;
        }

        .reason-box {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 13px;
            margin-top: 12px;
        }

        .reason-title {
            font-weight: bold;
            margin-bottom: 6px;
            color: #374151;
        }

        .reason-text {
            color: #4b5563;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .rejection-box {
            background: #fff0f1;
            border: 1px solid #f1aeb5;
            border-radius: 10px;
            padding: 13px;
            margin-top: 12px;
        }

        .rejection-title {
            font-weight: bold;
            color: #842029;
            margin-bottom: 6px;
        }

        .rejection-text {
            color: #842029;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* =========================
           Buttons
        ========================= */

        .request-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .approve-btn,
        .reject-btn {
            border: none;
            border-radius: 9px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .approve-btn {
            background: #198754;
            color: white;
        }

        .approve-btn:hover {
            background: #157347;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
        }

        .reject-btn:hover {
            background: #bb2d3b;
        }

        .approve-btn:disabled,
        .reject-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           Badge
        ========================= */

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 20px;
            background: #dc3545;
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 750px) {

            .header {
                padding: 18px 16px;
            }

            .header h1 {
                font-size: 23px;
            }

            .top-actions {
                width: 94%;
            }

            .top-btn {
                flex: 1;
                min-width: 130px;
            }

            .main-container {
                width: 94%;
            }

            .requests-card {
                padding: 18px;
            }

            .request {
                padding: 15px;
            }

            .request-info {
                grid-template-columns: 1fr;
            }

            .request-actions {
                flex-direction: column;
            }

            .approve-btn,
            .reject-btn {
                width: 100%;
            }
        }
    </style>
</head>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gzyybadyaunizdlvmcle.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUserDirect() {

    try {

        const raw =
            sessionStorage.getItem("currentUser");

        if (!raw) {
            return null;
        }

        return JSON.parse(raw);

    } catch (error) {

        console.error(
            "Error reading currentUser:",
            error
        );

        return null;
    }
}


/* =========================================================
   CHECK ADMIN
========================================================= */

function checkAdmin() {

    const user =
        getCurrentUserDirect();

    if (!user) {

        window.location.href =
            "login.html";

        return null;
    }

    if (user.role !== "admin") {

        document.body.innerHTML = `
            <div style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#f1f5f9;
                font-family:Arial,Tahoma,sans-serif;
                padding:20px;
                text-align:center;
            ">

                <div style="
                    background:white;
                    padding:35px;
                    border-radius:18px;
                    box-shadow:0 5px 20px rgba(0,0,0,.1);
                    max-width:450px;

                ">

                    <div style="

                    ">
                        🚫
                    </div>

                    <h2 style="
                        color:#dc3545;
                        margin-bottom:10px;
                    ">
                        غير مسموح
                    </h2>

                    <p style="

                    </p>

                    <button

                            border:none;
                            background:#198754;
                            color:white;
                            padding:12px 22px;
                            border-radius:9px;
                            font-weight:bold;
                            cursor:pointer;
                        ">
                        🏠 العودة للرئيسية
                    </button>

                </div>

            </div>
        `;

        return null;
    }

    return user;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatArabicDate(value) {

    if (!value) {
        return "غير محدد";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return escapeHTML(value);
    }

    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }
    ).format(date);
}


/* =========================================================
   SECTION NAME
========================================================= */

function getSectionName(section) {

    const sections = {

        wiring: "Wiring",
        lt: "LT",
        ht: "HT",
        installation: "Installation",
        final: "Final"

    };

    return sections[section] ||
           section ||
           "غير محدد";
}


/* =========================================================
   STATUS
========================================================= */

function getStatusHTML(status) {

    if (status === "approved") {

        return `
            <span class="status status-approved">
                ✅ تمت الموافقة
            </span>
        `;
    }

    if (status === "rejected") {

        return `
            <span class="status status-rejected">
                ❌ مرفوض
            </span>
        `;
    }

    return `
        <span class="status status-pending">
            ⏳ في الانتظار
        </span>
    `;
}


/* =========================================================
   LOAD REQUESTS
========================================================= */

async function loadDeleteRequests() {

    const container =
        document.getElementById(
            "deleteRequests"
        );

    const countElement =
        document.getElementById(
            "deleteRequestsCount"
        );

    container.innerHTML = `
        <div class="loading">
            ⏳ جاري تحميل الطلبات...
        </div>
    `;

    try {

        const {
            data,
            error
        } = await db
            .from("delete_requests")
            .select("*")
            .order(
                "request_date",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML = `
                <div class="empty">

                    ❌ حدث خطأ أثناء تحميل الطلبات.

                    <br><br>

                    <small style="
                        color:#dc3545;
                        word-break:break-word;
                    ">
                        ${escapeHTML(error.message)}
                    </small>

                </div>
            `;

            return;
        }


        const requests =
            Array.isArray(data)
                ? data
                : [];


        const pendingCount =
            requests.filter(function(request) {

                return request.status ===
                    "pending";

            }).length;


        countElement.textContent =
            pendingCount;


        if (requests.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    ✅ لا توجد طلبات حذف حالياً.
                </div>
            `;

            return;
        }


        container.innerHTML =
            requests
                .map(function(request) {

                    return renderRequest(
                        request
                    );

                })
                .join("");


    } catch (error) {

        console.error(
            "Load requests error:",
            error
        );

        container.innerHTML = `
            <div class="empty">
                ❌ حدث خطأ غير متوقع أثناء تحميل الطلبات.
            </div>
        `;
    }
}


/* =========================================================
   RENDER REQUEST
========================================================= */

function renderRequest(request) {

    const status =
        request.status ||
        "pending";


    const requestedBy =
        request.requested_by ||
        request.requested_by_username ||
        "غير محدد";


    const username =
        request.requested_by_username ||
        "غير محدد";


    const section =
        getSectionName(
            request.section
        );


    const carName =
        request.car_name ||
        "غير محدد";


    const carNumber =
        request.car_number ||
        "غير محدد";


    const reason =
        request.reason ||
        "لم يتم ذكر سبب";


    let actions = "";


    if (status === "pending") {

        actions = `

            <div class="request-actions">

                <button
                    type="button"
                    class="approve-btn"
                    onclick="approveDeleteRequest('${escapeHTML(request.id)}')">

                    ✅ أوافق على الحذف

                </button>


                <button
                    type="button"
                    class="reject-btn"
                    onclick="rejectDeleteRequest('${escapeHTML(request.id)}')">

                    ❌ أرفض الطلب

                </button>

            </div>
        `;
    }


    let rejectionHTML = "";


    if (
        status === "rejected" &&
        request.rejection_reason
    ) {

        rejectionHTML = `

            <div class="rejection-box">

                <div class="rejection-title">
                    سبب الرفض:
                </div>

                <div class="rejection-text">
                    ${escapeHTML(
                        request.rejection_reason
                    )}
                </div>

            </div>
        `;
    }


    let reviewHTML = "";


    if (request.reviewed_by) {

        reviewHTML = `

            <div class="info-item">

                <div class="info-label">
                    تمت المراجعة بواسطة
                </div>

                <div class="info-value">
                    ${escapeHTML(
                        request.reviewed_by
                    )}
                </div>

            </div>

            <div class="info-item">

                <div class="info-label">
                    تاريخ المراجعة
                </div>

                <div class="info-value">
                    ${formatArabicDate(
                        request.review_date
                    )}
                </div>

            </div>
        `;
    }


    return `

        <div class="request">

            <div class="request-header">

                <div class="request-title">
                    🗑️ طلب حذف رقم #${escapeHTML(request.id)}
                </div>

                ${getStatusHTML(status)}

            </div>


            <div class="request-info">

                <div class="info-item">

                    <div class="info-label">
                        اسم العربة
                    </div>

                    <div class="info-value">
                        ${escapeHTML(carName)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        رقم العربة
                    </div>

                    <div class="info-value">
                        ${escapeHTML(carNumber)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        القسم
                    </div>

                    <div class="info-value">
                        ${escapeHTML(section)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        مقدم الطلب
                    </div>

                    <div class="info-value">
                        ${escapeHTML(requestedBy)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        اسم المستخدم
                    </div>

                    <div class="info-value">
                        ${escapeHTML(username)}
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-label">
                        تاريخ الطلب
                    </div>

                    <div class="info-value">
                        ${formatArabicDate(
                            request.request_date
                        )}
                    </div>

                </div>

                ${reviewHTML}

            </div>


            <div class="reason-box">

                <div class="reason-title">
                    📝 سبب طلب الحذف
                </div>

                <div class="reason-text">
                    ${escapeHTML(reason)}
                </div>

            </div>


            ${rejectionHTML}


            ${actions}

        </div>
    `;
}


/* =========================================================
   APPROVE DELETE REQUEST
========================================================= */

async function approveDeleteRequest(requestId) {

    if (!requestId) {
        return;
    }


    const confirmed =
        confirm(
            "هل أنت متأكد من الموافقة على حذف هذه البيانات؟\n\nسيتم حذف السجل فعلياً من قاعدة البيانات."
        );


    if (!confirmed) {
        return;
    }


    const user =
        getCurrentUserDirect();


    if (!user ||
        user.role !== "admin") {

        alert(
            "ليس لديك صلاحية تنفيذ هذا الإجراء."
        );

        return;
    }


    try {

        /* -----------------------------------------
           Get request
        ----------------------------------------- */

        const {
            data: request,
            error: requestError
        } = await db
            .from("delete_requests")
            .select("*")
            .eq("id", requestId)
            .single();


        if (requestError) {

            console.error(
                requestError
            );

            alert(
                "حدث خطأ أثناء قراءة طلب الحذف."
            );

            return;
        }


        if (!request) {

            alert(
                "طلب الحذف غير موجود."
            );

            return;
        }


        if (request.status !== "pending") {

            alert(
                "هذا الطلب تمت مراجعته بالفعل."
            );

            await loadDeleteRequests();

            return;
        }


        /* -----------------------------------------
           Delete actual record
        ----------------------------------------- */

        const {
            error: deleteError
        } = await db
            .from("records")
            .delete()
            .eq(
                "id",
                request.record_id
            );


        if (deleteError) {

            console.error(
                "Delete record error:",
                deleteError
            );

            alert(
                "فشل حذف البيانات الأصلية.\n\n" +
                deleteError.message
            );

            return;
        }


        /* -----------------------------------------
           Update request
        ----------------------------------------- */

        const {
            error: updateError
        } = await db
            .from("delete_requests")
            .update({

                status: "approved",

                reviewed_by:
                    user.name ||
                    user.username ||
                    "Admin",

                review_date:
                    new Date().toISOString(),

                result:
                    "تم حذف السجل بنجاح"

            })
            .eq(
                "id",
                requestId
            );


        if (updateError) {

            console.error(
                "Update request error:",
                updateError
            );

            alert(
                "تم حذف البيانات، لكن حدث خطأ أثناء تحديث حالة الطلب.\n\n" +
                updateError.message
            );

            await loadDeleteRequests();

            return;
        }


        alert(
            "✅ تمت الموافقة على الطلب وحذف البيانات بنجاح."
        );


        await loadDeleteRequests();


    } catch (error) {

        console.error(
            "Approve error:",
            error
        );

        alert(
            "حدث خطأ غير متوقع أثناء الموافقة على الطلب."
        );
    }
}


/* =========================================================
   REJECT DELETE REQUEST
========================================================= */

    if (!requestId) {
        return;
    }


    const user =
        getCurrentUserDirect();


    if (!user ||
        user.role !== "admin") {

        alert(
            "ليس لديك صلاحية تنفيذ هذا الإجراء."
        );

        return;
    }


    const rejectionReason =
        prompt(
            "اكتب سبب رفض طلب الحذف:"
        );


    if (
        rejectionReason === null
    ) {

        return;
    }


    const reason =
        rejectionReason.trim();


    if (!reason) {

        alert(
            "يجب كتابة سبب رفض الطلب."
        );

        return;
    }


    try {

        const {
            data: request,
            error: requestError
        } = await db
            .from("delete_requests")
            .select("*")
            .eq("id", requestId)
            .single();


        if (requestError) {

            console.error(
                requestError
            );

            alert(
                "حدث خطأ أثناء قراءة الطلب."
            );

            return;
        }


        if (!request) {

            alert(
                "طلب الحذف غير موجود."
            );

            return;
        }


        if (request.status !== "pending") {

            alert(
                "هذا الطلب تمت مراجعته بالفعل."
            );

            await loadDeleteRequests();

            return;
        }


        const {
            error: updateError
        } = await db
            .from("delete_requests")
            .update({

                status: "rejected",

                reviewed_by:
                    user.name ||
                    user.username ||
                    "Admin",

                review_date:
                    new Date().toISOString(),

                rejection_reason:
                    reason,

                result:
                    "تم رفض طلب الحذف"

            })
            .eq(
                "id",
                requestId
            );


        if (updateError) {

            console.error(
                "Reject error:",
                updateError
            );

            alert(
                "فشل رفض الطلب.\n\n" +
                updateError.message
            );

            return;
        }


        alert(
            "❌ تم رفض طلب الحذف."
        );


        await loadDeleteRequests();


    } catch (error) {

        console.error(
            "Reject error:",
            error
        );

        alert(
            "حدث خطأ غير متوقع أثناء رفض الطلب."
        );
    }
}


/* =========================================================
   HOME
   مستقل تماماً عن script.js
========================================================= */

function goHomeDirect() {

    window.location.href =
        "index.html";
}


/* =========================================================
   LOGOUT
========================================================= */

function logoutDirect() {

    const confirmed =
        confirm(
            "هل تريد تسجيل الخروج؟"
        );

    if (!confirmed) {
        return;
    }


    sessionStorage.removeItem(
        "currentUser"
    );


    window.location.href =
        "login.html";
}


/* =========================================================
   UPDATE USER INFO
========================================================= */

function displayCurrentUser() {

    const user =
        getCurrentUserDirect();

    if (!user) {
        return;
    }


    const nameElement =
        document.getElementById(
            "currentUserName"
        );


    const roleElement =
        document.getElementById(
            "currentUserRole"
        );


    nameElement.textContent =
        user.name ||
        user.username ||
        "Admin";


    roleElement.textContent =
        " — المدير";
}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const user =
            checkAdmin();


        if (!user) {
            return;
        }


        displayCurrentUser();


        await loadDeleteRequests();


        /*
         * تحديث الطلبات كل 15 ثانية
         * حتى تظهر الطلبات الجديدة للمدير
         * بدون الحاجة لإعادة تحميل الصفحة.
         */

        setInterval(
            async function() {

                await loadDeleteRequests();

            },
            15000
        );

    }
);

</script>
