<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NERIC - Installation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .dashboard {
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: rgb(52, 67, 84);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-bottom: 3px solid #5928e0;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 28px;
            color: #ffffff;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .logout-btn {
            border: none;
            background: #198754;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }


        /* =========================
           PAGE
        ========================= */

        .form-page {
            width: min(1100px, 94%);
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }


        /* =========================
           CARDS
        ========================= */

        .form-card,
        .records-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .form-card {
            border-top: 5px solid #198754;
        }

        .records-card {
            border-top: 5px solid #0d6efd;
        }

        .form-card h2,
        .records-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 21px;
        }

        .form-card h2 {
            color: #198754;
        }

        .records-card h2 {
            color: #0d6efd;
        }


        /* =========================
           INPUTS
        ========================= */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: #198754;
            background: white;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .input-group textarea {
            min-height: 110px;
            resize: vertical;
        }


        /* =========================
           CAR NUMBER - نفس HT/LT
        ========================= */

        .car-number-preview {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            direction: ltr;
        }

        .number-part {
            background: #f8fafc;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            min-height: 78px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .number-part span {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
            direction: rtl;
        }

        .number-part strong {
            font-size: 22px;
            color: #344354;
            direction: ltr;
        }

        .car-name-part {
            background: #f0fdf4;
            border: 2px solid #198754;
        }

        .car-name-part strong {
            color: #198754;
            font-size: 23px;
        }


        /* =========================
           STATUS
        ========================= */

        .status-box {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .completed {
            background: #dcfce7;
            color: #166534;
        }

        .not-completed {
            background: #fee2e2;
            color: #991b1b;
        }


        /* =========================
           REASON
        ========================= */

        .reason-box {
            display: none;
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        .save-btn {
            width: 100%;
            border: none;
            background: #198754;
            color: white;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #157347;
        }

        .save-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        #installationMessage {
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
            line-height: 1.7;
            white-space: pre-line;
        }


        /* =========================
           RECORDS
        ========================= */

        #installationRecords {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .record {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: 5px solid #0d6efd;
            border-radius: 12px;
            padding: 18px;
        }

        .record h3 {
            margin-top: 0;
            font-size: 16px;
            color: #0d6efd;
        }

        .record p {
            margin: 9px 0;
            line-height: 1.7;
        }

        .record strong {
            color: #374151;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .error-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #b42318;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            line-height: 1.7;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .header {
                padding: 18px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .logout-btn {
                width: 100%;
            }

            .form-page {
                grid-template-columns: 1fr;
                width: 94%;
                margin: 20px auto;
            }

            .form-card,
            .records-card {
                padding: 20px;
            }

            .number-part strong {
                font-size: 18px;
            }

            .car-name-part strong {
                font-size: 19px;
            }

        }

    </style>

</head>

/* =========================================
   المستخدم الحالي
========================================= */

function getCurrentUsername() {

    try {

        const currentUser =
            JSON.parse(
                sessionStorage.getItem(
                    "currentUser"
                )
            );


        if (
            currentUser &&
            currentUser.name
        ) {

            return currentUser.name;

        }


        if (
            currentUser &&
            currentUser.username
        ) {

            return currentUser.username;

        }

    }
    catch (error) {

        console.log(
            "Could not read current user"
        );

    }


    return "Unknown";

}



/* =========================================
   حماية HTML
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================
   تحديث قائمة التركيبات
========================================= */

function updateInstallationDevices() {

    const carName =
        document.getElementById(
            "installationCarName"
        ).value;


    const deviceSelect =
        document.getElementById(
            "installationDevice"
        );


    deviceSelect.innerHTML = "";


    if (!carName) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "اختر اسم العربية أولاً";

        deviceSelect.appendChild(option);

        deviceSelect.disabled = true;

        return;

    }


    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        "اختر التركيبة";

    deviceSelect.appendChild(
        defaultOption
    );


    const devices =
        INSTALLATION_DEVICES[carName] || [];


    devices.forEach(
        function(device) {

            const option =
                document.createElement("option");

            option.value = device;

            option.textContent = device;

            deviceSelect.appendChild(option);

        }
    );


    deviceSelect.disabled =
        devices.length === 0;

}



/* =========================================
   توليد رقم العربية
========================================= */

function updateInstallationCarNumber() {

    const carName =
        document.getElementById(
            "installationCarName"
        ).value;


    const unitNumber =
        document.getElementById(
            "installationUnitNumber"
        ).value.trim();


    const carNumberInput =
        document.getElementById(
            "installationCarNumber"
        );


    const carDisplay =
        document.getElementById(
            "installationCarDisplay"
        );


    const nameDisplay =
        document.getElementById(
            "installationNameDisplay"
        );


    const unitDisplay =
        document.getElementById(
            "installationUnitDisplay"
        );


    /* اسم العربية */

    nameDisplay.textContent =
        carName || "—";


    /* رقم الوحدة */

    unitDisplay.textContent =
        unitNumber || "—";


    if (
        !carName ||
        !unitNumber ||
        Number(unitNumber) < 17
    ) {

        carNumberInput.value = "";

        carDisplay.textContent =
            "—";

        updateInstallationDevices();

        return;

    }


    const carPositions = {

        DTC: 0,
        MC1: 1,
        MC2: 2,
        MCI: 3

    };


    const position =
        carPositions[carName];


    const baseNumber =
        65 +
        (
            (Number(unitNumber) - 17)
            * 4
        );


    const finalNumber =
        baseNumber +
        position;


    const carNumber =
        finalNumber +
        "-" +
        carName +
        "-" +
        unitNumber;


    carNumberInput.value =
        carNumber;


    carDisplay.textContent =
        finalNumber;


    updateInstallationDevices();

}



/* =========================================
   تحديث الحالة
========================================= */

function updateInstallationStatus() {

    const done =
        document.getElementById(
            "installationDone"
        ).value;


    const reasonGroup =
        document.getElementById(
            "installationReasonGroup"
        );


    const reason =
        document.getElementById(
            "installationReason"
        );


    if (done === "لا") {

        reasonGroup.style.display =
            "block";

        reason.required = true;

    }
    else {

        reasonGroup.style.display =
            "none";

        reason.required = false;

        reason.value = "";

    }

}



/* =========================================
   حفظ البيانات
========================================= */

async function saveInstallation() {

    const carName =
        document.getElementById(
            "installationCarName"
        ).value.trim();


    const unitNumber =
        document.getElementById(
            "installationUnitNumber"
        ).value.trim();


    const carNumber =
        document.getElementById(
            "installationCarNumber"
        ).value.trim();


    const device =
        document.getElementById(
            "installationDevice"
        ).value.trim();


    const done =
        document.getElementById(
            "installationDone"
        ).value;


    const reason =
        document.getElementById(
            "installationReason"
        ).value.trim();


    const notes =
        document.getElementById(
            "installationNotes"
        ).value.trim();


    const message =
        document.getElementById(
            "installationMessage"
        );


    const button =
        document.getElementById(
            "saveInstallationButton"
        );



    /* =========================
       التحقق
    ========================= */

    if (
        !carName ||
        !unitNumber ||
        !carNumber ||
        !device ||
        !done
    ) {

        message.innerText =
            "❌ من فضلك أكمل اسم العربية ورقم الوحدة والتركيبة والحالة";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        Number(unitNumber) < 17
    ) {

        message.innerText =
            "❌ رقم الوحدة يجب أن يكون 17 أو أكبر";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        done === "لا" &&
        !reason
    ) {

        message.innerText =
            "❌ من فضلك اكتب سبب عدم الانتهاء";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!supabaseClient) {

        message.innerText =
            "❌ Supabase غير متصل";

        message.style.color =
            "#dc3545";

        return;

    }



    /* =========================
       منع الضغط المتكرر
    ========================= */

    button.disabled = true;

    button.innerText =
        "⏳ جاري الحفظ...";


    message.innerText =
        "⏳ جاري حفظ البيانات...";

    message.style.color =
        "#0d6efd";



    /* =========================
       البيانات
    ========================= */

    const payload = {

        department:
            "installation",

        car_name:
            carName,

        car_number:
            carNumber,

        device:
            device,

        done:
            done,

        notes:
            notes,

        created_by:
            getCurrentUsername(),

        not_completed_reason:
            done === "لا"
                ? reason
                : null

    };



    console.log(
        "📤 INSTALLATION DATA:",
        payload
    );



    try {

        const result =
            await supabaseClient
                .from("records")
                .insert(payload)
                .select()
                .single();



        if (result.error) {

            console.error(
                "❌ INSTALLATION INSERT ERROR:",
                result.error
            );


            message.innerText =
                "❌ فشل الحفظ:\n" +
                result.error.message;

            message.style.color =
                "#dc3545";


            button.disabled = false;

            button.innerText =
                "💾 حفظ البيانات";

            return;

        }



        /* =========================
           نجاح الحفظ
        ========================= */

        console.log(
            "✅ INSTALLATION SAVED:",
            result.data
        );


        message.innerText =
            "✅ تم حفظ بيانات التركيبة بنجاح";


        message.style.color =
            "#198754";



        /* =========================
           تفريغ الفورم
        ========================= */

        document.getElementById(
            "installationCarName"
        ).value = "";


        document.getElementById(
            "installationUnitNumber"
        ).value = "";


        document.getElementById(
            "installationCarNumber"
        ).value = "";


        document.getElementById(
            "installationCarDisplay"
        ).textContent = "—";


        document.getElementById(
            "installationNameDisplay"
        ).textContent = "—";


        document.getElementById(
            "installationUnitDisplay"
        ).textContent = "—";


        document.getElementById(
            "installationDevice"
        ).innerHTML =
            '<option value="">اختر اسم العربية أولاً</option>';


        document.getElementById(
            "installationDevice"
        ).disabled = true;


        document.getElementById(
            "installationDone"
        ).value = "";


        document.getElementById(
            "installationReason"
        ).value = "";


        document.getElementById(
            "installationReasonGroup"
        ).style.display = "none";


        document.getElementById(
            "installationNotes"
        ).value = "";



        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";



        await loadInstallationRecords();

    }


    catch (error) {

        console.error(
            "❌ INSTALLATION SAVE ERROR:",
            error
        );


        message.innerText =
            "❌ حصل خطأ أثناء الحفظ:\n" +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";

    }

}



/* =========================================
   تحميل السجلات
========================================= */

async function loadInstallationRecords() {

    const container =
        document.getElementById(
            "installationRecords"
        );


    if (!container) {
        return;
    }


    if (!supabaseClient) {

        container.innerHTML =
            '<div class="error-box">❌ Supabase غير متصل</div>';

        return;

    }



    try {

        const result =
            await supabaseClient
                .from("records")
                .select("*")
                .eq(
                    "department",
                    "installation"
                );



        if (result.error) {

            console.error(
                "❌ INSTALLATION LOAD ERROR:",
                result.error
            );


            container.innerHTML =
                '<div class="error-box">❌ ' +
                escapeHTML(
                    result.error.message
                ) +
                '</div>';

            return;

        }



        const records =
            result.data || [];



        if (!records.length) {

            container.innerHTML =
                '<div class="empty">' +
                'لا توجد بيانات مسجلة حتى الآن' +
                '</div>';

            return;

        }



        records.sort(
            function(a, b) {

                return new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                );

            }
        );



        container.innerHTML = "";



        records.forEach(
            function(record) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "record";


                /* مهم جدًا لنظام الحذف */

                div.dataset.recordId =
                    record.id;


                const statusClass =
                    record.done === "نعم"
                        ? "completed"
                        : "not-completed";


                const statusText =
                    record.done === "نعم"
                        ? "✅ تم الانتهاء"
                        : "⚠️ لم يتم الانتهاء";


                div.innerHTML = `

                    <h3>
                        🔧
                        ${escapeHTML(
                            record.device || "تركيبة"
                        )}
                    </h3>


                    <p>
                        <strong>
                            🚆 العربية:
                        </strong>
                        ${escapeHTML(
                            record.car_name
                        )}
                    </p>


                    <p>
                        <strong>
                            🔢 رقم العربية:
                        </strong>
                        ${escapeHTML(
                            record.car_number
                        )}
                    </p>


                    <p>
                        <strong>
                            ✅ الحالة:
                        </strong>

                        <span class="status-badge ${statusClass}">
                            ${statusText}
                        </span>
                    </p>


                    ${
                        record.done !== "نعم"
                        ?
                        `
                        <p>
                            <strong>
                                ⚠️ سبب عدم الانتهاء:
                            </strong>
                            ${escapeHTML(
                                record.not_completed_reason || "غير محدد"
                            )}
                        </p>
                        `
                        :
                        ""
                    }


                    <p>
                        <strong>
                            📝 الملاحظات:
                        </strong>
                        ${escapeHTML(
                            record.notes || "لا توجد"
                        )}
                    </p>


                    <p>
                        <strong>
                            👤 المستخدم:
                        </strong>
                        ${escapeHTML(
                            record.created_by || ""
                        )}
                    </p>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    catch (error) {

        console.error(
            "❌ INSTALLATION LOAD ERROR:",
            error
        );


        container.innerHTML =
            '<div class="error-box">' +
            '❌ حصل خطأ أثناء تحميل البيانات' +
            '</div>';

    }

}
