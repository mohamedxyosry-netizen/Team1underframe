<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NERIC - Installation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .dashboard {
            min-height: 100vh;
        }

        .header {
            background: rgb(52, 67, 84);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            border-bottom: 3px solid #5928e0;
        }

        .header h1 {
            margin: 0 0 7px;
            font-size: 28px;
            color: #ffffff;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .logout-btn {
            border: none;
            background: #198754;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }

        .form-page {
            width: min(1100px, 94%);
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .form-card,
        .records-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .form-card {
            border-top: 5px solid #198754;
        }

        .records-card {
            border-top: 5px solid #0d6efd;
        }

        .form-card h2,
        .records-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 21px;
        }

        .form-card h2 {
            color: #198754;
        }

        .records-card h2 {
            color: #0d6efd;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            border-color: #198754;
            background: white;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .input-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            border: none;
            background: #198754;
            color: white;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .save-btn:hover {
            background: #157347;
        }

        .save-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        #installationMessage {
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
            line-height: 1.7;
        }

        #installationRecords {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .record {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: 5px solid #0d6efd;
            border-radius: 12px;
            padding: 18px;
        }

        .record h3 {
            margin-top: 0;
            font-size: 16px;
            color: #0d6efd;
        }

        .record p {
            margin: 9px 0;
            line-height: 1.7;
        }

        .record strong {
            color: #374151;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .error-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #b42318;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            line-height: 1.7;
        }

        @media (max-width: 750px) {

            .header {
                padding: 18px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .logout-btn {
                width: 100%;
            }

            .form-page {
                grid-template-columns: 1fr;
                width: 94%;
                margin: 20px auto;
            }

            .form-card,
            .records-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <header class="header">

        <div>

            <h1>
                🔧 قسم التركيبات
            </h1>

            <p>
                تسجيل ومتابعة أعمال التركيبات
            </p>

        </div>


        <button
            class="logout-btn"
            type="button"
            onclick="goHome()">

            🏠 الأقسام الرئيسية

        </button>

    </header>



    <main class="form-page">


        <div class="form-card">

            <h2>
                📝 تسجيل بيانات جديدة
            </h2>


            <!-- اسم العربية -->

            <div class="input-group">

                <label>
                    🚆 اسم العربية
                </label>

                <select
                    id="installationCarName"
                    onchange="updateInstallationCarNumber()">

                    <option value="">
                        اختر اسم العربية
                    </option>

                    <option value="DTC">
                        DTC
                    </option>

                    <option value="MC1">
                        MC1
                    </option>

                    <option value="MC2">
                        MC2
                    </option>

                    <option value="MCI">
                        MCI
                    </option>

                </select>

            </div>


            <!-- رقم الوحدة -->

            <div class="input-group">

                <label>
                    🔢 رقم الوحدة
                </label>

                <input
                    type="number"
                    id="installationUnitNumber"
                    placeholder="مثال: 17"
                    min="17"
                    oninput="updateInstallationCarNumber()">

            </div>


            <!-- رقم العربية -->

            <div class="input-group">

                <label>
                    🚆 رقم العربية
                </label>

                <input
                    type="text"
                    id="installationCarNumber"
                    placeholder="سيظهر تلقائياً"
                    readonly>

            </div>


            <!-- الحالة -->

            <div class="input-group">

                <label>
                    ✅ حالة الانتهاء
                </label>

                <select id="installationDone">

                    <option value="">
                        اختار الحالة
                    </option>

                    <option value="نعم">
                        نعم - تم الانتهاء
                    </option>

                    <option value="لا">
                        لا - لم يتم الانتهاء
                    </option>

                </select>

            </div>


            <!-- الملاحظات -->

            <div class="input-group">

                <label>
                    📝 ملاحظات
                </label>

                <textarea
                    id="installationNotes"
                    placeholder="اكتب الملاحظات"></textarea>

            </div>


            <button
                type="button"
                class="save-btn"
                id="saveInstallationButton"
                onclick="saveInstallation()">

                💾 حفظ البيانات

            </button>


            <p id="installationMessage"></p>

        </div>



        <div class="records-card">

            <h2>
                📋 البيانات المسجلة
            </h2>


            <div id="installationRecords">

                <div class="empty">
                    ⏳ جاري تحميل البيانات...
                </div>

            </div>

        </div>


    </main>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://gzyybadyaunizdlvmcle.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";


let supabaseClient = null;


try {

    if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
    ) {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    }

} catch (error) {

    console.error(
        "SUPABASE CLIENT ERROR:",
        error
    );

}



function getCurrentUsername() {

    try {

        const currentUser =
            JSON.parse(
                sessionStorage.getItem(
                    "currentUser"
                )
            );

        if (
            currentUser &&
            currentUser.name
        ) {

            return currentUser.name;

        }

        if (
            currentUser &&
            currentUser.username
        ) {

            return currentUser.username;

        }

    } catch (error) {

        console.log(
            "Could not read current user"
        );

    }

    return "Unknown";

}



function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



function formatArabicDate(value) {

    if (!value) {
        return "غير محدد";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }
    ).format(date);

}



/* =========================================
   توليد رقم العربية
   ========================================= */

function updateInstallationCarNumber() {

    const carName =
        document.getElementById(
            "installationCarName"
        ).value;


    const unitNumber =
        document.getElementById(
            "installationUnitNumber"
        ).value.trim();


    const carNumberInput =
        document.getElementById(
            "installationCarNumber"
        );


    if (
        !carName ||
        !unitNumber ||
        Number(unitNumber) < 17
    ) {

        carNumberInput.value = "";

        return;

    }


    const carPositions = {

        DTC: 0,

        MC1: 1,

        MC2: 2,

        MCI: 3

    };


    const position =
        carPositions[carName];


    const baseNumber =
        65 +
        (
            (Number(unitNumber) - 17)
            * 4
        );


    const finalNumber =
        baseNumber +
        position;


    carNumberInput.value =
        finalNumber +
        "-" +
        carName +
        "-" +
        unitNumber;

}



/* =========================================
   حفظ بيانات Installation
   ========================================= */

async function saveInstallation() {

    const carNameElement =
        document.getElementById(
            "installationCarName"
        );


    const unitNumberElement =
        document.getElementById(
            "installationUnitNumber"
        );


    const carNumberElement =
        document.getElementById(
            "installationCarNumber"
        );


    const doneElement =
        document.getElementById(
            "installationDone"
        );


    const notesElement =
        document.getElementById(
            "installationNotes"
        );


    const message =
        document.getElementById(
            "installationMessage"
        );


    const button =
        document.getElementById(
            "saveInstallationButton"
        );


    const carName =
        carNameElement.value.trim();


    const unitNumber =
        unitNumberElement.value.trim();


    const carNumber =
        carNumberElement.value.trim();


    const done =
        doneElement.value;


    const notes =
        notesElement.value.trim();



    if (
        !carName ||
        !unitNumber ||
        !carNumber ||
        !done
    ) {

        message.innerText =
            "❌ من فضلك اختر اسم العربية ورقم الوحدة واختر الحالة";

        message.style.color =
            "#dc3545";

        return;

    }



    if (
        Number(unitNumber) < 17
    ) {

        message.innerText =
            "❌ رقم الوحدة يجب أن يكون 17 أو أكبر";

        message.style.color =
            "#dc3545";

        return;

    }



    if (!supabaseClient) {

        message.innerText =
            "❌ Supabase غير متصل";

        message.style.color =
            "#dc3545";

        return;

    }



    button.disabled = true;

    button.innerText =
        "⏳ جاري الحفظ...";


    message.innerText =
        "⏳ جاري حفظ البيانات...";

    message.style.color =
        "#0d6efd";



    const payload = {

        department:
            "installation",

        car_name:
            carName,

        car_number:
            carNumber,

        done:
            done,

        notes:
            notes,

        created_by:
            getCurrentUsername()

    };



    console.log(
        "📤 INSTALLATION DATA:",
        payload
    );



    try {

        const result =
            await supabaseClient
                .from("records")
                .insert(payload)
                .select()
                .single();



        if (result.error) {

            console.error(
                "❌ INSTALLATION INSERT ERROR:",
                result.error
            );


            message.innerText =
                "❌ فشل الحفظ:\n" +
                result.error.message;


            message.style.color =
                "#dc3545";


            button.disabled = false;

            button.innerText =
                "💾 حفظ البيانات";

            return;

        }



        console.log(
            "✅ INSTALLATION SAVED:",
            result.data
        );


        message.innerText =
            "✅ تم حفظ البيانات بنجاح في Supabase";


        message.style.color =
            "#198754";



        carNameElement.value = "";

        unitNumberElement.value = "";

        carNumberElement.value = "";

        doneElement.value = "";

        notesElement.value = "";



        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";



        await loadInstallationRecords();

    }


    catch (error) {

        console.error(
            "❌ INSTALLATION SAVE ERROR:",
            error
        );


        message.innerText =
            "❌ حصل خطأ أثناء الحفظ:\n" +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled = false;

        button.innerText =
            "💾 حفظ البيانات";

    }

}



/* =========================================
   تحميل سجلات Installation
   ========================================= */

async function loadInstallationRecords() {

    const container =
        document.getElementById(
            "installationRecords"
        );


    if (!container) {
        return;
    }



    if (!supabaseClient) {

        container.innerHTML =
            '<div class="error-box">❌ Supabase غير متصل</div>';

        return;

    }



    try {

        const result =
            await supabaseClient
                .from("records")
                .select("*")
                .eq(
                    "department",
                    "installation"
                );



        if (result.error) {

            console.error(
                "❌ INSTALLATION LOAD ERROR:",
                result.error
            );


            container.innerHTML =
                '<div class="error-box">❌ ' +
                escapeHTML(
                    result.error.message
                ) +
                '</div>';

            return;

        }



        const records =
            result.data || [];



        if (!records.length) {

            container.innerHTML =
                '<div class="empty">' +
                'لا توجد بيانات مسجلة حتى الآن' +
                '</div>';

            return;

        }



        records.sort(
            function(a, b) {

                return new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                );

            }
        );



        container.innerHTML = "";



        records.forEach(
            function(record) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "record";


                /* مهم جدًا لنظام الحذف */

                div.dataset.recordId =
                    record.id;


                div.innerHTML = `

                    <h3>
                        🚆
                        ${escapeHTML(
                            record.car_name
                        )}
                    </h3>


                    <p>
                        <strong>
                            🔢 رقم العربية:
                        </strong>
                        ${escapeHTML(
                            record.car_number
                        )}
                    </p>


                    <p>
                        <strong>
                            ✅ الحالة:
                        </strong>
                        ${escapeHTML(
                            record.done
                        )}
                    </p>


                    <p>
                        <strong>
                            📝 الملاحظات:
                        </strong>
                        ${escapeHTML(
                            record.notes || ""
                        )}
                    </p>


                    <p>
                        <strong>
                            👤 المستخدم:
                        </strong>
                        ${escapeHTML(
                            record.created_by || ""
                        )}
                    </p>


                    <p>
                        <strong>
                            🕐 وقت التسجيل:
                        </strong>
                        ${formatArabicDate(
                            record.created_at
                        )}
                    </p>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    catch (error) {

        console.error(
            "❌ INSTALLATION LOAD ERROR:",
            error
        );


        container.innerHTML =
            '<div class="error-box">' +
            '❌ حصل خطأ أثناء تحميل البيانات' +
            '</div>';

    }

}



/* =========================================
   العودة للرئيسية
   ========================================= */

function goHome() {

    window.location.href =
        "index.html";

}



/* =========================================
   تشغيل الصفحة
   ========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadInstallationRecords();

    }
);

</script>


<script src="delete-system.js?v=2"></script>


</body>

</html>
