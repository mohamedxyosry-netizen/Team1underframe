<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NERIC - Installation</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
}

.dashboard {
    min-height: 100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    background: rgb(52, 67, 84);

    padding: 20px 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.08);

    border-bottom:
        3px solid #5928e0;
}

.header h1 {

    margin: 0 0 7px;

    font-size: 28px;

    color: white;
}

.header p {

    margin: 0;

    color: #d1d5db;

    font-size: 14px;
}

.logout-btn {

    border: none;

    background: #198754;

    color: white;

    padding: 12px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;
}

.logout-btn:hover {

    opacity: .9;
}


/* =====================================================
   PAGE
===================================================== */

.form-page {

    width: min(1100px, 94%);

    margin: 30px auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 25px;

    align-items: start;
}


/* =====================================================
   CARDS
===================================================== */

.form-card,
.records-card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    border:
        1px solid #e5e7eb;
}

.form-card {

    border-top:
        5px solid #198754;
}

.records-card {

    border-top:
        5px solid #0d6efd;
}

.form-card h2,
.records-card h2 {

    margin-top: 0;

    margin-bottom: 25px;

    font-size: 21px;
}

.form-card h2 {

    color: #198754;
}

.records-card h2 {

    color: #0d6efd;
}


/* =====================================================
   INPUTS
===================================================== */

.input-group {

    margin-bottom: 18px;
}

.input-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #374151;
}

.input-group input,
.input-group select,
.input-group textarea {

    width: 100%;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    padding: 13px;

    font-size: 15px;

    background: #f9fafb;

    outline: none;

    transition: .2s;

    font-family: inherit;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {

    border-color:
        #198754;

    background: white;

    box-shadow:
        0 0 0 3px
        rgba(25,135,84,.12);
}

.input-group textarea {

    min-height: 110px;

    resize: vertical;
}


/* =====================================================
   CAR NUMBER
===================================================== */

.car-number-preview {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 8px;

    margin-top: 10px;

    direction: ltr;
}

.number-part {

    background: #f8fafc;

    border:
        1px solid #d1d5db;

    border-radius: 12px;

    padding: 10px 5px;

    text-align: center;

    min-height: 78px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.number-part span {

    display: block;

    font-size: 12px;

    color: #64748b;

    margin-bottom: 5px;

    direction: rtl;
}

.number-part strong {

    display: block;

    font-size: 22px;

    color: #344354;

    direction: ltr;
}

.car-name-part {

    background: #f0fdf4;

    border:
        2px solid #198754;
}

.car-name-part strong {

    color: #198754;

    font-size: 23px;
}


/* =====================================================
   INSTALLATION DEVICES
===================================================== */

.devices-box {

    background: #f8fafc;

    border:
        1px solid #dbe3ec;

    border-radius: 12px;

    padding: 12px;

    max-height: 380px;

    overflow-y: auto;
}


/* =====================================================
   SELECT ALL
===================================================== */

.device-select-all {

    background: #e0f2fe;

    border:
        1px solid #7dd3fc;

    border-radius: 10px;

    padding: 13px;

    margin-bottom: 10px;
}

.device-select-all label {

    display: flex;

    align-items: center;

    gap: 10px;

    cursor: pointer;

    font-weight: bold;

    color: #0369a1;

    margin: 0;
}

.device-select-all input {

    width: 21px;

    height: 21px;

    accent-color: #0d6efd;

    cursor: pointer;

    flex-shrink: 0;
}


/* =====================================================
   DEVICE ITEM
===================================================== */

.device-item {

    display: flex;

    align-items: center;

    gap: 10px;

    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 9px;

    padding: 12px;

    margin-bottom: 7px;

    cursor: pointer;

    transition: .2s;
}

.device-item:hover {

    background: #f0fdf4;

    border-color:
        #198754;
}

.device-item.selected {

    background: #f0fdf4;

    border-color:
        #198754;
}

.device-item input {

    width: 20px;

    height: 20px;

    accent-color: #198754;

    cursor: pointer;

    flex-shrink: 0;
}

.device-item span {

    font-size: 15px;

    font-weight: bold;

    color: #374151;
}


/* =====================================================
   EMPTY DEVICES
===================================================== */

.devices-empty {

    text-align: center;

    padding: 20px;

    color: #64748b;

    font-size: 14px;
}


/* =====================================================
   SELECTED COUNT
===================================================== */

.selected-count {

    margin-top: 10px;

    padding: 9px;

    text-align: center;

    background: #f0fdf4;

    color: #15803d;

    border-radius: 8px;

    font-weight: bold;
}


/* =====================================================
   STATUS
===================================================== */

.status-badge {

    display: inline-block;

    padding: 7px 12px;

    border-radius: 20px;

    font-weight: bold;

    font-size: 13px;
}

.completed {

    background: #dcfce7;

    color: #166534;
}

.not-completed {

    background: #fee2e2;

    color: #991b1b;
}


/* =====================================================
   REASON
===================================================== */

.reason-box {

    display: none;
}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-btn {

    width: 100%;

    border: none;

    background: #198754;

    color: white;

    padding: 14px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    margin-top: 5px;
}

.save-btn:hover {

    background: #157347;
}

.save-btn:disabled {

    background: #6c757d;

    cursor: not-allowed;
}


/* =====================================================
   MESSAGE
===================================================== */

#installationMessage {

    text-align: center;

    font-weight: bold;

    margin-top: 18px;

    line-height: 1.7;

    white-space: pre-line;
}


/* =====================================================
   REGISTERED CARS
===================================================== */

.registered-car-box {

    margin-bottom: 20px;

    padding: 15px;

    background: #f8fafc;

    border:
        1px solid #dbe3ec;

    border-radius: 12px;
}

.registered-car-box label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #374151;
}

#installationRegisteredCars {

    width: 100%;

    border:
        1px solid #cbd5e1;

    border-radius: 10px;

    padding: 13px;

    font-size: 15px;

    background: white;

    outline: none;

    cursor: pointer;

    font-family: inherit;
}

#installationRegisteredCars:focus {

    border-color:
        #0d6efd;

    box-shadow:
        0 0 0 3px
        rgba(13,110,253,.12);
}


/* =====================================================
   RECORDS
===================================================== */

#installationRecords {

    display: flex;

    flex-direction: column;

    gap: 15px;
}

.record {

    background: #f8fafc;

    border:
        1px solid #e2e8f0;

    border-right:
        5px solid #0d6efd;

    border-radius: 12px;

    padding: 18px;
}

.record h3 {

    margin-top: 0;

    font-size: 16px;

    color: #0d6efd;
}

.record p {

    margin: 9px 0;

    line-height: 1.7;
}

.record strong {

    color: #374151;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    text-align: center;

    color: #64748b;

    padding: 20px;
}


/* =====================================================
   ERROR
===================================================== */

.error-box {

    background: #fff1f2;

    border:
        1px solid #fecdd3;

    color: #b42318;

    border-radius: 10px;

    padding: 15px;

    text-align: center;

    line-height: 1.7;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 750px) {

    .header {

        padding: 18px;

        flex-direction: column;

        align-items: stretch;

        text-align: center;
    }

    .logout-btn {

        width: 100%;
    }

    .form-page {

        grid-template-columns: 1fr;

        width: 94%;

        margin: 20px auto;
    }

    .form-card,
    .records-card {

        padding: 20px;
    }

    .car-number-preview {

        gap: 6px;
    }

    .number-part {

        padding: 10px 5px;
    }

    .number-part span {

        font-size: 11px;
    }

    .number-part strong {

        font-size: 18px;
    }

    .car-name-part strong {

        font-size: 19px;
    }

}

</style>

</head>


<body>

<div class="dashboard">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div>

        <h1>
            🔧 قسم التركيبات
        </h1>

        <p>
            تسجيل ومتابعة أعمال التركيبات
        </p>

    </div>


    <button
        class="logout-btn"
        type="button"

        🏠 الأقسام الرئيسية

<!-- =====================================================
     MAIN
===================================================== -->

<main class="form-page">


<!-- =====================================================
     FORM
===================================================== -->

<div class="form-card">

    <h2>
        📝 تسجيل بيانات جديدة
    </h2>


    <!-- =================================================
         اسم العربية
    ================================================= -->

    <div class="input-group">

        <label>
            🚆 اسم العربية
        </label>

        <select
            id="installationCarName"

            </option>

            <option value="MC2">

            </option>

                MCI
            </option>

        </select>

    </div>


    <!-- =================================================
         رقم الوحدة
    ================================================= -->

    <div class="input-group">

        <label>
            🔢 رقم الوحدة
        </label>

        <input
            type="number"
            id="installationUnitNumber"
            placeholder="مثال: 1"
            min="1"
            step="1"

    </div>


    <!-- =================================================

        </label>

        <div class="car-number-preview">


            <div class="number-part">

                <span>
                    رقم العربية
                </span>

                <strong
                    id="installationCarDisplay">

                    —

                </strong>

            </div>


            <div class="number-part car-name-part">

                <span>
                    اسم العربية
                </span>

                <strong
                    id="installationNameDisplay">

                    —

                </strong>

            </div>


            <div class="number-part">

                <span>
                    رقم الوحدة
                </span>

                <strong
                    id="installationUnitDisplay">

                    —

                </strong>

            </div>


        </div>


        <input
            type="hidden"
            id="installationCarNumber">

    </div>


    <!-- =================================================
         اختيار التركيبات
    ================================================= -->

    <div class="input-group">

        <label>
            🔧 اختر التركيبات
        </label>


        <div
            id="installationDevicesBox"
            class="devices-box">

            <div class="devices-empty">

                🚆 اختر اسم العربية أولاً

            </div>

        </div>

    </div>


    <!-- =================================================
         الحالة
    ================================================= -->

    <div class="input-group">

        <label>
            ✅ حالة الانتهاء
        </label>

        <select
            id="installationDone"
            onchange="updateInstallationStatus()">

            <option value="">
                اختار الحالة
            </option>

            <option value="نعم">
                نعم - تم الانتهاء
            </option>

            <option value="لا">
                لا - لم يتم الانتهاء
            </option>

        </select>

    </div>


    <!-- =================================================
         سبب عدم الانتهاء
    ================================================= -->

    <div
        class="input-group reason-box"
        id="installationReasonGroup">

        <label>
            ⚠️ سبب عدم الانتهاء
        </label>

        <textarea
            id="installationReason"
            placeholder="اكتب سبب عدم الانتهاء"></textarea>

    </div>


    <!-- =================================================
         الملاحظات
    ================================================= -->

    <div class="input-group">

        <label>
            📝 ملاحظات
        </label>

        <textarea
            id="installationNotes"
            placeholder="اكتب الملاحظات"></textarea>

    </div>


    <!-- =================================================
         SAVE
    ================================================= -->

    <button
        type="button"
        class="save-btn"
        id="saveInstallationButton"
        onclick="saveInstallation()">

        💾 حفظ البيانات

    </button>


    <p id="installationMessage"></p>

</div>



<!-- =====================================================
     RECORDS
===================================================== -->

<div class="records-card">

    <h2>
        📋 البيانات المسجلة
    </h2>


    <!-- =================================================
         اختيار العربية
    ================================================= -->

    <div class="registered-car-box">

        <label>
            🚆 اختر العربية المسجلة
        </label>

        <select
            id="installationRegisteredCars"
            onchange="showInstallationCarRecords()">

            <option value="">
                اختر العربية المسجلة
            </option>

        </select>

    </div>


    <div id="installationRecords">

        <div class="empty">

            🚆 اختر العربية المسجلة لعرض بياناتها

        </div>

    </div>

</div>


</main>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://gzyybadyaunizdlvmcle.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";


let supabaseClient = null;


try {

    if (
        window.supabase &&
        typeof window.supabase.createClient ===
        "function"
    ) {

        supabaseClient =

}
catch (error) {

    console.error(

        error
    );

}


/* =====================================================
   قوائم التركيبات حسب العربية
===================================================== */

const INSTALLATION_DEVICES = {


    DTC: [

        "APU1",
        "APU2",
        "MS BOX",
        "HTJP",
        "STINGER-L",
        "STINGER-R",
        "CM",
        "LDOS",
        "RDOS",
        "LOCOJ",
        "TOWJ"

    ],


    MC1: [

        "FL",
        "VVVF",
        "MS BOX",
        "HTJP",
        "STINGER-L",
        "STINGER-R",
        "HSCB",
        "LB BOX",
        "SA",
        "BCG",
        "BCB",
        "TMJP1",
        "TMJP2",
        "TMJP3",
        "TMJP4"

    ],


    MC2: [

        "FL",
        "VVVF",
        "MS BOX",
        "HTJP",
        "STINGER-L",
        "STINGER-R",
        "HSCB",
        "LB BOX",
        "SA",
        "BCG",
        "BCB",
        "TMJP1",
        "TMJP2",
        "TMJP3",
        "TMJP4"

    ],


    MCI: [

        "FL",
        "VVVF",
        "MS BOX",
        "HTJP",
        "STINGER-L",
        "STINGER-R",
        "HSCB",
        "LB BOX",
        "SA",
        "CM",
        "TMJP1",
        "TMJP2",
        "TMJP3",
        "TMJP4"

    ]

};


/* =====================================================
   السجلات
===================================================== */

let installationAllRecords = [];


/* =====================================================
   المستخدم الحالي
===================================================== */

function getCurrentUsername() {

    try {

        const currentUser =
            JSON.parse(
                sessionStorage.getItem(
                    "currentUser"
                )
            );


        if (
            currentUser &&
            currentUser.name
        ) {

            return currentUser.name;

        }


        if (
            currentUser &&
            currentUser.username
        ) {

            return currentUser.username;

        }

    }
    catch (error) {

        console.log(
            "Could not read current user"
        );

    }


    return "Unknown";

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   تحديث قائمة التركيبات
===================================================== */

function updateInstallationDevices() {

    const carName =
        document.getElementById(
            "installationCarName"
        ).value;


    const box =
        document.getElementById(
            "installationDevicesBox"
        );


    if (!box) {
        return;
    }


    box.innerHTML = "";


    /* =================================================
       لا توجد عربية
    ================================================= */

    if (!carName) {

        box.innerHTML = `

            <div class="devices-empty">

                🚆 اختر اسم العربية أولاً

            </div>

        `;

        return;

    }


    const devices =
        INSTALLATION_DEVICES[
            carName
        ] || [];


    /* =================================================
       لا توجد تركيبات
    ================================================= */

    if (!devices.length) {

        box.innerHTML = `

            <div class="devices-empty">

                ❌ لا توجد تركيبات مسجلة لهذه العربية

            </div>

        `;

        return;

    }


    /* =================================================
       اختيار الكل
    ================================================= */

    const selectAllDiv =
        document.createElement(
            "div"
        );


    selectAllDiv.className =
        "device-select-all";


    selectAllDiv.innerHTML = `

        <label>

            <input
                type="checkbox"
                id="installationSelectAll"
                onchange="
                    toggleAllInstallationDevices()
                ">

            <span>
                ☑️ اختيار كل التركيبات
            </span>

        </label>

    `;


    box.appendChild(
        selectAllDiv
    );


    /* =================================================
       إنشاء التركيبات
    ================================================= */

    devices.forEach(
        function(device, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "device-item";


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.className =
                "installation-device-checkbox";


            checkbox.id =
                "installationDevice_" +
                index;


            checkbox.value =
                device;


            checkbox.addEventListener(
                "change",
                function() {

                    updateInstallationSelectedCount();

                }
            );


            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                device;


            div.appendChild(
                checkbox
            );


            div.appendChild(
                span
            );


            /* =========================================
               الضغط على السطر
            ========================================= */

            div.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        checkbox
                    ) {

                        return;

                    }


                    checkbox.checked =
                        !checkbox.checked;


                    updateInstallationSelectedCount();

                }
            );


            box.appendChild(
                div
            );

        }
    );


    /* =================================================
       عداد الاختيارات
    ================================================= */

    const count =
        document.createElement(
            "div"
        );


    count.id =
        "installationSelectedCount";


    count.className =
        "selected-count";


    count.textContent =
        "لم يتم اختيار أي تركيبة";


    box.appendChild(
        count
    );

}


/* =====================================================
   اختيار كل التركيبات
===================================================== */

function toggleAllInstallationDevices() {

    const selectAll =
        document.getElementById(
            "installationSelectAll"
        );


    const checkboxes =
        document.querySelectorAll(
            ".installation-device-checkbox"
        );


    if (!selectAll) {
        return;
    }


    checkboxes.forEach(
        function(checkbox) {

            checkbox.checked =
                selectAll.checked;

        }
    );


    updateInstallationSelectedCount();

}


/* =====================================================
   تحديث عدد التركيبات
===================================================== */

function updateInstallationSelectedCount() {

    const selected =
        document.querySelectorAll(
            ".installation-device-checkbox:checked"
        );


    const all =
        document.querySelectorAll(
            ".installation-device-checkbox"
        );


    const count =
        document.getElementById(
            "installationSelectedCount"
        );


    const selectAll =
        document.getElementById(
            "installationSelectAll"
        );


    /* =================================================
       تحديث العداد
    ================================================= */

    if (count) {

        if (selected.length === 0) {

            count.textContent =
                "لم يتم اختيار أي تركيبة";

        }
        else {

            count.textContent =
                "✅ تم اختيار " +
                selected.length +
                " تركيبة";

        }

    }


    /* =================================================
       تحديث اختيار الكل
    ================================================= */

    if (
        selectAll &&
        all.length > 0
    ) {

        selectAll.checked =
            selected.length ===
            all.length;

    }


    /* =================================================
       شكل العناصر المختارة
    ================================================= */

    all.forEach(
        function(checkbox) {

            const item =
                checkbox.closest(
                    ".device-item"
                );


            if (!item) {
                return;
            }


            if (checkbox.checked) {

                item.classList.add(
                    "selected"
                );

            }
            else {

                item.classList.remove(
                    "selected"
                );

            }

        }
    );

}

/* =====================================================
   توليد رقم العربية
===================================================== */

function updateInstallationCarNumber() {

    const carName =
        document.getElementById(
            "installationCarName"
        )
        .value
        .trim()
        .toUpperCase();


    const unitNumber =
        document.getElementById(
            "installationUnitNumber"
        )
        .value
        .trim();


    const carNumberInput =
        document.getElementById(
            "installationCarNumber"
        );


    const carDisplay =
        document.getElementById(
            "installationCarDisplay"
        );


    const nameDisplay =
        document.getElementById(
            "installationNameDisplay"
        );


    const unitDisplay =
        document.getElementById(
            "installationUnitDisplay"
        );


    nameDisplay.textContent =
        carName || "—";


    unitDisplay.textContent =
        unitNumber || "—";


    /* =================================================
       البيانات ناقصة
    ================================================= */

    if (
        !carName ||
        !unitNumber
    ) {

        carNumberInput.value =
            "";

        carDisplay.textContent =
            "—";

        updateInstallationDevices();

        return;

    }


    const unit =
        Number(unitNumber);


    if (
        !Number.isInteger(unit) ||
        unit < 1
    ) {

        carNumberInput.value =
            "";

        carDisplay.textContent =
            "—";

        updateInstallationDevices();

        return;

    }


    /* =================================================
       ترتيب العربيات
    ================================================= */

    const oddOrder = [

        "DTC",
        "MC1",
        "MC2",
        "MCI"

    ];


    const evenOrder = [

        "MCI",
        "MC2",
        "MC1",
        "DTC"

    ];


    const order =
        unit % 2 === 1
            ? oddOrder
            : evenOrder;


    const position =
        order.indexOf(
            carName
        );


    if (position === -1) {

        carNumberInput.value =
            "";

        carDisplay.textContent =
            "—";

        updateInstallationDevices();

        return;

    }


    /* =================================================
       حساب رقم العربية
    ================================================= */

    const baseNumber =
        ((unit - 1) * 4) + 1;


    const finalNumber =
        baseNumber + position;


    const carNumber =

        finalNumber +
        "-" +
        carName +
        "-" +
        unit;


    carNumberInput.value =
        carNumber;


    carDisplay.textContent =
        finalNumber;


    /* =================================================
       تحديث التركيبات
    ================================================= */

    updateInstallationDevices();

}

function updateInstallationStatus() {

    const done =
        document.getElementById(
            "installationDone"
        ).value;


    const reasonGroup =
        document.getElementById(
            "installationReasonGroup"
        );


    const reason =
        document.getElementById(
            "installationReason"
        );


    if (done === "لا") {

        reasonGroup.style.display =
            "block";

        reason.required =
            true;

    }
    else {

        reasonGroup.style.display =
            "none";

        reason.required =
            false;

        reason.value =
            "";

    }

}


/* =====================================================
   حفظ البيانات
===================================================== */

async function saveInstallation() {

    const carName =
        document.getElementById(
            "installationCarName"
        )
        .value
        .trim();


    const unitNumber =
        document.getElementById(
            "installationUnitNumber"
        )
        .value
        .trim();


    const carNumber =
        document.getElementById(
            "installationCarNumber"
        )
        .value
        .trim();


    /* =================================================
       التركيبات المختارة
    ================================================= */

    const selectedDevices =
        getSelectedInstallationDevices();


    const done =
        document.getElementById(
            "installationDone"
        ).value;


    const reason =
        document.getElementById(
            "installationReason"
        )
        .value
        .trim();


    const notes =
        document.getElementById(
            "installationNotes"
        )
        .value
        .trim();


    const message =
        document.getElementById(
            "installationMessage"
        );


    const button =
        document.getElementById(
            "saveInstallationButton"
        );


    /* =================================================
       التحقق
    ================================================= */

    if (!carName) {

        message.innerText =
            "❌ من فضلك اختر اسم العربية";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        !unitNumber ||
        !Number.isInteger(
            Number(unitNumber)
        ) ||
        Number(unitNumber) < 1
    ) {

        message.innerText =
            "❌ من فضلك أدخل رقم وحدة صحيح يبدأ من 1";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!carNumber) {

        message.innerText =
            "❌ رقم العربية غير مكتمل";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        selectedDevices.length === 0
    ) {

        message.innerText =
            "❌ من فضلك اختر تركيبة واحدة على الأقل";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!done) {

        message.innerText =
            "❌ من فضلك اختر حالة الانتهاء";

        message.style.color =
            "#dc3545";

        return;

    }


    if (
        done === "لا" &&
        !reason
    ) {

        message.innerText =
            "❌ من فضلك اكتب سبب عدم الانتهاء";

        message.style.color =
            "#dc3545";

        return;

    }


    if (!supabaseClient) {

        message.innerText =
            "❌ Supabase غير متصل";

        message.style.color =
            "#dc3545";

        return;

    }


    /* =================================================
       منع الضغط أثناء الحفظ
    ================================================= */

    button.disabled =
        true;


    button.innerText =
        "⏳ جاري الحفظ...";


    message.innerText =
        "⏳ جاري حفظ " +
        selectedDevices.length +
        " تركيبة...";


    message.style.color =
        "#0d6efd";


    /* =================================================
       تجهيز السجلات
       
       كل تركيبة = سجل مستقل
    ================================================= */

    const payload =
        selectedDevices.map(
            function(device) {

                return {

                    department:
                        "installation",

                    car_name:
                        carName,

                    car_number:
                        carNumber,

                    device:
                        device,

                    done:
                        done,

                    notes:
                        notes,

                    created_by:
                        getCurrentUsername(),

                    not_completed_reason:
                        done === "لا"
                            ? reason
                            : null

                };

            }
        );


    console.log(
        "📤 INSTALLATION DATA:",
        payload
    );


    try {

        /* =================================================
           الحفظ في Supabase
        ================================================= */

        const result =
            await supabaseClient
                .from("records")
                .insert(payload)
                .select();


        if (result.error) {

            console.error(
                "❌ INSTALLATION INSERT ERROR:",
                result.error
            );


            message.innerText =
                "❌ فشل الحفظ:\n" +
                result.error.message;


            message.style.color =
                "#dc3545";


            button.disabled =
                false;


            button.innerText =
                "💾 حفظ البيانات";


            return;

        }


        /* =================================================
           نجاح الحفظ
        ================================================= */

        message.innerText =
            "✅ تم حفظ " +
            selectedDevices.length +
            " تركيبة بنجاح";


        message.style.color =
            "#198754";


        /* =================================================
           تفريغ اسم العربية
        ================================================= */

        document.getElementById(
            "installationCarName"
        ).value =
            "";


        /* =================================================
           تفريغ رقم الوحدة
        ================================================= */

        document.getElementById(
            "installationUnitNumber"
        ).value =
            "";


        /* =================================================
           تفريغ رقم العربية
        ================================================= */

        document.getElementById(
            "installationCarNumber"
        ).value =
            "";


        document.getElementById(
            "installationCarDisplay"
        ).textContent =
            "—";


        document.getElementById(
            "installationNameDisplay"
        ).textContent =
            "—";


        document.getElementById(
            "installationUnitDisplay"
        ).textContent =
            "—";


        /* =================================================
           إعادة قائمة التركيبات للوضع الأول
        ================================================= */

        updateInstallationDevices();


        /* =================================================
           الحالة
        ================================================= */

        document.getElementById(
            "installationDone"
        ).value =
            "";


        /* =================================================
           السبب
        ================================================= */

        document.getElementById(
            "installationReason"
        ).value =
            "";


        document.getElementById(
            "installationReasonGroup"
        ).style.display =
            "none";


        /* =================================================
           الملاحظات
        ================================================= */

        document.getElementById(
            "installationNotes"
        ).value =
            "";


        /* =================================================
           إعادة الزر
        ================================================= */

        button.disabled =
            false;


        button.innerText =
            "💾 حفظ البيانات";


        /* =================================================
           إعادة تحميل السجلات
        ================================================= */

        await loadInstallationRecords();

    }
    catch (error) {

        console.error(
            "❌ INSTALLATION SAVE ERROR:",
            error
        );


        message.innerText =
            "❌ حصل خطأ أثناء الحفظ:\n" +
            error.message;


        message.style.color =
            "#dc3545";


        button.disabled =
            false;


        button.innerText =
            "💾 حفظ البيانات";

    }

}


/* =====================================================
   تحميل السجلات
===================================================== */

async function loadInstallationRecords() {

    const container =
        document.getElementById(
            "installationRecords"
        );


    const carSelect =
        document.getElementById(
            "installationRegisteredCars"
        );


    if (
        !container ||
        !carSelect
    ) {

        return;

    }


    if (!supabaseClient) {

        container.innerHTML = `

            <div class="error-box">

                ❌ Supabase غير متصل

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="empty">

            ⏳ جاري تحميل البيانات...

        </div>

    `;


    try {

        const result =
            await supabaseClient
                .from("records")
                .select("*")
                .eq(
                    "department",
                    "installation"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            console.error(
                "❌ INSTALLATION LOAD ERROR:",
                result.error
            );


            container.innerHTML = `

                <div class="error-box">

                    ❌
                    ${escapeHTML(
                        result.error.message
                    )}

                </div>

            `;

            return;

        }


        installationAllRecords =
            result.data || [];


        /* =================================================
           بناء قائمة العربيات
        ================================================= */

        buildInstallationCars();


        /* =================================================
           البداية بدون اختيار
        ================================================= */

        container.innerHTML = `

            <div class="empty">

                🚆 اختر العربية المسجلة لعرض بياناتها

            </div>

        `;

    }
    catch (error) {

        console.error(
            "❌ INSTALLATION LOAD ERROR:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                ❌ حصل خطأ أثناء تحميل البيانات

            </div>

        `;

    }

}


/* =====================================================
   بناء قائمة العربيات المسجلة
===================================================== */

function buildInstallationCars() {

    const select =
        document.getElementById(
            "installationRegisteredCars"
        );


    if (!select) {
        return;
    }


    select.innerHTML = `

        <option value="">

            🚆 اختر العربية المسجلة

        </option>

    `;


    const carsMap =
        new Map();


    /* =================================================
       منع تكرار العربية
    ================================================= */

    installationAllRecords.forEach(
        function(record) {

            const carNumber =
                String(
                    record.car_number || ""
                ).trim();


            if (!carNumber) {
                return;
            }


            if (
                !carsMap.has(
                    carNumber
                )
            ) {

                carsMap.set(
                    carNumber,
                    record
                );

            }

        }
    );


    /* =================================================
       ترتيب العربيات
    ================================================= */

    const cars =
        Array.from(
            carsMap.entries()
        );


    cars.sort(
        function(a, b) {

            const recordA =
                a[1];

            const recordB =
                b[1];


            const numberA =
                parseInt(
                    String(
                        recordA.car_number ||
                        ""
                    ).split("-")[0]
                ) || 0;


            const numberB =
                parseInt(
                    String(
                        recordB.car_number ||
                        ""
                    ).split("-")[0]
                ) || 0;


            return numberA - numberB;

        }
    );


    /* =================================================
       إضافة العربيات
    ================================================= */

    cars.forEach(
        function(item) {

            const carNumber =
                item[0];

            const record =
                item[1];


            const parts =
                String(
                    carNumber
                ).split("-");


            const number =
                parts[0] ||
                "—";


            const unit =
                parts[2] ||
                "—";


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                carNumber;


            option.textContent =

                "🚆 " +

                (
                    record.car_name ||
                    "عربية"
                ) +

                " — رقم العربية " +

                number +

                " — الوحدة " +

                unit;


            select.appendChild(
                option
            );

        }
    );


    /* =================================================
       لا توجد سجلات
    ================================================= */

    if (
        installationAllRecords.length ===
        0
    ) {

        select.innerHTML = `

            <option value="">

                لا توجد عربيات مسجلة

            </option>

        `;

    }

}


/* =====================================================
   عرض سجلات العربية
===================================================== */

function showInstallationCarRecords() {

    const select =
        document.getElementById(
            "installationRegisteredCars"
        );


    const container =
        document.getElementById(
            "installationRecords"
        );


    if (
        !select ||
        !container
    ) {

        return;

    }


    const selectedCar =
        select.value;


    /* =================================================
       لا يوجد اختيار
    ================================================= */

    if (!selectedCar) {

        container.innerHTML = `

            <div class="empty">

                🚆 اختر العربية المسجلة لعرض بياناتها

            </div>

        `;

        return;

    }


    /* =================================================
       فلترة السجلات
    ================================================= */

    const records =
        installationAllRecords.filter(
            function(record) {

                return String(
                    record.car_number ||
                    ""
                ).trim() ===

                String(
                    selectedCar
                ).trim();

            }
        );


    if (
        !records.length
    ) {

        container.innerHTML = `

            <div class="empty">

                لا توجد بيانات مسجلة لهذه العربية

            </div>

        `;

        return;

    }


    container.innerHTML =
        "";


    /* =================================================
       عرض السجلات
    ================================================= */

    records.forEach(
        function(record) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            /* =================================================
               مهم لنظام الحذف
            ================================================= */

            if (
                record.id !==
                undefined
            ) {

                div.dataset.recordId =
                    record.id;

            }


            /* =================================================
               الحالة
            ================================================= */

            const isCompleted =
                String(
                    record.done ||
                    ""
                ).trim() ===
                "نعم";


            const statusClass =
                isCompleted
                    ? "completed"
                    : "not-completed";


            const statusText =
                isCompleted

                    ?

                    "✅ تم الانتهاء"

                    :

                    "⚠️ لم يتم الانتهاء";


            /* =================================================
               سبب عدم الانتهاء
            ================================================= */

            const reasonHTML =

                !isCompleted

                ?

                `

                <p>

                    <strong>
                        ⚠️ سبب عدم الانتهاء:
                    </strong>

                    ${escapeHTML(
                        record.not_completed_reason ||
                        "غير محدد"
                    )}

                </p>

                `

                :

                "";


            /* =================================================
               محتوى السجل
            ================================================= */

            div.innerHTML = `

                <h3>

                    🔧

                    ${escapeHTML(
                        record.device ||
                        "تركيبة"
                    )}

                </h3>


                <p>

                    <strong>
                        🚆 اسم العربية:
                    </strong>

                    ${escapeHTML(
                        record.car_name ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        🔢 رقم العربية:
                    </strong>

                    ${escapeHTML(
                        record.car_number ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        🔧 التركيبة:
                    </strong>

                    ${escapeHTML(
                        record.device ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        ✅ الحالة:
                    </strong>

                    <span
                        class="status-badge ${statusClass}">

                        ${statusText}

                    </span>

                </p>


                ${reasonHTML}


                <p>

                    <strong>
                        📝 الملاحظات:
                    </strong>

                    ${escapeHTML(
                        record.notes ||
                        "لا توجد"
                    )}

                </p>


                <p>

                    <strong>
                        👤 المستخدم:
                    </strong>

                    ${escapeHTML(
                        record.created_by ||
                        ""
                    )}

                </p>


                <p>

                    <strong>
                        🕘 وقت التسجيل:
                    </strong>

                    ${formatArabicDate(
                        record.created_at
                    )}

                </p>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   التاريخ
===================================================== */

function formatArabicDate(value) {

    if (!value) {

        return "غير محدد";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return new Intl.DateTimeFormat(
        "ar-EG",
        {

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric",

            hour:
                "numeric",

            minute:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}
