<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الدردشة</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #f4f7fb;
        }

        .chat-page {
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }

        .chat-header {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        .chat-header h1 {
            margin: 0 0 8px;
            color: #1f2937;
        }

        .current-user {
            color: #64748b;
            font-size: 15px;
        }

        .chat-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 18px;
            direction: ltr;
        }

        .users-card,
        .conversation-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            overflow: hidden;
            direction: rtl;
        }

        .card-title {
            padding: 17px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: bold;
            font-size: 18px;
        }

        .users-list {
            padding: 10px;
            max-height: 600px;
            overflow-y: auto;
        }

        .user-item {
            width: 100%;
            border: none;
            background: transparent;
            padding: 13px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-align: right;
            margin-bottom: 5px;
            transition: .2s;
        }

        .user-item:hover {
            background: #f1f5f9;
        }

        .user-item.active {
            background: #e8f5ee;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: bold;
            color: #1f2937;
        }

        .user-status {
            font-size: 12px;
            color: #64748b;
            margin-top: 3px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-left: 5px;
        }

        .unread-badge {
            min-width: 23px;
            height: 23px;
            padding: 0 6px;
            border-radius: 50px;
            background: #dc3545;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .conversation {
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .conversation-header {
            min-height: 72px;
            border-bottom: 1px solid #e5e7eb;
            padding: 13px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .conversation-header .avatar {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .conversation-user-name {
            font-weight: bold;
            font-size: 17px;
        }

        .messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .empty-chat {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            text-align: center;
            padding: 30px;
        }

        .message-row {
            display: flex;
            margin-bottom: 12px;
        }

        .message-row.mine {
            justify-content: flex-start;
        }

        .message-row.theirs {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-row.mine .message-bubble {
            background: #198754;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message-row.theirs .message-bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e2e8f0;
            border-bottom-right-radius: 4px;
        }

        .message-text {
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 10px;
            opacity: .7;
            margin-top: 4px;
            text-align: left;
        }

        .message-input-area {
            border-top: 1px solid #e5e7eb;
            padding: 12px;
            background: white;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 45px;
            max-height: 120px;
        }

        .message-input:focus {
            border-color: #198754;
            box-shadow: 0 0 0 2px rgba(25,135,84,.1);
        }

        .send-btn {
            border: none;
            background: #198754;
            color: white;
            border-radius: 12px;
            padding: 0 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            min-width: 80px;
        }

        .send-btn:hover {
            background: #157347;
        }

        .send-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .no-users {
            text-align: center;
            padding: 30px 15px;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 15px;
            border-radius: 10px;
            margin: 10px;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .chat-layout {
                grid-template-columns: 1fr;
            }

            .users-card {
                max-height: 280px;
            }

            .users-list {
                max-height: 210px;
            }

            .conversation {
                height: 550px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }

        @media (max-width: 500px) {
            .chat-page {
                padding: 8px;
                margin: 10px auto;
            }

            .chat-header {
                padding: 15px;
            }

            .chat-header h1 {
                font-size: 22px;
            }

            .conversation {
                height: 500px;
            }

            .message-input-area {
                padding: 8px;
            }

            .send-btn {
                min-width: 65px;
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<div class="chat-page">

    <div class="chat-header">
        <h1>💬 الدردشة</h1>
        <div class="current-user" id="currentUserText">
            جاري تحميل المستخدم...
        </div>
    </div>

    <div class="chat-layout">

        <!-- المستخدمين -->
        <div class="users-card">

            <div class="card-title">
                👥 المستخدمين
            </div>

            <div id="usersList" class="users-list">
                <div class="loading">
                    جاري تحميل المستخدمين...
                </div>
            </div>

        </div>


        <!-- المحادثة -->
        <div class="conversation-card">

            <div class="conversation">

                <div class="conversation-header" id="conversationHeader">
                    <div class="avatar">💬</div>

                    <div>
                        <div class="conversation-user-name">
                            اختر مستخدماً
                        </div>

                        <div class="user-status">
                            لبدء المحادثة
                        </div>
                    </div>
                </div>


                <div id="messages" class="messages">

                    <div class="empty-chat">
                        <div>
                            <div style="font-size:45px;margin-bottom:10px;">
                                💬
                            </div>

                            <div>
                                اختر شخصاً من القائمة لبدء الدردشة
                            </div>
                        </div>
                    </div>

                </div>


                <div class="message-input-area">

                    <textarea
                        id="messageInput"
                        class="message-input"
                        placeholder="اكتب رسالتك..."
                        rows="1"
                        disabled
                    ></textarea>

                    <button
                        id="sendButton"
                        class="send-btn"
                        onclick="sendMessage()"
                        disabled
                    >
                        إرسال
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- نظام المستخدمين الموجود عندك -->
<script src="script.js"></script>

<script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
        "https://gzyybadyaunizdlvmcle.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_zg4OnUfu83dzvD_GOIgarA__gbaXCEO";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================================
       VARIABLES
    ========================================================= */

    let currentUser = null;
    let selectedUser = null;

    let realtimeChannel = null;

    let messagesLoading = false;
    let usersLoading = false;


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHTML(value) {

        const div = document.createElement("div");

        div.textContent = value == null ? "" : String(value);

        return div.innerHTML;
    }


    function getUserUsername(user) {

        if (!user) return "";

        return (
            user.username ||
            user.userName ||
            user.name ||
            ""
        ).toString();
    }


    function getUserDisplayName(username) {

        if (
            typeof users !== "undefined" &&
            users &&
            users[username]
        ) {

            return (
                users[username].name ||
                users[username].username ||
                username
            );
        }

        return username;
    }


    function getInitial(name) {

        name = String(name || "").trim();

        if (!name) return "👤";

        return name.charAt(0).toUpperCase();
    }


    function formatMessageDate(dateValue) {

        if (!dateValue) return "";

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString(
            "ar-EG",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    /* =========================================================
       GET CURRENT USER
    ========================================================= */

    function loadCurrentUser() {

        try {

            if (typeof getCurrentUser === "function") {

                const user = getCurrentUser();

                if (user) {
                    return user;
                }
            }

        } catch (error) {

            console.warn(
                "getCurrentUser error:",
                error
            );
        }


        try {

            const sessionUser =
                sessionStorage.getItem("currentUser");

            if (sessionUser) {

                return JSON.parse(sessionUser);

            }

        } catch (error) {

            console.warn(
                "sessionStorage error:",
                error
            );
        }


        return null;
    }


    /* =========================================================
       USERS
    ========================================================= */

    function getAllUsers() {

        if (
            typeof users === "undefined" ||
            !users
        ) {

            return [];

        }


        return Object.keys(users)
            .map(username => {

                const user = users[username] || {};

                return {
                    username: username,
                    name:
                        user.name ||
                        user.username ||
                        username,
                    role: user.role || ""
                };

            });
    }


    /* =========================================================
       LOAD UNREAD COUNTS
    ========================================================= */

    async function getUnreadCounts() {

        const counts = {};


        if (!currentUser) {
            return counts;
        }


        const currentUsername =
            getUserUsername(currentUser);


        const { data, error } =
            await supabaseClient
                .from("private_messages")
                .select("sender_username")
                .eq(
                    "receiver_username",
                    currentUsername
                )
                .eq(
                    "is_read",
                    false
                );


        if (error) {

            console.error(
                "Unread error:",
                error
            );

            return counts;
        }


        (data || []).forEach(row => {

            const username =
                row.sender_username;

            counts[username] =
                (counts[username] || 0) + 1;

        });


        return counts;
    }


    /* =========================================================
       DISPLAY USERS
    ========================================================= */

    async function displayUsers() {

        if (usersLoading) return;

        usersLoading = true;


        const container =
            document.getElementById("usersList");


        try {

            const allUsers =
                getAllUsers();


            if (!allUsers.length) {

                container.innerHTML = `
                    <div class="no-users">
                        لا يوجد مستخدمون
                    </div>
                `;

                return;
            }


            const unreadCounts =
                await getUnreadCounts();


            container.innerHTML =
                allUsers
                    .filter(user => {

                        return (
                            user.username !==
                            getUserUsername(currentUser)
                        );

                    })
                    .map(user => {

                        const isActive =
                            selectedUser ===
                            user.username;


                        const unread =
                            unreadCounts[
                                user.username
                            ] || 0;


                        return `
                            <button
                                class="user-item ${isActive ? "active" : ""}"
                                onclick="openChat('${escapeHTML(user.username)}')"
                            >

                                <div class="user-avatar">
                                    ${escapeHTML(
                                        getInitial(user.name)
                                    )}
                                </div>

                                <div class="user-info">

                                    <div class="user-name">
                                        ${escapeHTML(user.name)}
                                    </div>

                                    <div class="user-status">
                                        <span class="online-dot"></span>
                                        ${escapeHTML(
                                            user.role || "مستخدم"
                                        )}
                                    </div>

                                </div>

                                ${
                                    unread > 0
                                    ? `
                                        <div class="unread-badge">
                                            ${unread > 99 ? "99+" : unread}
                                        </div>
                                    `
                                    : ""
                                }

                            </button>
                        `;

                    })
                    .join("");


        } catch (error) {

            console.error(
                "Display users error:",
                error
            );


            container.innerHTML = `
                <div class="error-message">
                    حدث خطأ أثناء تحميل المستخدمين
                </div>
            `;

        } finally {

            usersLoading = false;

        }

    }


    /* =========================================================
       OPEN CHAT
    ========================================================= */

    async function openChat(username) {

        if (!username) return;


        selectedUser = username;


        const displayName =
            getUserDisplayName(username);


        document.getElementById(
            "conversationHeader"
        ).innerHTML = `

            <div class="avatar">
                ${escapeHTML(
                    getInitial(displayName)
                )}
            </div>

            <div>

                <div class="conversation-user-name">
                    ${escapeHTML(displayName)}
                </div>

                <div class="user-status">
                    <span class="online-dot"></span>
                    متصل
                </div>

            </div>

        `;


        document.getElementById(
            "messageInput"
        ).disabled = false;


        document.getElementById(
            "sendButton"
        ).disabled = false;


        await markMessagesAsRead(username);


        await displayMessages();


        await displayUsers();


        setTimeout(() => {

            document
                .getElementById("messageInput")
                .focus();

        }, 100);

    }


    /* =========================================================
       GET CHAT MESSAGES
    ========================================================= */

    async function getChatMessages(username) {

        if (!currentUser || !username) {
            return [];
        }


        const currentUsername =
            getUserUsername(currentUser);


        const [
            sentResult,
            receivedResult
        ] = await Promise.all([

            supabaseClient
                .from("private_messages")
                .select("*")
                .eq(
                    "sender_username",
                    currentUsername
                )
                .eq(
                    "receiver_username",
                    username
                ),

            supabaseClient
                .from("private_messages")
                .select("*")
                .eq(
                    "sender_username",
                    username
                )
                .eq(
                    "receiver_username",
                    currentUsername
                )

        ]);


        if (sentResult.error) {

            console.error(
                "Sent messages error:",
                sentResult.error
            );

            throw sentResult.error;

        }


        if (receivedResult.error) {

            console.error(
                "Received messages error:",
                receivedResult.error
            );

            throw receivedResult.error;

        }


        const messages = [

            ...(sentResult.data || []),
            ...(receivedResult.data || [])

        ];


        messages.sort((a, b) => {

            return (
                new Date(a.created_at).getTime() -
                new Date(b.created_at).getTime()
            );

        });


        return messages;
    }


    /* =========================================================
       DISPLAY MESSAGES
    ========================================================= */

    async function displayMessages() {

        if (!selectedUser || !currentUser) {
            return;
        }


        if (messagesLoading) return;

        messagesLoading = true;


        const container =
            document.getElementById("messages");


        try {

            const messages =
                await getChatMessages(
                    selectedUser
                );


            if (!messages.length) {

                container.innerHTML = `
                    <div class="empty-chat">

                        <div>

                            <div style="
                                font-size:45px;
                                margin-bottom:10px;
                            ">
                                💬
                            </div>

                            <div>
                                لا توجد رسائل بعد
                            </div>

                            <div style="
                                margin-top:6px;
                                font-size:13px;
                                color:#94a3b8;
                            ">
                                ابدأ المحادثة الآن
                            </div>

                        </div>

                    </div>
                `;

                return;
            }


            const currentUsername =
                getUserUsername(currentUser);


            container.innerHTML =
                messages
                    .map(message => {

                        const mine =
                            message.sender_username ===
                            currentUsername;


                        return `
                            <div class="message-row ${
                                mine
                                    ? "mine"
                                    : "theirs"
                            }">

                                <div class="message-bubble">

                                    <div class="message-text">
                                        ${escapeHTML(
                                            message.message
                                        )}
                                    </div>

                                    <div class="message-time">
                                        ${escapeHTML(
                                            formatMessageDate(
                                                message.created_at
                                            )
                                        )}
                                    </div>

                                </div>

                            </div>
                        `;

                    })
                    .join("");


            container.scrollTop =
                container.scrollHeight;


        } catch (error) {

            console.error(
                "Display messages error:",
                error
            );


            container.innerHTML = `
                <div class="error-message">
                    حدث خطأ أثناء تحميل الرسائل
                </div>
            `;

        } finally {

            messagesLoading = false;

        }

    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        if (!currentUser) {

            alert(
                "لم يتم التعرف على المستخدم الحالي"
            );

            return;
        }


        if (!selectedUser) {

            alert(
                "اختر مستخدماً أولاً"
            );

            return;
        }


        const input =
            document.getElementById(
                "messageInput"
            );


        const button =
            document.getElementById(
                "sendButton"
            );


        const text =
            input.value.trim();


        if (!text) return;


        const currentUsername =
            getUserUsername(currentUser);


        if (!currentUsername) {

            alert(
                "اسم المستخدم غير موجود"
            );

            return;
        }


        button.disabled = true;


        try {

            const { error } =
                await supabaseClient
                    .from("private_messages")
                    .insert({

                        sender_username:
                            currentUsername,

                        sender_name:
                            currentUser.name ||
                            currentUsername,

                        receiver_username:
                            selectedUser,

                        message:
                            text

                    });


            if (error) {

                console.error(
                    "Send message error:",
                    error
                );

                throw error;

            }


            input.value = "";


            input.style.height =
                "45px";


            await displayMessages();


        } catch (error) {

            console.error(
                error
            );


            alert(
                "حدث خطأ أثناء إرسال الرسالة"
            );

        } finally {

            button.disabled = false;

            input.focus();

        }

    }


    /* =========================================================
       MARK MESSAGES AS READ
    ========================================================= */

    async function markMessagesAsRead(username) {

        if (!currentUser || !username) {
            return;
        }


        const currentUsername =
            getUserUsername(currentUser);


        const { error } =
            await supabaseClient
                .from("private_messages")
                .update({
                    is_read: true
                })
                .eq(
                    "sender_username",
                    username
                )
                .eq(
                    "receiver_username",
                    currentUsername
                )
                .eq(
                    "is_read",
                    false
                );


        if (error) {

            console.error(
                "Mark read error:",
                error
            );

        }

    }


    /* =========================================================
       REALTIME
    ========================================================= */

    function startRealtime() {

        if (realtimeChannel) {

            try {

                supabaseClient.removeChannel(
                    realtimeChannel
                );

            } catch (e) {}

        }


        realtimeChannel =
            supabaseClient
                .channel(
                    "private-messages-" +
                    Date.now()
                )
                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: "private_messages"
                    },
                    async payload => {

                        const row =
                            payload.new ||
                            payload.old;


                        if (!row || !currentUser) {
                            return;
                        }


                        const currentUsername =
                            getUserUsername(
                                currentUser
                            );


                        const belongsToMe =
                            row.sender_username ===
                                currentUsername ||

                            row.receiver_username ===
                                currentUsername;


                        if (!belongsToMe) {
                            return;
                        }


                        const isCurrentChat =
                            selectedUser && (

                                (
                                    row.sender_username ===
                                    currentUsername &&

                                    row.receiver_username ===
                                    selectedUser
                                )

                                ||

                                (
                                    row.sender_username ===
                                    selectedUser &&

                                    row.receiver_username ===
                                    currentUsername
                                )

                            );


                        if (isCurrentChat) {

                            if (
                                row.receiver_username ===
                                currentUsername
                            ) {

                                await markMessagesAsRead(
                                    selectedUser
                                );

                            }


                            await displayMessages();

                        }


                        await displayUsers();

                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "Chat realtime:",
                            status
                        );

                    }
                );

    }


    /* =========================================================
       TEXTAREA
    ========================================================= */

    function setupMessageInput() {

        const input =
            document.getElementById(
                "messageInput"
            );


        input.addEventListener(
            "input",
            function () {

                this.style.height =
                    "45px";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        120
                    ) + "px";

            }
        );


        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );

    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initChat() {

        currentUser =
            loadCurrentUser();


        const userText =
            document.getElementById(
                "currentUserText"
            );


        if (!currentUser) {

            userText.innerHTML = `
                ⚠️ لم يتم تسجيل الدخول
            `;

            document.getElementById(
                "usersList"
            ).innerHTML = `
                <div class="error-message">
                    لم يتم العثور على المستخدم الحالي.
                </div>
            `;

            return;
        }


        const username =
            getUserUsername(
                currentUser
            );


        userText.innerHTML = `
            👤 أنت الآن:
            <strong>
                ${escapeHTML(
                    currentUser.name ||
                    username
                )}
            </strong>
        `;


        setupMessageInput();


        await displayUsers();


        startRealtime();

    }


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        initChat
    );


    /* =========================================================
       FALLBACK REFRESH
       في حالة انقطاع Realtime
    ========================================================= */

    setInterval(
        async function () {

            if (!currentUser) return;

            await displayUsers();

            if (selectedUser) {
                await displayMessages();
            }

        },
        10000
    );


    /* =========================================================
       CLEANUP
    ========================================================= */

    window.addEventListener(
        "beforeunload",
        function () {

            if (realtimeChannel) {

                try {

                    supabaseClient.removeChannel(
                        realtimeChannel
                    );

                } catch (e) {}

            }

        }
    );

</script>

</body>
</html>
