<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>الدردشة</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           صفحة الدردشة
        ========================================= */

        .chat-page {

            padding: 25px;

        }


        .chat-header {

            background: white;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);

        }


        .chat-header h1 {

            margin: 0;

        }


        .chat-header p {

            margin: 5px 0 0;

            color: #777;

        }


        .back-button {

            border: none;

            background: #333;

            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

        }


        /* =========================================
           قائمة المستخدمين
        ========================================= */

        .users-container {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));

            gap: 15px;

        }


        .user-card {

            background: white;

            border-radius: 15px;

            padding: 18px;

            cursor: pointer;

            border: 2px solid transparent;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);

            transition: 0.2s;

            position: relative;

        }


        .user-card:hover {

            transform: translateY(-3px);

            border-color: #198754;

        }


        .user-card-top {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-avatar {

            width: 50px;

            height: 50px;

            border-radius: 50%;

            background: #eee;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

        }


        .user-name {

            font-weight: bold;

            font-size: 17px;

        }


        .user-role {

            color: #777;

            font-size: 13px;

            margin-top: 4px;

        }


        .online-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #20c997;

            display: inline-block;

            margin-left: 5px;

        }


        .new-message {

            position: absolute;

            top: 12px;

            left: 12px;

            background: #d92d20;

            color: white;

            border-radius: 20px;

            padding: 3px 8px;

            font-size: 11px;

            font-weight: bold;

        }


        /* =========================================
           شاشة المحادثة
        ========================================= */

        .chat-window {

            display: none;

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);

        }


        .chat-person {

            padding: 18px;

            background: #f5f5f5;

            display: flex;

            align-items: center;

            gap: 12px;

            border-bottom: 1px solid #ddd;

        }


        .chat-person-name {

            font-weight: bold;

            font-size: 18px;

        }


        .chat-person-role {

            font-size: 13px;

            color: #777;

        }


        .messages {

            height: 450px;

            overflow-y: auto;

            padding: 20px;

            background: #fafafa;

        }


        .message {

            margin-bottom: 15px;

            max-width: 75%;

            padding: 10px 14px;

            border-radius: 12px;

            word-wrap: break-word;

        }


        .message.mine {

            margin-right: auto;

            background: #198754;

            color: white;

            border-bottom-left-radius: 3px;

        }


        .message.theirs {

            margin-left: auto;

            background: white;

            border: 1px solid #ddd;

            border-bottom-right-radius: 3px;

        }


        .message-sender {

            font-size: 11px;

            font-weight: bold;

            margin-bottom: 5px;

            opacity: 0.8;

        }


        .message-time {

            font-size: 10px;

            margin-top: 5px;

            opacity: 0.7;

        }


        .message-input-area {

            display: flex;

            gap: 10px;

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;

        }


        .message-input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }


        .send-button {

            border: none;

            background: #198754;

            color: white;

            padding: 12px 22px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

        }


        .send-button:hover {

            opacity: 0.9;

        }


        .back-users {

            border: none;

            background: #555;

            color: white;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

        }


        .empty-users {

            background: white;

            padding: 30px;

            text-align: center;

            border-radius: 15px;

        }


        @media (max-width: 600px) {

            .chat-page {

                padding: 12px;

            }

            .messages {

                height: 55vh;

            }

            .message {

                max-width: 88%;

            }

        }

    </style>

</head>


<body>

    <div class="chat-page">


        <!-- =========================================
             رأس الصفحة
        ========================================= -->

        <div class="chat-header">

            <div>

                <h1>
                    💬 الدردشة
                </h1>

                <p id="currentUserText">
                    جاري التحميل...
                </p>

            </div>


            <button
                class="back-button"
                onclick="goHome()">

                🏠 الرئيسية

            </button>

        </div>


        <!-- =========================================
             قائمة الحسابات
        ========================================= -->

        <div id="usersSection">

            <div class="users-container"
                 id="usersContainer">

            </div>

        </div>


        <!-- =========================================
             نافذة المحادثة
        ========================================= -->

        <div
            class="chat-window"
            id="chatWindow">


            <div class="chat-person">

                <button
                    class="back-users"
                    onclick="showUsers()">

                    ↩ رجوع

                </button>


                <div class="user-avatar">

                    👤

                </div>


                <div>

                    <div
                        class="chat-person-name"
                        id="chatPersonName">

                    </div>

                    <div
                        class="chat-person-role"
                        id="chatPersonRole">

                    </div>

                </div>

            </div>


            <!-- الرسائل -->

            <div
                class="messages"
                id="messages">

            </div>


            <!-- كتابة الرسالة -->

            <div class="message-input-area">

                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="اكتب رسالتك هنا...">

                <button
                    class="send-button"
                    onclick="sendMessage()">

                    إرسال ➤

                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>


    <script>

        // =========================================
        // المستخدم الحالي
        // =========================================

        let currentUser = null;

        let selectedUser = null;


        // =========================================
        // أسماء الأقسام
        // =========================================

        const roleNames = {

            admin:
                "المدير",

            wiring:
                "قسم Wiring",

            lt:
                "قسم LT",

            ht:
                "قسم HT",

            installation:
                "قسم التركيبات",

            final:
                "قسم الفنش النهائي"

        };


        // =========================================
        // الحصول على المستخدم الحالي
        // =========================================

        function loadCurrentUser() {

            currentUser =
                getCurrentUser();


            if (!currentUser) {

                window.location.href =
                    "login.html";

                return false;

            }


            const text =
                document.getElementById(
                    "currentUserText"
                );


            if (text) {

                text.innerText =
                    "مرحبًا " +
                    currentUser.name +
                    " — " +
                    (
                        roleNames[
                            currentUser.role
                        ] ||
                        "مستخدم"
                    );

            }


            return true;

        }


        // =========================================
        // إنشاء قائمة الحسابات
        // =========================================

        function displayUsers() {

            const container =
                document.getElementById(
                    "usersContainer"
                );


            if (!container) {
                return;
            }


            container.innerHTML = "";


            const usernames =
                Object.keys(users);


            let foundOtherUser = false;


            usernames.forEach(
                function(username) {

                    const user =
                        users[username];


                    // لا تعرض حساب المستخدم الحالي

                    if (
                        username ===
                        currentUser.username
                    ) {

                        return;

                    }


                    foundOtherUser = true;


                    const unread =
                        getUnreadCount(
                            username
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "user-card";


                    card.onclick =
                        function() {

                            openPrivateChat(
                                username
                            );

                        };


                    card.innerHTML = `

                        <div class="user-card-top">

                            <div class="user-avatar">
                                👤
                            </div>

                            <div>

                                <div class="user-name">

                                    <span class="online-dot"></span>

                                    ${escapeHtml(
                                        user.name
                                    )}

                                </div>

                                <div class="user-role">

                                    ${
                                        roleNames[
                                            user.role
                                        ] ||
                                        "مستخدم"
                                    }

                                </div>

                            </div>

                        </div>


                        ${
                            unread > 0
                            ? `

                                <div class="new-message">

                                    🔴 ${unread} جديدة

                                </div>

                            `
                            : ""

                        }

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


            if (!foundOtherUser) {

                container.innerHTML = `

                    <div class="empty-users">

                        لا يوجد مستخدمون آخرون للدردشة.

                    </div>

                `;

            }

        }


        // =========================================
        // مفتاح تخزين الرسائل
        // =========================================

        function getChatStorageKey(
            username1,
            username2
        ) {

            const names = [

                username1,
                username2

            ].sort();


            return (
                "privateChat_" +
                names[0] +
                "_" +
                names[1]
            );

        }


        // =========================================
        // قراءة رسائل المحادثة
        // =========================================

        function getChatMessages(
            username1,
            username2
        ) {

            const key =
                getChatStorageKey(
                    username1,
                    username2
                );


            try {

                const data =
                    JSON.parse(
                        localStorage.getItem(
                            key
                        ) || "[]"
                    );


                return Array.isArray(data)
                    ? data
                    : [];

            } catch (error) {

                return [];

            }

        }


        // =========================================
        // حفظ الرسائل
        // =========================================

        function saveChatMessages(
            username1,
            username2,
            messages
        ) {

            const key =
                getChatStorageKey(
                    username1,
                    username2
                );


            localStorage.setItem(
                key,
                JSON.stringify(messages)
            );

        }


        // =========================================
        // فتح محادثة خاصة
        // =========================================

        function openPrivateChat(
            username
        ) {

            const user =
                users[username];


            if (!user) {
                return;
            }


            selectedUser =
                username;


            document.getElementById(
                "usersSection"
            ).style.display =
                "none";


            document.getElementById(
                "chatWindow"
            ).style.display =
                "block";


            document.getElementById(
                "chatPersonName"
            ).innerText =
                user.name;


            document.getElementById(
                "chatPersonRole"
            ).innerText =
                roleNames[
                    user.role
                ] || "مستخدم";


            markMessagesAsRead(
                username
            );


            displayMessages();


            const input =
                document.getElementById(
                    "messageInput"
                );


            if (input) {

                input.focus();

            }

        }


        // =========================================
        // الرجوع لقائمة المستخدمين
        // =========================================

        function showUsers() {

            selectedUser =
                null;


            document.getElementById(
                "chatWindow"
            ).style.display =
                "none";


            document.getElementById(
                "usersSection"
            ).style.display =
                "block";


            displayUsers();

        }


        // =========================================
        // إرسال رسالة
        // =========================================

        function sendMessage() {

            if (!selectedUser) {

                return;

            }


            const input =
                document.getElementById(
                    "messageInput"
                );


            if (!input) {
                return;
            }


            const text =
                input.value.trim();


            if (!text) {
                return;
            }


            const messages =
                getChatMessages(
                    currentUser.username,
                    selectedUser
                );


            messages.push({

                id:
                    "msg_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2,8),

                sender:
                    currentUser.username,

                senderName:
                    currentUser.name,

                receiver:
                    selectedUser,

                text:
                    text,

                date:
                    getCurrentDateTime(),

                read:
                    false

            });


            saveChatMessages(
                currentUser.username,
                selectedUser,
                messages
            );


            input.value =
                "";


            displayMessages();

        }


        // =========================================
        // عرض الرسائل
        // =========================================

        function displayMessages() {

            if (!selectedUser) {
                return;
            }


            const container =
                document.getElementById(
                    "messages"
                );


            if (!container) {
                return;
            }


            const messages =
                getChatMessages(
                    currentUser.username,
                    selectedUser
                );


            container.innerHTML = "";


            if (
                messages.length === 0
            ) {

                container.innerHTML = `

                    <div style="
                        text-align:center;
                        color:#888;
                        padding:40px 10px;
                    ">

                        💬 لا توجد رسائل بعد

                        <br>

                        ابدأ المحادثة الآن

                    </div>

                `;

                return;

            }


            messages.forEach(
                function(message) {

                    const mine =
                        message.sender ===
                        currentUser.username;


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "message " +
                        (
                            mine
                            ? "mine"
                            : "theirs"
                        );


                    div.innerHTML = `

                        <div class="message-sender">

                            ${escapeHtml(
                                message.senderName ||
                                message.sender
                            )}

                        </div>


                        <div>

                            ${escapeHtml(
                                message.text
                            )}

                        </div>


                        <div class="message-time">

                            ${escapeHtml(
                                message.date ||
                                ""
                            )}

                        </div>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );


            container.scrollTop =
                container.scrollHeight;

        }


        // =========================================
        // عدد الرسائل غير المقروءة
        // =========================================

        function getUnreadCount(
            username
        ) {

            if (!currentUser) {
                return 0;
            }


            const messages =
                getChatMessages(
                    currentUser.username,
                    username
                );


            return messages.filter(
                function(message) {

                    return (
                        message.receiver ===
                        currentUser.username &&
                        message.read !== true
                    );

                }
            ).length;

        }


        // =========================================
        // تعليم الرسائل كمقروءة
        // =========================================

        function markMessagesAsRead(
            username
        ) {

            const messages =
                getChatMessages(
                    currentUser.username,
                    username
                );


            let changed = false;


            messages.forEach(
                function(message) {

                    if (
                        message.receiver ===
                        currentUser.username &&
                        message.read !== true
                    ) {

                        message.read =
                            true;

                        changed =
                            true;

                    }

                }
            );


            if (changed) {

                saveChatMessages(
                    currentUser.username,
                    username,
                    messages
                );

            }

        }


        // =========================================
        // حماية النص
        // =========================================

        function escapeHtml(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.innerText =
                text == null
                    ? ""
                    : String(text);


            return div.innerHTML;

        }


        // =========================================
        // الضغط على Enter للإرسال
        // =========================================

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    const active =
                        document.activeElement;


                    if (
                        active &&
                        active.id ===
                        "messageInput"
                    ) {

                        event.preventDefault();

                        sendMessage();

                    }

                }

            }
        );


        // =========================================
        // تحديث الرسائل تلقائيًا
        // =========================================

        setInterval(
            function() {

                if (selectedUser) {

                    displayMessages();

                }

                else {

                    displayUsers();

                }

            },
            2000
        );


        // =========================================
        // تشغيل الصفحة
        // =========================================

        if (
            loadCurrentUser()
        ) {

            displayUsers();

        }

    </script>

</body>

</html>
